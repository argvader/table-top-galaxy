AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Table Top Galaxy web hosting: private S3 bucket served only through CloudFront (Origin Access Control),
  HTTPS only. Cognito sign-in protects the app's data; the app itself carries no book content. The prototypes
  do, so anything outside the app stays behind a basic-auth password.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  BasicAuthUser:
    Type: String
    NoEcho: true
    MinLength: 1
  BasicAuthPassword:
    Type: String
    NoEcho: true
    MinLength: 12
  # All three stay empty until bb domain:infra has run; the site then answers on its cloudfront.net name only.
  SiteDomain:
    Type: String
    Default: ""
  HostedZoneId:
    Type: String
    Default: ""
  CertificateArn:
    Type: String
    Default: ""

Conditions:
  HasDomain: !Not [!Equals [!Ref SiteDomain, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ttg-web-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: app, Value: table-top-galaxy }
        - { Key: stage, Value: !Ref Stage }

  # Separate from the site bucket because bb web:deploy syncs that one with --delete, which would erase every portrait.
  PortraitBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "ttg-web-portraits-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: app, Value: table-top-galaxy }
        - { Key: stage, Value: !Ref Stage }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "ttg-web-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Viewer-request gate. The app, portraits and landing pages are open, because the app's data sits behind Cognito at
  # the API. Everything else needs the password, so a new prototype page is covered without anyone remembering to add it.
  BasicAuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "ttg-web-${Stage}-basic-auth"
      AutoPublish: true
      FunctionConfig:
        Comment: Clean URLs for the app, and a password gate for anything outside it
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;
            // The app's clean URLs (/campaigns/x): any path without a file extension outside the prototypes.
            if (!/\.[^\/]*$/.test(uri) && !/^\/prototypes(\/|$)/.test(uri)) {
              request.uri = "/index.html";
              return request;
            }
            var open = /^\/(index\.html|404\.html|robots\.txt|css\/.*|js\/.*|roller\/.*|portraits\/.*)$/;
            var auth = request.headers.authorization;
            if (!open.test(uri) && !(auth && auth.value === "Basic ${Token}")) {
              return {
                statusCode: 401,
                statusDescription: "Unauthorized",
                headers: { "www-authenticate": { value: "Basic realm=\"Table Top Galaxy\", charset=\"UTF-8\"" } }
              };
            }
            if (/^\/prototypes\/?$/.test(uri)) { request.uri = "/prototypes/index.html"; }
            return request;
          }
        - Token: !Base64 { "Fn::Sub": "${BasicAuthUser}:${BasicAuthPassword}" }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Table Top Galaxy web (${Stage})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If [HasDomain, [!Ref SiteDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - !Ref AWS::NoValue
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: portraits
            DomainName: !GetAtt PortraitBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        CacheBehaviors:
          - PathPattern: portraits/*
            TargetOriginId: portraits
            ViewerProtocolPolicy: redirect-to-https
            Compress: false          # JPEGs are already compressed
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized
            ResponseHeadersPolicyId: !Ref ResponseHeaders
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref ResponseHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt BasicAuthFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403          # S3 answers 403 for missing keys when the bucket isn't listable
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - { Key: app, Value: table-top-galaxy }
        - { Key: stage, Value: !Ref Stage }

  SiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2        # CloudFront's fixed alias zone

  ResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "ttg-web-${Stage}-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
        CustomHeadersConfig:
          Items:
            - { Header: X-Robots-Tag, Value: "noindex, nofollow", Override: true }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  PortraitBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PortraitBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${PortraitBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  PortraitBucket:
    Value: !Ref PortraitBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If [HasDomain, !Sub "https://${SiteDomain}", !Sub "https://${Distribution.DomainName}"]
