<title>Genesys Character Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: same ship-console tokens as the dice roller. Desktop = identity + stat band + vitals across the top,
   skills column on the left, tabbed detail on the right, roll drawer slides in from the right.
   Phone = one column, sticky tab strip (Skills first), roll drawer as a bottom sheet. */
:root {
  --bg: #e6ecec; --surface: #f6f9f9; --surface-2: #edf2f2; --ink: #12201f; --muted: #586a69; --line: #c6d2d1;
  --accent: #0d6f78; --accent-ink: #ffffff; --good: #1f7a3a; --warn: #9a6200; --bad: #a32b2b;
  --wound: #b23a3a; --strain: #2f6fb0;
  --die-stroke: rgba(0,0,0,.18); --shadow: 0 1px 2px rgba(18,32,31,.08), 0 10px 30px rgba(18,32,31,.16);
  --f-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --d-ability: #3f9b46; --d-prof: #f2c230; --d-boost: #8fd0ea; --d-diff: #5b3c8f; --d-chal: #b8262f; --d-set: #1b1b1d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1214; --surface: #141d20; --surface-2: #1a252a; --ink: #e2ebeb; --muted: #8ea1a2; --line: #26363b;
    --accent: #49bfc8; --accent-ink: #062224; --good: #5fcf7e; --warn: #e3b04b; --bad: #f07a7a;
    --wound: #f07a7a; --strain: #78b4ef;
    --die-stroke: rgba(255,255,255,.28); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1214; --surface: #141d20; --surface-2: #1a252a; --ink: #e2ebeb; --muted: #8ea1a2; --line: #26363b;
  --accent: #49bfc8; --accent-ink: #062224; --good: #5fcf7e; --warn: #e3b04b; --bad: #f07a7a;
  --wound: #f07a7a; --strain: #78b4ef;
  --die-stroke: rgba(255,255,255,.28); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 600; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1320px; margin: 0 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); white-space: nowrap; }
.tag.gm { border-style: dashed; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 6px; }
.proto { font-size: 12px; padding: 2px 8px; border: 1px dashed var(--line); border-radius: 99px; color: var(--muted); }
.spacer { flex: 1; }

/* Story points (shared group pool) */
.story { position: relative; display: flex; align-items: center; gap: 8px; }
.tokens { display: flex; gap: 4px; }
.tok { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); cursor: pointer; padding: 0; position: relative; }
.tok.player { background: var(--surface); }
.tok.player::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--accent); }
.tok.gm { background: var(--ink); cursor: default; }
.tok.gm::after { content: ""; position: absolute; inset: 7px; transform: rotate(45deg); background: var(--surface); border-radius: 2px; }
.tok.flip { animation: flip .5s ease; }
@keyframes flip { 0% { transform: rotateY(0) } 50% { transform: rotateY(90deg) } 100% { transform: rotateY(0) } }
@media (prefers-reduced-motion: reduce) { .tok.flip { animation: none; } }
.sp-count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.sp-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 8px; }
.sp-menu p { margin: 0; font-size: 13px; color: var(--muted); }
.sp-menu .btn { text-align: left; }
.chip.sp { border-color: var(--accent); }
.chip.sp .tok-mini { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); position: relative; }
.chip.sp .tok-mini::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent); }

/* Identity */
.ident { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-block: 16px 12px; }
.portrait { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-display); font-size: 26px; font-weight: 700;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--surface)), var(--surface-2)); border: 1px solid var(--line); }
.ident h1 { margin: 0; font-family: var(--f-display); font-size: 34px; line-height: 1; font-weight: 700; text-wrap: balance; }
.ident .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.xp { text-align: right; }
.xp b { font-family: var(--f-mono); font-size: 22px; display: block; line-height: 1.1; }
.xp span { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .ident { grid-template-columns: auto minmax(0, 1fr); } .xp { grid-column: 1 / -1; text-align: left; display: flex; gap: 8px; align-items: baseline; } .xp b { display: inline; } .ident h1 { font-size: 28px; } }

/* Characteristics */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px 6px; text-align: center; cursor: pointer; position: relative; }
.stat:hover { border-color: var(--accent); }
.stat b { display: block; font-family: var(--f-display); font-size: 38px; line-height: 1; font-weight: 700; }
.stat span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stat b { font-size: 30px; } }

/* Vitals */
.vitals { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.4fr) repeat(3, minmax(0, .8fr)); gap: 8px; margin-top: 8px; }
@media (max-width: 1000px) { .vitals { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vitals .small { grid-column: span 1; } }
@media (max-width: 1000px) and (min-width: 561px) { .vitals { grid-template-columns: repeat(6, minmax(0, 1fr)); } .vitals .track { grid-column: span 3; } .vitals .small { grid-column: span 2; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.track { padding: 10px 12px; }
.track.over { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.track .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.track .val { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.track .val b { font-size: 26px; color: var(--ink); }
.pips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; margin: 8px 0; }
.pips i { height: 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.pips.wound i.on { background: var(--wound); border-color: var(--wound); }
.pips.strain i.on { background: var(--strain); border-color: var(--strain); }
.pips i.over { background: var(--bad); border-color: var(--bad); opacity: .55; }
.track .ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.track .ctl .step { width: 34px; height: 30px; padding: 0; font-weight: 700; font-size: 16px; }
.hit { display: flex; gap: 6px; align-items: center; }
.hit input { width: 62px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.alert { margin-top: 8px; font-size: 13px; color: var(--bad); font-weight: 700; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.small { padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.small b { font-family: var(--f-display); font-size: 32px; line-height: 1; }
.small .pair { display: flex; gap: 14px; }
.small .pair div { display: flex; flex-direction: column; }
.small .pair small { font-size: 11px; color: var(--muted); }
.small .why { font-size: 12px; color: var(--muted); }
.enc-bar { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.enc-bar i { display: block; height: 100%; background: var(--accent); }

/* Main */
.main { display: grid; gap: 16px; margin-top: 16px; }
@media (min-width: 1000px) { .main { grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); align-items: start; } }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 600; letter-spacing: .03em; }
.search { margin: 0 14px 8px; display: block; width: calc(100% - 28px); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.group > .label { padding: 8px 14px 4px; display: block; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 14px; text-align: left; cursor: pointer; border-top: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.srow:hover { background: var(--surface-2); }
.srow .nm { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .nm i { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 4px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: middle; }
.dot.off { background: transparent; border: 1px solid var(--line); }
.ranks { display: inline-flex; gap: 2px; }
.ranks i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); }
.ranks i.on { background: var(--ink); border-color: var(--ink); }
.mini { display: flex; gap: 2px; min-width: 54px; justify-content: flex-end; }
.mini svg { width: 17px; height: 17px; }

/* Tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 11px 12px 9px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--f-mono); font-size: 11px; margin-left: 4px; color: var(--muted); }
.tabbody { padding: 14px; }
@media (max-width: 999px) {
  .tabs.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-radius: 12px 12px 0 0; }
  [data-desk-only] { display: none !important; }
}
@media (min-width: 1000px) { [data-phone-only] { display: none !important; } }
.list { display: grid; gap: 8px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); display: grid; gap: 4px; }
.item .row1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.item h3 { margin: 0; font-size: 16px; font-weight: 700; }
.item .meta { font-size: 13px; color: var(--muted); }
.item p { margin: 0; font-size: 14px; }
.item .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.weap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.weap .stats-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.weap .stats-row b { color: var(--ink); font-family: var(--f-mono); }
.pyramid { display: grid; gap: 4px; justify-items: center; margin-bottom: 14px; }
.pyramid .tier { display: flex; gap: 4px; align-items: center; }
.pyramid .tier span { font-size: 11px; color: var(--muted); width: 52px; text-align: right; margin-right: 6px; }
.pyramid .slot { width: 30px; height: 18px; border-radius: 4px; border: 1px dashed var(--line); }
.pyramid .slot.on { background: var(--accent); border: 1px solid var(--accent); }
.pyr-ok { font-size: 12px; color: var(--good); text-align: center; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.sect { margin-bottom: 18px; }
.sect > h3 { margin: 0 0 8px; font-family: var(--f-display); font-size: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.debt-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.debt-big b { font-family: var(--f-display); font-size: 44px; line-height: 1; }
.corp { font-weight: 700; }
textarea { width: 100%; min-height: 220px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); resize: vertical; line-height: 1.5; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist time { color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
.critroll { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 12px; }
.critroll b { font-family: var(--f-mono); font-size: 20px; }

/* Roll drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
.drawer { position: fixed; z-index: 31; background: var(--surface); box-shadow: var(--shadow); flex-direction: column; overflow: hidden; }
.drawer:not([hidden]) { display: flex; }
@media (min-width: 760px) { .drawer { top: 0; right: 0; bottom: 0; width: min(440px, 100%); border-left: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0; } }
@media (max-width: 759px) { .drawer { left: 0; right: 0; bottom: 0; max-height: 88vh; border-radius: 16px 16px 0 0; border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); } }
.drawer .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
@media (min-width: 760px) { .drawer .grab { display: none; } }
.drawer header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 12px 16px 8px; }
.drawer h2 { margin: 0; font-family: var(--f-display); font-size: 26px; line-height: 1.05; font-weight: 700; }
.drawer .meta { font-size: 13px; color: var(--muted); }
.drawer .body { overflow: auto; padding: 0 16px 16px; display: grid; gap: 12px; }
.x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.tray { border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 12px; min-height: 76px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tray .vs { font-family: var(--f-display); color: var(--muted); padding: 0 4px; font-size: 13px; letter-spacing: .1em; }
.die { border: 0; background: none; padding: 0; cursor: pointer; line-height: 0; }
.die svg { width: 44px; height: 44px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .dp { display: inline-flex; gap: 2px; }
.chip .dp i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--d-diff); display: inline-block; }
.chip small { color: var(--muted); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .75; }
.chip svg { width: 16px; height: 16px; }
.rollbtn { width: 100%; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 18px; cursor: pointer; }
.rollbtn:disabled { opacity: .4; cursor: not-allowed; }
.verdict h3 { margin: 0; font-family: var(--f-display); font-size: 30px; line-height: 1; font-weight: 700; }
.verdict h3.ok { color: var(--good); } .verdict h3.no { color: var(--bad); }
.verdict p { margin: 4px 0 0; color: var(--muted); }
.net { display: flex; flex-wrap: wrap; gap: 6px; }
.net .n { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: var(--surface-2); font-size: 14px; }
.net .n svg { width: 18px; height: 18px; }
.net .n b { font-family: var(--f-mono); }
.rolled { display: flex; flex-wrap: wrap; gap: 4px; }
.rolled svg { width: 36px; height: 36px; }
.rolled.tumble svg { animation: tumble .45s ease-out; }
@keyframes tumble { 0% { transform: rotate(-200deg) scale(.6); opacity: .2 } 100% { transform: none; opacity: 1 } }
.dmg { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.dmg b { font-family: var(--f-mono); font-size: 22px; }
.dmg .crit { font-weight: 700; color: var(--bad); }
.opt { display: grid; grid-template-columns: 50px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; cursor: pointer; margin-bottom: 6px; font-size: 14px; }
.opt:disabled { opacity: .4; cursor: not-allowed; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt .cost { display: inline-flex; gap: 1px; } .opt .cost svg { width: 14px; height: 14px; }
.spent { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.spent span { border: 1px dashed var(--line); border-radius: 99px; padding: 2px 8px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.readonly { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
h4 .left { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
h4 .left svg { width: 13px; height: 13px; vertical-align: -2px; }
#dice3d { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; transition: opacity .6s ease; }
#dice3d.fade { opacity: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 99px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .rolled.tumble svg { animation: none; } #dice3d { transition: none; } }
</style>
