<title>Campaign Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Same ship-console tokens as the dashboard. One section at a time under a sticky tab strip; details open in a
   side drawer (bottom sheet on phones). GM-only things carry a dashed purple edge and vanish in "Player view". */
:root {
  --bg: #e6ecec; --surface: #f6f9f9; --surface-2: #edf2f2; --ink: #12201f; --muted: #586a69; --line: #c6d2d1;
  --accent: #0d6f78; --accent-ink: #ffffff; --good: #1f7a3a; --warn: #9a6200; --bad: #a32b2b; --gm: #7a4bb0;
  --shadow: 0 1px 2px rgba(18,32,31,.08), 0 10px 30px rgba(18,32,31,.16);
  --f-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --pc-1: #0d6f78; --pc-2: #7a4bb0; --pc-3: #9a6200; --pc-4: #2f6fb0; --pc-5: #b23a3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1214; --surface: #141d20; --surface-2: #1a252a; --ink: #e2ebeb; --muted: #8ea1a2; --line: #26363b;
    --accent: #49bfc8; --accent-ink: #062224; --good: #5fcf7e; --warn: #e3b04b; --bad: #f07a7a; --gm: #b79be0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    --pc-1: #49bfc8; --pc-2: #b79be0; --pc-3: #e3b04b; --pc-4: #78b4ef; --pc-5: #f07a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1214; --surface: #141d20; --surface-2: #1a252a; --ink: #e2ebeb; --muted: #8ea1a2; --line: #26363b;
  --accent: #49bfc8; --accent-ink: #062224; --good: #5fcf7e; --warn: #e3b04b; --bad: #f07a7a; --gm: #b79be0;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  --pc-1: #49bfc8; --pc-2: #b79be0; --pc-3: #e3b04b; --pc-4: #78b4ef; --pc-5: #f07a7a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 600; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1480px; margin: 0 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); white-space: nowrap; }
.tag.gm { border: 1px dashed var(--gm); color: var(--gm); }
.tag.bad { border-color: var(--bad); color: var(--bad); }
.tag.warn { border-color: var(--warn); color: var(--warn); }
.tag.ok { border-color: var(--good); color: var(--good); }
.tag.now { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.cite { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; vertical-align: 2px; white-space: nowrap; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.gmonly { border: 1px dashed var(--gm) !important; border-radius: 10px; padding: 8px 10px; background: color-mix(in srgb, var(--gm) 6%, transparent); display: grid; gap: 6px; }
.gmonly > .gmhd { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.gmonly p { margin: 0; }
.preview .gmonly { display: none; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 6px; }
.proto { font-size: 12px; padding: 2px 8px; border: 1px dashed var(--line); border-radius: 99px; color: var(--muted); }
.sess { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); }
.spacer { flex: 1; }
.dataset { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.dataset select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; }
@media (max-width: 759px) { .spacer, .proto { display: none; } }
.viewas { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.viewas button { border: 0; background: var(--surface); padding: 5px 12px; font-size: 13px; cursor: pointer; }
.viewas button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.banner { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 10px; padding: 8px 12px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: color-mix(in srgb, var(--accent) 7%, transparent); }

/* Tabs (every width) */
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 4px; border-bottom: 1px solid var(--line); scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); margin-top: 10px; }
.tabs button { border: 0; background: none; padding: 11px 12px 9px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 11px; margin-left: 5px; vertical-align: 1px; }

/* Section frame */
main { margin-top: 14px; display: grid; gap: 16px; }
.intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.intro h1 { margin: 0; font-family: var(--f-display); font-size: 30px; line-height: 1; font-weight: 700; }
.intro p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel > header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; padding: 12px 14px 8px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 600; letter-spacing: .03em; }
.panel h2 small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: 6px; }
.panel .pbody { padding: 0 14px 14px; display: grid; gap: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pcdot { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); flex: none; display: inline-block; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; color: var(--muted); font-size: 14px; display: grid; gap: 8px; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); display: grid; gap: 6px; font-size: 14px; min-width: 0; }
.item p { margin: 0; }
.item .row1 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.item h3 { margin: 0; font-size: 15px; line-height: 1.2; }
button.item { text-align: left; cursor: pointer; width: 100%; }
button.item:hover { border-color: var(--accent); }
.dim { opacity: .6; }
.sub { font-size: 13px; color: var(--muted); }

/* Arc: four acts as columns on desktop, an act switcher on phones */
.acts { display: grid; gap: 12px; align-items: start; }
@media (min-width: 1100px) { .acts { grid-template-columns: repeat(4, minmax(0, 1fr)); } .actpick { display: none !important; } }
@media (max-width: 1099px) { .act:not(.shown) { display: none; } }
.act { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px; display: grid; gap: 10px; align-content: start; }
.act.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.act.locked { background: transparent; border-style: dashed; }
.act > header { display: grid; gap: 2px; }
.act .kanji { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.act h2 { margin: 0; font-family: var(--f-display); font-size: 24px; line-height: 1; font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.act h2 small { font-weight: 500; font-size: 17px; color: var(--muted); }
.act > p { margin: 0; font-size: 14px; }
.sessions { display: grid; gap: 6px; }
.sesh { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: start; }
.sesh .n { width: 40px; height: 40px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; background: var(--surface-2); }
.sesh.now .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sesh.plan .n { background: transparent; border-style: dashed; color: var(--muted); }
.sesh b { display: block; font-size: 14px; }
.sesh .recap { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.choices { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.choice { font-size: 12px; border-radius: 99px; padding: 1px 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--ink); }
.thread { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 3px 0; cursor: pointer; font-size: 13px; }
.thread i { font-style: normal; font-family: var(--f-mono); font-size: 11px; min-width: 52px; color: var(--muted); }
.thread.live i { color: var(--accent); font-weight: 600; }
.thread.done span { text-decoration: line-through; color: var(--muted); }
.twist { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; cursor: pointer; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; }
.twist:has(input:checked) { border-color: var(--gm); background: color-mix(in srgb, var(--gm) 8%, transparent); }
.twist input { accent-color: var(--gm); margin-top: 3px; }
.seed { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; }
.payoff { display: flex; flex-wrap: wrap; gap: 4px; }

/* Ledger states */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--surface); padding: 4px 9px; font-size: 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"].hidden { background: var(--muted); color: var(--surface); }
.seg button[aria-pressed="true"].hinted { background: var(--warn); color: #fff; }
.seg button[aria-pressed="true"].revealed { background: var(--bad); color: #fff; }
.st { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; text-transform: uppercase; letter-spacing: .05em; }
.st.hidden { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.st.hinted { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.st.revealed { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.tally .t { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; background: var(--surface); display: grid; }
.tally .t b { font-family: var(--f-display); font-size: 26px; line-height: 1; }
.tally .t span { font-size: 12px; color: var(--muted); }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.lrow .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.clue { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; border-top: 1px solid var(--line); padding-top: 6px; }
.clue.unplanted p { color: var(--muted); }
.known { border-left: 4px solid var(--bad); }

/* Session 0 */
.qset { display: grid; gap: 8px; }
.q { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; display: grid; gap: 6px; }
.q.answered { border-left: 4px solid var(--accent); }
.q .qn { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.q .qt { font-size: 14px; font-weight: 700; }
.q .alt { font-size: 13px; color: var(--muted); }
.ans { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 8px; align-items: baseline; font-size: 14px; }
.ans .who { font-size: 12px; font-weight: 700; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.ans p { margin: 0; }
.ans .fu { grid-column: 2; font-size: 12px; color: var(--muted); font-style: italic; }
.draw { border: 1px solid var(--accent); border-radius: 12px; padding: 12px; display: grid; gap: 10px; background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.qcard { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px; display: grid; gap: 10px; align-content: space-between; min-height: 150px; box-shadow: var(--shadow); }
.qcard p { margin: 0; font-size: 15px; font-weight: 700; }
.dial { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.dial .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); grid-column: 2; gap: 8px; }
.pips { display: flex; gap: 4px; }
.pips button { flex: 1; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-family: var(--f-mono); font-size: 12px; }
.pips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.pips button:disabled { cursor: default; }
.lv { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.addrow { display: flex; flex-wrap: wrap; gap: 6px; }
.addrow input { flex: 1 1 200px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 1px; flex: none; }
.check.done span { color: var(--muted); text-decoration: line-through; }
.ship { display: grid; gap: 6px 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }

/* Cast + factions */
.npc .row1 h3 button { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 700; font-size: 15px; text-align: left; }
.npc .row1 h3 button:hover { color: var(--accent); }
.search { display: block; width: 100%; max-width: 320px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.corp { display: grid; gap: 8px; }
.corp h3 { margin: 0; font-family: var(--f-display); font-size: 22px; line-height: 1.05; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.debtor { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px 1px 7px; }
.warnline { font-size: 13px; color: var(--warn); margin: 0; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
.drawer { position: fixed; z-index: 31; background: var(--surface); box-shadow: var(--shadow); flex-direction: column; overflow: hidden; }
.drawer:not([hidden]) { display: flex; }
@media (min-width: 760px) { .drawer { top: 0; right: 0; bottom: 0; width: min(480px, 100%); border-left: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0; } }
@media (max-width: 759px) { .drawer { left: 0; right: 0; bottom: 0; max-height: 88vh; border-radius: 16px 16px 0 0; border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); } }
.drawer .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
@media (min-width: 760px) { .drawer .grab { display: none; } }
.drawer > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 12px 16px 8px; }
.drawer h2 { margin: 0; font-family: var(--f-display); font-size: 26px; line-height: 1.05; font-weight: 700; }
.drawer .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.drawer .body { overflow: auto; padding: 0 16px 16px; display: grid; gap: 14px; }
.drawer .body > * { min-width: 0; }
.drawer .tag { white-space: normal; }
.x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: 16px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.field { display: grid; gap: 4px; font-size: 13px; }
.field > span { color: var(--muted); }
.field textarea, .field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 14px; }
.field textarea { min-height: 76px; resize: vertical; line-height: 1.4; }
.gmonly .field textarea, .gmonly .field select, .gmonly .field input { border-color: color-mix(in srgb, var(--gm) 45%, var(--line)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 99px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
footer.foot { margin-top: 24px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">Table Top Galaxy<small>Manifest Destiny</small></div>
    <span class="proto">Prototype &middot; campaign manager</span>
    <span class="sess" id="sess"></span>
    <div class="spacer"></div>
    <label class="dataset"><span class="label">Data</span><select id="dataset">
      <option value="sample">Sample: mid-campaign</option><option value="blank">Fresh: before Session 0</option></select></label>
    <div class="viewas" role="group" aria-label="View as"><button type="button" data-view="gm" aria-pressed="true">GM</button><button type="button" data-view="player" aria-pressed="false">Player view</button></div>
  </header>
  <div class="banner" id="banner" hidden></div>

  // Sample Session 0 answers. Personal: each PC drew two and answered one.

  // The Wildsea-style draw: two personal cards per player, keep one.

  // ---------- Drawer ----------
  function openDrawer(kind, data) {

    $("scrim").hidden = false; $("drawer").hidden = false;
    const f = $("drawer").querySelector(S.d.focus || ".x"); if (f) f.focus();
  }
  function closeDrawer() { S.d = { open: false }; $("scrim").hidden = true; $("drawer").hidden = true; $("drawer").innerHTML = ""; renderAll(); }
  function renderDrawer() {
    if (!S.d.open) return;
    const [title, meta, body] = { session: drawerSession, npc: drawerNpc, secret: drawerSecret, question: drawerQuestion }[S.d.kind]();

  const actSelect = (path, val, label, none = "Not tied to an act") => `<label class="field"><span>${label}</span><select data-bind="${path}"><option value="">${none}</option>${ACTS.map((a) =>
    `<option value="${a.id}" ${val === a.id ? "selected" : ""}>${actLabel(a.id)}</option>`).join("")}</select></label>`;

    `<option value="${s.n}" ${val === s.n ? "selected" : ""}>Session ${s.n}: ${esc(s.title)}</option>`).join("")}`;

  function drawerSession() {
    const d = D(), i = d.sessions.findIndex((s) => s.n === S.d.n), s = d.sessions[i], p = `sessions.${i}`;
    const metHere = d.npcs.filter((n) => n.met === s.n), clues = d.ledger.flatMap((l) => l.clues.filter((c) => c.s === s.n).map((c) => ({ l, c })));

    const body = gm() ? `<label class="field"><span>Title</span><input data-bind="${p}.title" value="${esc(s.title)}"></label>
      ${area(`${p}.recap`, s.recap, "Recap \u00B7 players see this", "What happened, in the crew's words")}
      <div><h4>Choices that carry forward</h4><div class="choices">${s.choices.map((c, k) => `<span class="choice">${esc(c)} <button type="button" class="linkbtn" data-delchoice="${k}" aria-label="Remove">\u00D7</button></span>`).join("") || `<span class="note">None logged.</span>`}</div>
        <div class="addrow" style="margin-top:6px"><input id="choice-in" placeholder="The crew let Vasko go\u2026" aria-label="New choice"><button type="button" class="btn" data-act="add-choice">Add</button></div></div>
      <div class="gmonly"><div class="gmhd">${gmTag()}</div>${area(`${p}.prep`, s.prep, "Prep notes")}
        ${actSelect(`${p}.act`, s.act, "Act", "No act")}
        ${clues.length ? `<div><span class="label">Clues planted</span>${clues.map(({ l, c }) => `<p class="sub">${esc(c.t)} <button type="button" class="linkbtn" data-lopen="${l.id}">${esc(l.title)}</button></p>`).join("")}</div>` : ""}</div>
      ${metHere.length ? `<div><h4>First met</h4><div class="chips">${metHere.map((n) => `<button type="button" class="chip" data-nopen="${n.id}">${esc(n.name)}</button>`).join("")}</div></div>` : ""}
      <div class="chips">${s.status === "plan" ? `<button type="button" class="btn primary" data-act="start-session">Start this session</button><button type="button" class="btn danger" data-act="del-session">Delete</button>` : ""}
        ${s.status === "now" ? `<button type="button" class="btn" data-act="end-session">Mark played</button>` : ""}</div>`
      : `<p>${esc(s.recap) || "No recap yet."}</p>${s.choices.length ? `<div><h4>What the crew chose</h4><div class="choices">${s.choices.map((c) => `<span class="choice">${esc(c)}</span>`).join("")}</div></div>` : ""}
      ${metHere.length ? `<div><h4>First met</h4><p>${metHere.map((n) => esc(n.name)).join(", ")}</p></div>` : ""}`;
    return [`Session ${s.n}${s.title ? `: ${esc(s.title)}` : ""}`, `${actLabel(s.act)} \u00B7 ${status}`, body];
  }
  function drawerNpc() {
    const d = D(), i = d.npcs.findIndex((n) => n.id === S.d.id), n = d.npcs[i], p = `npcs.${i}`;
    const secrets = d.ledger.filter((l) => l.owner === n.id);
    const arc = ACTS.filter((a) => n.arc[a.id]).map((a) => `<dt>${a.name}</dt><dd>${esc(n.arc[a.id])}</dd>`).join("");
    const body = gm() ? `<label class="field"><span>Players have met them</span><select data-bind="${p}.met" data-num>${sessionOptions(n.met, "Not yet: hidden from players")}</select></label>

        ${secrets.map((l) => `<div class="seed">${stTag(l.state)}<button type="button" class="linkbtn" data-lopen="${l.id}">${esc(l.title)}</button></div>`).join("")}

      : `<p>${esc(n.pub)}</p>${secrets.filter((l) => l.state === "revealed").map((l) => `<div class="item known"><b>${esc(l.title)}</b><p>${esc(l.reveal)}</p></div>`).join("")}`;
    return [esc(n.name), `${esc(n.role)} \u00B7 ${esc(factionName(n.faction))}${n.met != null ? ` \u00B7 met ${sessionLabel(n.met)}` : ""}${n.dead ? ` <span class="tag bad">dead</span>` : ""}`, body];
  }
  function drawerSecret() {
    const d = D(), i = d.ledger.findIndex((l) => l.id === S.d.id), l = d.ledger[i], p = `ledger.${i}`;
    const clues = l.clues.map((c, k) => `<div class="clue${c.s == null ? " unplanted" : ""}"><p>${esc(c.t)}</p>${c.s != null
      ? `<button type="button" class="chip" data-plant="${k}" title="Unplant">${sessionLabel(c.s)} \u2713</button>` : `<button type="button" class="chip" data-plant="${k}">Plant ${d.session ? `in S${d.session}` : "now"}</button>`}</div>`).join("");
    const body = `<div class="lrow"><span class="note">Breaks in ${actLabel(l.act)}</span>${segHTML(l)}</div>
      ${area(`${p}.truth`, l.truth, "The truth")}

        <div class="addrow" style="margin-top:8px"><input id="clue-in" placeholder="Something the crew could notice" aria-label="New clue"><button type="button" class="btn" data-act="add-clue">Add clue</button></div></div>
      ${area(`${p}.reveal`, l.reveal, "When it's revealed, players read", "In the crew's words, not the GM's")}
      <label class="field"><span>Revealed in</span><select data-bind="${p}.revealedIn" data-num>${sessionOptions(l.revealedIn, "Not revealed")}</select></label>
      ${actSelect(`${p}.act`, l.act, "Planned to break in", "No act")}`;

  function drawerQuestion() {
    const d = D(), q = qById(S.d.id), answers = d.s0.answers[q.id] || [], set = QSETS.find((s) => s.id === q.set);
    const pcSel = (path, val, label, none) => `<label class="field"><span>${label}</span><select data-bind="${path}">${none ? `<option value="">${none}</option>` : ""}${PARTY.map((p) =>
      `<option value="${p.id}" ${val === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></label>`;
    const rows = answers.map((a, k) => { const p = `s0.answers.${q.id}.${k}`;
      return `<div class="item" style="--pc:${pcById(a.pc).color};border-left:4px solid var(--pc)"><div class="ship">${pcSel(`${p}.pc`, a.pc, "Answered by")}${q.set === "crew" ? pcSel(`${p}.about`, a.about, "About", "\u2014") : ""}</div>
        ${area(`${p}.text`, a.text, "Answer \u00B7 canon once said", "A few sentences. Leave gaps on purpose.")}
        ${q.set === "personal" ? `<label class="field"><span>Follow-up (one, may be declined)</span><input data-bind="${p}.follow" value="${esc(a.follow || "")}"></label>
          <div class="gmonly"><div class="gmhd">${gmTag()}</div>${actSelect(`${p}.act`, a.act, "Pays off in")}</div>` : ""}
        <div><button type="button" class="linkbtn" data-delans="${k}">Remove this answer</button></div></div>`; }).join("");
    const nextPc = q.set === "crew" ? PARTY.find((p) => !allAnswers().some(({ q: x, a }) => x.set === "crew" && a.pc === p.id)) : null;
    const body = `<p style="margin:0;font-weight:700">${esc(d.s0.alt[q.id] || q.text)}</p>
      ${q.fit ? `<p class="warnline">${esc(q.fit)}</p>` : ""}
      ${area(`s0.alt.${q.id}`, d.s0.alt[q.id] || "", "Concord wording (optional)", q.text)}

      ${TRUTH_Q[q.id] ? `<div class="gmonly"><div class="gmhd">${gmTag()}</div>${area(`s0.truth.${q.id}`, d.s0.truth[q.id] || "", TRUTH_Q[q.id])}</div>` : ""}`;
    return [`${set.name} ${q.id.toUpperCase()}`, esc(set.how), body];
  }

  // ---------- Actions ----------
  function plantClue(k) {
    const l = ledgerById(S.d.id), c = l.clues[k];
    c.s = c.s == null ? D().session : null;
    if (c.s != null && l.state === "hidden") { l.state = "hinted"; toast(`Planted. ${l.title} is now hinted.`); }
  }
  function setState(id, st) {
    const l = ledgerById(id); l.state = st;
    if (st === "revealed" && l.revealedIn == null) l.revealedIn = D().session;
    if (st !== "revealed") l.revealedIn = null;
    if (st === "revealed") toast(l.reveal ? "Revealed. Players can read it under What we know." : "Revealed. Write what players read in the ledger entry.");
  }
  function planSession(act) {
    const d = D(), n = Math.max(0, ...d.sessions.map((s) => s.n)) + 1;
    d.sessions.push({ n, act, title: "", status: "plan", recap: "", prep: "", choices: [] });
    d.sessions.sort((a, b) => a.n - b.n);
    openDrawer("session", { n, focus: "[data-bind$='.title']" });
  }
  function startSession() {
    const d = D(), s = d.sessions.find((x) => x.n === S.d.n);
    d.sessions.forEach((x) => { if (x.status === "now") x.status = "played"; });
    s.status = "now"; d.session = s.n; d.act = s.act;
    if (!d.s0.done) d.s0.done = true;
    toast(`Session ${s.n} started. Clues you plant now are stamped S${s.n}.`);
  }
  function drawFor(pc, again) {
    const d = D(), held = new Set([...Object.entries(d.s0.draws).filter(([k]) => k !== pc).flatMap(([, v]) => v), ...Object.keys(d.s0.answers).filter((k) => k.startsWith("p") && (d.s0.answers[k] || []).length)]);
    if (again) (d.s0.draws[pc] || []).forEach((id) => held.add(id));
    const pool = Q.filter((q) => q.set === "personal" && !held.has(q.id)).map((q) => q.id);
    if (pool.length < 2) { toast("Not enough personal questions left in the deck"); return; }
    const a = pool.splice(Math.floor(Math.random() * pool.length), 1)[0], b = pool[Math.floor(Math.random() * pool.length)];
    d.s0.draws[pc] = [a, b];
  }
  function addAnswer(qid, pc) {
    const d = D(), q = qById(qid), list = (d.s0.answers[qid] = d.s0.answers[qid] || []);
    list.push({ pc, about: q.set === "crew" ? leftOf(pc) : undefined, text: "", follow: "", act: "" });
    return list.length - 1;
  }
  const commit = () => { save(); renderAll(); };

  function renderAll() { renderTop(); renderTabs(); renderMain(); renderDrawer(); }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) { if (e.target.id === "scrim") closeDrawer(); return; }
    const d = t.dataset;
    if (d.reset === undefined && t.id !== "reset" && S.resetArmed) { S.resetArmed = false; renderTop(); }
    if (d.view) { S.preview = d.view === "player"; if (S.preview && S.s0tab === "wrap") S.s0tab = "questions";
      if (S.preview && S.d.open && ["secret", "question"].includes(S.d.kind)) { closeDrawer(); return; } renderAll(); return; }
    if (d.tab) { S.tab = d.tab; renderTabs(); renderMain(); window.scrollTo({ top: 0 }); return; }
    if (d.actview) { S.actView = d.actview; renderMain(); return; }
    if (d.s0tab) { S.s0tab = d.s0tab; renderMain(); return; }
    if (d.group) { S.group = d.group; renderMain(); return; }
    if (d.sopen) { openDrawer("session", { n: Number(d.sopen) }); return; }
    if (d.nopen) { openDrawer("npc", { id: d.nopen }); return; }
    if (d.lopen) { if (gm()) openDrawer("secret", { id: d.lopen }); return; }
    if (d.qopen) { openDrawer("question", { id: d.qopen }); return; }
    if (d.plan) { planSession(d.plan); save(); renderMain(); return; }
    if (d.thread) { const th = D().threads; th[d.thread] = { plan: "live", live: "done", done: "plan" }[th[d.thread] || "plan"]; commit(); return; }
    if (d.state) { const [id, st] = d.state.split("|"); setState(id, st); commit(); return; }
    if (d.plant !== undefined) { plantClue(Number(d.plant)); commit(); return; }
    if (d.dial) { const [id, v] = d.dial.split("|"); D().s0.dials[id] = Number(v); commit(); return; }
    if (d.theme) { $("lv-topic").value = d.theme; $("lv-topic").focus(); return; }
    if (d.addlv) { const v = $("lv-topic").value.trim(); if (!v) { $("lv-topic").focus(); return; } D().s0.lv.push({ topic: v, kind: d.addlv }); commit(); return; }
    if (d.dellv !== undefined) { D().s0.lv.splice(Number(d.dellv), 1); commit(); return; }
    if (d.drawfor) { S.drawFor = d.drawfor; if (!D().s0.draws[d.drawfor]) drawFor(d.drawfor); commit(); return; }
    if (d.redraw) { drawFor(d.redraw, true); commit(); return; }
    if (d.keep) { const [pc, qid] = d.keep.split("|"), k = addAnswer(qid, pc); save(); openDrawer("question", { id: qid, focus: `[data-bind='s0.answers.${qid}.${k}.text']` }); return; }
    if (d.delans !== undefined) { const list = D().s0.answers[S.d.id]; list.splice(Number(d.delans), 1); if (!list.length) delete D().s0.answers[S.d.id]; commit(); return; }
    if (d.delchoice !== undefined) { D().sessions.find((s) => s.n === S.d.n).choices.splice(Number(d.delchoice), 1); commit(); return; }
    const act = d.act;
    if (act === "close") closeDrawer();
    else if (act === "add-ans") { const k = addAnswer(S.d.id, d.pc); save(); renderAll(); const f = $("drawer").querySelector(`[data-bind='s0.answers.${S.d.id}.${k}.text']`); if (f) f.focus(); }
    else if (act === "add-choice") { const v = $("choice-in").value.trim(); if (v) { D().sessions.find((s) => s.n === S.d.n).choices.push(v); commit(); $("choice-in").focus(); } }
    else if (act === "add-clue") { const v = $("clue-in").value.trim(); if (v) { ledgerById(S.d.id).clues.push({ t: v, s: null }); commit(); $("clue-in").focus(); } }
    else if (act === "start-session") { startSession(); commit(); }
    else if (act === "end-session") { const s = D().sessions.find((x) => x.n === S.d.n); s.status = "played"; toast(`Session ${s.n} played. Plan the next one under its act.`); commit(); }
    else if (act === "del-session") { const ss = D().sessions; ss.splice(ss.findIndex((s) => s.n === S.d.n), 1); save(); closeDrawer(); }
    else if (act === "s0-done") { D().s0.done = !D().s0.done; commit(); }
    else if (act === "reset") {
      if (!S.resetArmed) { S.resetArmed = true; renderTop(); return; }
      S.resetArmed = false; S.data = seed(S.kind); save(); S.drawFor = null; renderAll(); toast("Reset to the starting data");
    }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "castq") { S.q = el.value; const pos = el.selectionStart; renderMain(); const q = $("castq"); q.focus(); q.setSelectionRange(pos, pos); return; }
    if (el.dataset.bind && el.tagName !== "SELECT") { setPath(D(), el.dataset.bind, el.value); save(); }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.id === "dataset") { S.kind = el.value; try { localStorage.setItem("ttg-campaign-kind", S.kind); } catch (err) {} S.data = load(S.kind); S.actView = null; S.drawFor = null; renderAll(); toast(S.kind === "blank" ? "Fresh campaign: nothing played yet. Start with Session 0." : "Sample campaign: tonight is Session 5"); return; }
    if (el.name === "twist") { D().twist = Number(el.value); commit(); return; }
    if (el.dataset.wrap !== undefined) { D().s0.wrap[el.dataset.wrap] = el.checked; commit(); return; }
    if (el.dataset.bind) {
      const v = el.tagName === "SELECT" && el.hasAttribute("data-num") ? (el.value === "" ? null : Number(el.value)) : el.value;
      setPath(D(), el.dataset.bind, v); save(); renderTop(); renderTabs(); renderMain();
      if (el.tagName === "SELECT") renderDrawer();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.d.open) closeDrawer();
    if (e.key === "Enter" && ["choice-in", "clue-in"].includes(e.target.id)) { e.preventDefault(); document.querySelector(`[data-act='add-${e.target.id.split("-")[0]}']`).click(); }
  });

  renderAll();
})();

</script>
