omously."},{"name":"Corrupt Official","equipment":"Cell phone, tablet.","type":"rival","source":{"book":"crb","page":169},"abilities":"Local Politics (once per session, may choose one character operating in their area of influence [community, precinct, or county, for example]; until the end of the session, the target must upgrade the difficulty of any social skill checks they make to interact with inhabitants of this area once).","setting":"modern","wounds":12,"defense":{"melee":0,"ranged":0},"talents":"Natural (once per session, use this talent to reroll any one Negotiation or Skulduggery check).","skills":[{"name":"Charm","rank":2},{"name":"Cool","rank":2},{"name":"Deception","rank":2},{"name":"Knowledge","rank":2},{"name":"Negotiation","rank":2},{"name":"Vigilance","rank":1}],"id":"corrupt-official","characteristics":{"brawn":2,"agility":2,"intellect":3,"cunning":3,"willpower":3,"presence":4},"soak":2,"text":"Wherever there is a bureaucracy, corrupt officials flourish. Whether a crooked politician, a bent cop, or a corrupt small-town sheriff, these opponents can make life exceedingly difficult for anyone who crosses them."},{"name":"Defender","equipment":"None.","type":"nemesis","source":{"book":"epg","page":92},"abilities":"None.","setting":"general","wounds":16,"defense":{"melee":1,"ranged":1},"power":{"combat":5,"social":3,"general":2},"talents":"Body Guard 2 (as a maneuver, may suffer up to 2 strain to upgrade the difficulty of all combat checks targeting one ally engaged with this character a number of times equal to the strain suffered), Rapid Reaction 2 (May suffer up to 2 strain to add an equal number of [success] to a Vigilance or Cool check to determine Initiative order).","skills":[{"name":"Athletics","rank":1},{"name":"Cool","rank":1},{"name":"Discipline","rank":3},{"name":"Melee","rank":3},{"name":"Ranged","rank":3},{"name":"Vigilance","rank":3}],"id":"defender","characteristics":{"brawn":4,"agility":3,"intellect":2,"cunning":2,"willpower":3,"presence":2},"strain":12,"soak":4,"text":"Defenders guard the walls at castles and bases, act as bodyguards, and control gates and checkpoints. They might be security guards at banks, businesses, or residential high-rises. Any combatant whose primary job is to guard a location should use this profile, and they could range from armored paladins and knights to modern bodyguards."},{"name":"Dog","equipment":"Bite (Brawl; Damage 4; Critical 3; Range [Engaged]; Knockdown).","type":"rival","source":{"book":"epg","page":87},"abilities":"Pack Fighter (if this creature makes a successful combat check, the next ally making a combat check against the same target during the same round adds [advantage] [advantage] to the results), Silhouette 0.","setting":"general","wounds":5,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":1,"general":1},"talents":"None.","skills":[{"name":"Athletics","rank":1},{"name":"Brawl","rank":1},{"name":"Charm","rank":2},{"name":"Perception","rank":1},{"name":"Survival","rank":1},{"name":"Vigilance","rank":2}],"id":"dog","characteristics":{"brawn":2,"agility":3,"intellect":1,"cunning":3,"willpower":2,"presence":2},"soak":2,"text":"Humanity has had domesticated dogs for thousands of years. This profile represents a medium or large dog who\u2019s ready to be a faithful companion and join some lucky individual on adventures."},{"name":"Elephant","equipment":"Tusks and trampling feet (Brawl; Damage 10; Critical 4; Range [Engaged]; Knockdown).","type":"nemesis","source":{"book":"epg","page":87},"abilities":"Encumbrance Capacity 30, Silhouette 3, Toss (after making a combat check, this creature may spend [triumph] to move the target up to short range, inflict 4 strain, and knock the target prone).","setting":"general","wounds":35,"defense":{"melee":0,"ranged":0},"power":{"combat":8,"social":3,"general":3},"talents":"None.","skills":[{"name":"Athletics","rank":1},{"name":"Brawl","rank":2},{"name":"Discipline","rank":2},{"name":"Survival","rank":2},{"name":"Vigilance","rank":3}],"id":"elephant","characteristics":{"brawn":5,"agility":1,"intellect":2,"cunning":2,"willpower":2,"presence":3},"strain":18,"soak":7,"text":"Elephants have prehensile trunks, large tusks, and a gentle nature. They roam forests and savannas in herds, defending their young from attack. While often friendly, and even domesticated as mounts by some cultures, wild elephants are not something one should mess with."},{"name":"Exosuit Trooper","equipment":"Portable laser cannon (Ranged [Heavy]; Damage 10; Critical 3; Range [Long]; Accurate 1, Burn 1, Cumbersome 4), laser pistol (Ranged [Light]; Damage 6; Critical 3; Range [Short]; Accurate 1, Burn 1), exosuit fists (Brawl; Damage 6; Critical 4; Range [Engaged]; Disorient 3, Knockdown), exosuit (+1 defense, +2 soak, +1 Brawn, +4 wound threshold; allows wearer to operate underwater and in vacuum for up to 1 hour).","type":"rival","source":{"book":"crb","page":178},"abilities":"None.","setting":"science-fiction","wounds":16,"defense":{"melee":1,"ranged":1},"talents":"None.","skills":[{"name":"Athletics","rank":2},{"name":"Brawl","rank":2},{"name":"Discipline","rank":1},{"name":"Ranged (Heavy)","rank":2},{"name":"Ranged (Light)","rank":2},{"name":"Vigilance","rank":1}],"id":"exosuit-trooper","characteristics":{"brawn":4,"agility":3,"intellect":2,"cunning":2,"willpower":2,"presence":2},"soak":6,"text":"For a hard science fiction setting, we can assume at least some professional soldiers are equipped with full-body exosuits that enhance their strength while protecting them from damage. An exosuit increases the character\u2019s Brawn, soak, and wound threshold, which we\u2019ve incorporated into the profile stats and noted in the equipment. If you use an exosuit trooper without a suit, make sure you remove the increases from the profile stats."},{"name":"Falcon","equipment":"Claws and beak (Brawl; Damage 3; Critical 3; Range [Engaged]; Vicious 1).","type":"rival","source":{"book":"epg","page":87},"abilities":"Flyer (can fly; see page 100 of the Core Rulebook), Silhouette 0.","setting":"general","wounds":4,"defense":{"melee":0,"ranged":1},"power":{"combat":1,"social":1,"general":1},"talents":"None.","skills":[{"name":"Athletics","rank":2},{"name":"Brawl","rank":2},{"name":"Perception","rank":3},{"name":"Vigilance","rank":3}],"id":"falcon","characteristics":{"brawn":1,"agility":3,"intellect":1,"cunning":2,"willpower":1,"presence":1},"soak":1,"text":"Falcons are swift and vicious birds of prey. However, they are often domesticated as pets or aids in hunting. This profile could also be used to represent a hawk, eagle, or owl."},{"name":"Field Leader","equipment":"None.","type":"rival","source":{"book":"epg","page":92},"abilities":"None.","setting":"general","wounds":15,"defense":{"melee":0,"ranged":0},"power":{"combat":3,"social":3,"general":1},"talents":"Adversary 1 (upgrade difficulty of all combat checks against this target once), Field Commander (as an action, make an Average [[difficulty] [difficulty]] Leadership check; if successful, 3 allies may immediately perform one maneuver as an out-of-turn incidental).","skills":[{"name":"Cool","rank":1},{"name":"Discipline","rank":1},{"name":"Drive","rank":2},{"name":"Leadership","rank":2},{"name":"Melee","rank":2},{"name":"Perception","rank":1},{"name":"Ranged","rank":2},{"name":"Survival","rank":1}],"id":"field-leader","characteristics":{"brawn":3,"agility":3,"intellect":2,"cunning":2,"willpower":3,"presence":3},"soak":3,"text":"The field leader is proficient in tactical direction and movement. They lead their forces from the front, deploying units to ensure success. A field leader might be a gruff squad leader or an inspirational cavalry officer. For the age of myth and fantasy settings (and possibly the steampunk and monsterworld settings), you should replace the Drive skill with the Ride skill."},{"name":"Fixer","equipment":"Toolkit.","type":"rival","source":{"book":"epg","page":89},"abilities":"Many Hands Make Light the Load (if this character provides assistance when another character makes a Mechanics check to repair a vehicle, increase the hull trauma or system strain repaired by 2; if the check is being made to repair a Critical Hit, reduce the difficulty of the check by 1, to a minimum of Easy [[difficulty]]; this is in addition to the other benefits of assistance).","setting":"general","wounds":12,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":1,"general":3},"talents":"None.","skills":[{"name":"Athletics","rank":1},{"name":"Computers","rank":3},{"name":"Knowledge","rank":1},{"name":"Mechanics","rank":3},{"name":"Negotiation","rank":2},{"name":"Perception","rank":3}],"id":"fixer","characteristics":{"brawn":3,"agility":3,"intellect":3,"cunning":1,"willpower":2,"presence":1},"soak":3,"text":"When things break, a fixer repairs them. They might mend everything from simple carts to high-tech gadgets and vehicles. To make this character usable in a pre-modern setting, remove the Computers skill."},{"name":"Gang Leader","equipment":"Really big and sharp knife (Melee; Damage 5; Critical 3; Range [Engaged]; Pierce 2), heavy leather clothing (+2 soak).","type":"rival","source":{"book":"crb","page":134},"abilities":"None.","setting":"general","wounds":15,"defense":{"melee":0,"ranged":0},"talents":"Adversary 1 (upgrade difficulty of all combat checks against this target once).","skills":[{"name":"Coercion","rank":1},{"name":"Cool","rank":1},{"name":"Leadership","rank":1},{"name":"Melee","rank":2},{"name":"Streetwise","rank":3},{"name":"Vigilance","rank":1}],"id":"gang-leader","characteristics":{"brawn":3,"agility":2,"intellect":2,"cunning":2,"willpower":2,"presence":2},"soak":5,"text":"Your groups of street toughs can be led by the gang leader, another go-to opponent who fits into all settings. The gang leader is a tough individual who runs smalltime criminal operations with an iron fist. This can be a good opponent for a group to face off with at the climax of their first or second session, especially if the gang leader is backed up by a minion group of street toughs."},{"name":"Gunner","equipment":"None.","type":"minion","source":{"book":"epg","page":92},"abilities":"None.","setting":"general","wounds":4,"defense":{"melee":0,"ranged":1},"power":{"combat":1,"social":1,"general":1},"talents":"None.","skills":[{"name":"Athletics"},{"name":"Discipline"},{"name":"Gunnery"},{"name":"Mechanics"}],"id":"gunner","characteristics":{"brawn":2,"agility":3,"intellect":2,"cunning":2,"willpower":2,"presence":1},"soak":2,"text":"Gunners operate large-scale weapons, from ballistae and catapults to missile launchers and laser cannons. They might work aboard a vehicle or operate a weapon emplacement. If used in older settings, switch their Gunnery skill for the Ranged skill."},{"name":"Hacker","equipment":"Custom computer terminal, energy drinks.","type":"nemesis","source":{"book":"crb","page":178},"abilities":"None.","setting":"science-fiction","wounds":11,"defense":{"melee":0,"ranged":0},"talents":"Adversary 1 (upgrade difficulty of all combat checks against this target once), Defensive Sysops (when defending a computer system against intrusion, add [setback] [setback] to opponents\u2019 checks), Distinctive Style (before making a Computers check to hack a system, use this talent to add [success] [success] [threat] [threat] to the results).","skills":[{"name":"Cool","rank":3},{"name":"Computers","rank":2},{"name":"Mechanics","rank":1},{"name":"Piloting","rank":2}],"id":"hacker","characteristics":{"brawn":1,"agility":1,"intellect":4,"cunning":3,"willpower":2,"presence":2},"strain":16,"soak":1,"text":"Since computers and hacking often are a large part of a hard sci-fi setting, we\u2019ve included one hacker profile. You can use this adversary as a sysop employed by a government or corporation, or as a criminal hacker. In all cases, this is a dangerous adversary in the electronic realm."},{"name":"Healer","equipment":"Healer\u2019s garb, doctor\u2019s tools.","type":"rival","source":{"book":"epg","page":89},"abilities":"Time to Heal (if this character is caring for a character who is benefiting from natural rest, the resting character heals 2 wounds each night and decreases the difficulty of any Resilience checks they make to heal Critical Injuries by 1, to a minimum of Easy [[difficulty]]).","setting":"general","wounds":8,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":2,"general":4},"talents":"Surgeon 2 (when making Medicine checks to heal wounds, heals 2 additional wounds).","skills":[{"name":"Cool","rank":1},{"name":"Discipline","rank":2},{"name":"Knowledge","rank":3},{"name":"Medicine","rank":4},{"name":"Negotiation","rank":1},{"name":"Perception","rank":1}],"id":"healer","characteristics":{"brawn":1,"agility":2,"intellect":3,"cunning":2,"willpower":2,"presence":3},"soak":1,"text":"A healer treats ailments and injuries alike, either traveling to visit their patients or working within a medical facility. They might be an educated doctor, a veterinarian, or just really into holistic remedies."},{"name":"Horse","equipment":"Hooves (Brawl; Damage 4; Critical 4; Range [Engaged]; Knockdown, Stun 3).","type":"minion","source":{"book":"epg","page":87},"abilities":"Encumbrance Capacity 12, Silhouette 2.","setting":"general","wounds":5,"defense":{"melee":0,"ranged":0},"power":{"combat":3,"social":1,"general":1},"talents":"None.","skills":[{"name":"Athletics"},{"name":"Resilience"}],"id":"horse","characteristics":{"brawn":4,"agility":3,"intellect":1,"cunning":1,"willpower":1,"presence":1},"soak":4,"text":"One of the most common domesticated mounts, horses are bred for racing, farm work, everyday transportation, and even combat. Sometimes stubborn, horses are generally docile creatures, though riders risk getting thrown, kicked, or trampled."},{"name":"Intelligence Agent","equipment":"Silenced pistol (Ranged [Light]; Damage 5; Critical 4; Range [Short]), encrypted cell phone.","type":"nemesis","source":{"book":"crb","page":169},"abilities":"One Step Ahead (once per round, after an opponent performs an action or maneuver, may spend one Story Point to perform an action or a maneuver as an out-of-turn incidental).","setting":"modern","wounds":14,"defense":{"melee":0,"ranged":0},"talents":"Adversary 2 (upgrade difficulty of all combat checks against this target twice), Natural (once per session, reroll any one Skulduggery or Stealth check).","skills":[{"name":"Charm","rank":2},{"name":"Coercion","rank":2},{"name":"Deception","rank":2},{"name":"Ranged (Light)","rank":2},{"name":"Brawl","rank":2},{"name":"Skulduggery","rank":3},{"name":"Stealth","rank":3},{"name":"Streetwise","rank":3},{"name":"Vigilance","rank":2}],"id":"intelligence-agent","characteristics":{"brawn":3,"agility":3,"intellect":3,"cunning":4,"willpower":3,"presence":3},"strain":14,"soak":3,"text":"Intelligence agents\u2014or spies, if you prefer\u2014are some of the most cunning and elusive opponents encountered in modern day settings. Our spy is a jack-of-all-trades; they\u2019re not an overly dangerous combatant, but their Adversary talent and One Step Ahead ability should make them a frustrating foe."},{"name":"Kraken","type":"nemesis","source":{"book":"epg","page":87},"abilities":"Amphibious (this creature may breathe underwater and never suffers movement penalties for traveling through water), Crush (while engaged with a vehicle, this creature may make a Hard [[difficulty] [difficulty] [difficulty]] Athletics check as an action; if the check is successful, the vehicle suffers a Critical Hit and may not move during the following round), Multitentacled (after making a successful combat check, this creature may spend 3 strain to inflict one additional hit with its thrashing tentacles against one other target within short range that is no more difficult to hit than original target, dealing base damage +1 per [success]; it may do so up to three times), Silhouette 5. Weapons: Multiple thrashing tentacles (Brawl; Damage 8; Critical 5; Range [Short]; Ensnare 3, Knockdown), piercing beak (Brawl; Damage 15; Critical 2; Range [Engaged]; Breach 1, Vicious 3).","setting":"general","wounds":80,"defense":{"melee":0,"ranged":0},"power":{"combat":16,"social":1,"general":2},"talents":"Adversary 2 (upgrade difficulty of all combat checks against this target twice).","skills":[{"name":"Athletics","rank":4},{"name":"Brawl","rank":4},{"name":"Perception","rank":2},{"name":"Survival","rank":2}],"id":"kraken","characteristics":{"brawn":6,"agility":3,"intellect":1,"cunning":3,"willpower":1,"presence":1},"strain":40,"soak":6,"text":"Octopi and squid rarely get much larger than a human, but rumors abound of larger specimens. Allegedly, the giant creatures lurk in the ocean, wielding multiple long, suckered tentacles that are able to crush ships and terrorize their crews. This profile is of a truly immense specimen, able to consume a large ship."},{"name":"Laborer","equipment":"Fists (Damage 3; Brawl; Critical 5; Range [Engaged]; Disorient 1, Knockdown), work clothes.","type":"minion","source":{"book":"epg","page":89},"abilities":"None.","setting":"general","wounds":6,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":1,"general":1},"talents":"None.","skills":[{"name":"Athletics"},{"name":"Brawl"},{"name":"Resilience"}],"id":"laborer","characteristics":{"brawn":3,"agility":2,"intellect":2,"cunning":2,"willpower":2,"presence":1},"soak":3,"text":"Laborers perform physical work in fields, warehouses, factories, and elsewhere. They often work in teams to handle complex tasks. After a hard day\u2019s work they relax in a tavern, sometimes getting into fights."},{"name":"Leader","equipment":"Formal clothing.","type":"nemesis","source":{"book":"epg","page":90},"abilities":"Let\u2019s Make a Deal (if this character knows an opponent\u2019s Desire Motivation, when this character inflicts strain on the opponent, the opponent suffers 4 additional strain).","setting":"general","wounds":12,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":8,"general":3},"talents":"Adversary 1 (upgrade difficulty of all combat checks against this target once), Clever Retort (once per encounter, add [threat] [threat] to another character\u2019s social skill check), Ruinous Repartee (once per encounter, may make an opposed Charm versus Discipline check against a character within medium range [or within earshot]; if successful, target suffers 8 strain, plus 1 per [success], and this character heals strain equal to strain inflicted).","skills":[{"name":"Charm","rank":3},{"name":"Cool","rank":2},{"name":"Deception","rank":2},{"name":"Discipline","rank":2},{"name":"Knowledge","rank":3},{"name":"Leadership","rank":3},{"name":"Vigilance","rank":1}],"id":"leader","characteristics":{"brawn":2,"agility":2,"intellect":3,"cunning":3,"willpower":4,"presence":4},"strain":15,"soak":2,"text":"A leader might be a duly elected politician, protest organizer, CEO, religious leader, or other influential public figure. Their position grants great influence, which they wield against their foes to great effect."},{"name":"Local Official","equipment":"Fine clothing, official credentials or badge of office.","type":"nemesis","source":{"book":"crb","page":134},"abilities":"Good at Needling (if this character knows an opponent\u2019s Flaw Motivation, when this character inflicts strain on the opponent, the opponent suffers 4 additional strain).","setting":"general","wounds":12,"defense":{"melee":0,"ranged":0},"talents":"Improved Scathing Tirade (use this talent to make an Average [[difficulty] [difficulty]] Coercion check; for each [success], one opponent within short range suffers 1 strain; for each [advantage], one affected opponent suffers 1 additional strain; all opponents affected add [setback] to all skill checks they make for the following three rounds).","skills":[{"name":"Charm","rank":2},{"name":"Cool","rank":1},{"name":"Coercion","rank":3},{"name":"Deception","rank":1},{"name":"Leadership","rank":2},{"name":"Negotiation","rank":1},{"name":"Vigilance","rank":3}],"id":"local-official","characteristics":{"brawn":2,"agility":2,"intellect":3,"cunning":3,"willpower":2,"presence":3},"strain":16,"soak":2,"text":"This generic local official could be the mayor of a small town, the councilmember representing a borough, or any other government official low-ranking enough to encounter your players\u2019 characters but powerful enough to be a problem. The local official is primarily a threat in social encounters, not combat encounters, so use them accordingly (or accept that they\u2019ll be a pretty minor threat in a fight)."},{"name":"Manager","equipment":"None.","type":"rival","source":{"book":"epg","page":90},"abilities":"Corporate Oversight (when performing the assist maneuver, add [success] [threat] [threat] to the result instead of adding [boost]).","setting":"general","wounds":9,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":3,"general":1},"talents":"Improved Inspiring Rhetoric (as an action, may make an Average [[difficulty] [difficulty]] Leadership check; for each [success], one ally within short range heals 1 strain; for each [advantage], one ally benefiting from Inspiring Rhetoric heals 1 additional strain; all allies affected by Inspiring Rhetoric add [boost] to all skill checks for 3 rounds).","skills":[{"name":"Charm","rank":1},{"name":"Leadership","rank":3},{"name":"Operating","rank":1},{"name":"Vigilance","rank":2}],"id":"manager","characteristics":{"brawn":2,"agility":2,"intellect":2,"cunning":2,"willpower":2,"presence":3},"soak":2,"text":"A manager leads workers at a job site or office, arguably improving efficiency and morale. They could be nearly any nonmilitary team leader."},{"name":"Medic","equipment":"2 painkillers (or setting equivalent), medical supplies (can make Medicine checks without penalty).","type":"rival","source":{"book":"epg","page":93},"abilities":"None.","setting":"general","wounds":11,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":2,"general":3},"talents":"Combat Medicine 2 (before making a Medicine check, this character may add [success] [success] to the results; after the check is resolved, the target suffers 4 strain), Painkiller Specialization 2 (when this character uses painkillers, the target heals 2 additional wounds; the sixth painkiller and beyond each day still have no effect).","skills":[{"name":"Athletics","rank":3},{"name":"Cool","rank":3},{"name":"Discipline","rank":2},{"name":"Medicine","rank":2},{"name":"Melee","rank":2},{"name":"Ranged","rank":1}],"id":"medic","characteristics":{"brawn":2,"agility":2,"intellect":2,"cunning":1,"willpower":2,"presence":2},"soak":2,"text":"The medic\u2019s primary task is to keep their allies alive and fighting. This often limits them to first aid and administering painkillers, or dragging the seriously wounded to safety where surgeons can address their injuries."},{"name":"Militia","equipment":"Assault rifle (Ranged [Heavy]; Damage 8; Critical 3; Range [Long]; Auto-fire), fatigues (+1 soak).","type":"minion","source":{"book":"crb","page":169},"abilities":"None.","setting":"modern","wounds":4,"defense":{"melee":0,"ranged":0},"talents":"None.","skills":[{"name":"Brawl"},{"name":"Coercion"},{"name":"Ranged (Heavy)"}],"id":"militia","characteristics":{"brawn":2,"agility":1,"intellect":2,"cunning":2,"willpower":2,"presence":1},"soak":3,"text":"Militia are irregular fighters driven by a political or religious cause. They are typically undisciplined, poorly trained, and poorly equipped individuals who, although not a match for professionals, are dangerous in groups."},{"name":"Nano-Swarm","equipment":"Tiny pincers (Brawl; Damage 1; Critical 3; Range [Engaged]; Pierce 3, add [boost] [boost] if target is immobilized).","type":"rival","source":{"book":"crb","page":188},"abilities":"Swarm (halve the damage dealt to the swarm before applying soak, unless the weapon has the Blast or Burn quality [regardless of whether the quality is activated]), consuming swarm (may spend a maneuver to make an opposed Coordination versus Coordination check targeting one engaged opponent to immobilize that opponent until the end of its next turn. At the start of its next turn, the opponent suffers 3 wounds, and the swarm heals 3 wounds), Silhouette 2.","setting":"space-opera","wounds":40,"defense":{"melee":0,"ranged":0},"talents":"None.","skills":[{"name":"Brawl","rank":1},{"name":"Coordination","rank":2}],"id":"nano-swarm","characteristics":{"brawn":1,"agility":4,"intellect":1,"cunning":1,"willpower":1,"presence":1},"soak":1,"text":"Nanites as presented in fiction are a popular (and terrifying) danger in space opera settings. They appear as buzzing clouds or even amorphous blobs of micro-machines, swarming across the ground and breaking down anything in their path to turn into more nanites."},{"name":"Paper Pusher","equipment":"Attire appropriate to the place of work.","type":"minion","source":{"book":"epg","page":90},"abilities":"Red Tape (once per encounter, as an action, make an opposed Knowledge versus Cool check targeting one character in the encounter; if successful, the target increases the difficulty of all social skill checks they make by two, to a maximum of Formidable [[difficulty] [difficulty] [difficulty] [difficulty] [difficulty]], until the end of the encounter).","setting":"general","wounds":4,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":2,"general":2},"talents":"None.","skills":[{"name":"Cool"},{"name":"Computers"},{"name":"Knowledge"},{"name":"Perception"}],"id":"paper-pusher","characteristics":{"brawn":1,"agility":1,"intellect":3,"cunning":2,"willpower":2,"presence":1},"soak":1,"text":"A paper pusher might be a data entry clerk, scribe, accountant, or programmer, or fill nearly any position performed in a cubicle or its setting equivalent. For some settings, you may need to remove the Computers skill from this profile."},{"name":"Ranger","equipment":"None.","type":"rival","source":{"book":"epg","page":93},"abilities":"None.","setting":"general","wounds":16,"defense":{"melee":0,"ranged":0},"power":{"combat":4,"social":2,"general":4},"talents":"Adversary 2 (upgrade difficulty of all combat checks against this target twice), Hamstring Shot (once per round, on a successful ranged combat check against a non-vehicle target within range, halve the damage inflicted [before applying soak] to immobilize the target until the end of its next turn), Heightened Awareness (allies within short range add [boost] to Perception and Vigilance checks; engaged allies add [boost] [boost] instead).","skills":[{"name":"Athletics","rank":2},{"name":"Cool","rank":3},{"name":"Melee","rank":1},{"name":"Perception","rank":3},{"name":"Ranged","rank":3},{"name":"Stealth","rank":3},{"name":"Survival","rank":4}],"id":"ranger","characteristics":{"brawn":3,"agility":4,"intellect":2,"cunning":3,"willpower":2,"presence":1},"soak":3,"text":"Rangers, scouts, and snipers operate independently or in small teams, identifying enemy locations, performing reconnaissance, and taking out enemy scouts. Rangers are adept at avoiding detection, and might be medieval rangers, modern recon scouts, or even snipers."},{"name":"Sapper","equipment":"Hatchet or similar tool (Melee [Light]; Damage 4; Critical 3; Range [Engaged]; Vicious 1).","type":"rival","source":{"book":"epg","page":93},"abilities":"Destroy Terrain (when engaged with a silhouette 2 or smaller terrain feature that is providing cover or obstructs movement\u2014such as a section of fence, foxhole, door, or sandbagged emplacement\u2014 this character may spend an action and make a Hard [[difficulty] [difficulty] [difficulty]] Mechanics check; if the check succeeds the terrain feature is destroyed and no longer provides cover or obstructs movement), Flush Target (after making a combat check targeting a character in cover, may spend [advantage] [advantage] or [triumph] to force the character to immediately move out of cover as an out-of-turn incidental).","setting":"general","wounds":13,"defense":{"melee":0,"ranged":0},"power":{"combat":2,"social":1,"general":4},"talents":"None","skills":[{"name":"Athletics","rank":2},{"name":"Discipline","rank":2},{"name":"Mechanics","rank":4},{"name":"Melee","rank":3},{"name":"Perception","rank":2},{"name":"Ranged","rank":2},{"name":"Resilience","rank":4}],"id":"sapper","characteristics":{"brawn":2,"agility":3,"intellect":2,"cunning":3,"willpower":2,"presence":1},"soak":2,"text":"Combat engineers destroy enemy defenses and clear out fortified positions. They might accomplish this through the use of shovels and sledgehammers, or advanced tools and explosives."},{"name":"Seller","equipment":"Rumpled and worn professional attire.","type":"nemesis","source":{"book":"epg","page":90},"abilities":"None.","setting":"general","wounds":7,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":5,"general":2},"talents":"Indomitable (once per encounter, if this character would otherwise become incapacitated due to exceeding their wound or strain threshold, spend a Story Point to delay incapacitation until the end of their next turn; if this character reduces their strain or wounds to their threshold or below before the end of their next turn, they are not incapacitated), Second Wind 3 (once per encounter as an incidental, may heal 3 strain).","skills":[{"name":"Charm","rank":2},{"name":"Cool","rank":3},{"name":"Deception","rank":3},{"name":"Knowledge","rank":2},{"name":"Negotiation","rank":3},{"name":"Streetwise","rank":1}],"id":"seller","characteristics":{"brawn":2,"agility":1,"intellect":2,"cunning":3,"willpower":2,"presence":4},"strain":12,"soak":2,"text":"A seller talks fast and counts profits. They might be a merchant, a car salesman, or even someone collecting for charity. The important thing is that the seller wants your money, and they can convince you to part with it."},{"name":"Shark","equipment":"Powerful jaws (Brawl; Damage 8; Critical 2; Range [Engaged]; Ensnare 1, Vicious 4).","type":"rival","source":{"book":"epg","page":88},"abilities":"Aquatic (this creature suffers no penalties for moving through water and can breathe underwater, but cannot move or survive on land).","setting":"general","wounds":21,"defense":{"melee":0,"ranged":0},"power":{"combat":5,"social":1,"general":2},"talents":"Adversary 1 (upgrade difficulty of all combat checks against this target once).","skills":[{"name":"Athletics","rank":3},{"name":"Brawl","rank":4},{"name":"Perception","rank":3},{"name":"Stealth","rank":2},{"name":"Vigilance","rank":2}],"id":"shark","characteristics":{"brawn":3,"agility":3,"intellect":1,"cunning":1,"willpower":2,"presence":1},"soak":4,"text":"The ocean\u2019s apex predators, larger sharks have jaws wide enough to swallow a person, and their razorsharp teeth can easily bite someone in half."},{"name":"Space Pirate","equipment":"Laser rifle (Ranged [Heavy]; Damage 6; Critical 3; Range [Long]; Pierce 4), mono-molecular cutlass (Melee; Damage 4; Critical 3; Range [Engaged]; Pierce 2), armored space suit (+1 soak). A minion group of two space pirates may be armed with a short-ranged cutter laser equipped with a hoverplatform instead of laser rifles (Gunnery; Damage 9; Critical 3; Range [Medium]; Breach 2, Inaccurate 2).","type":"minion","source":{"book":"crb","page":187},"abilities":"Strength in Numbers (adds [boost] to combat checks when there are at least two other friendly nemeses, rivals, or minion groups engaged in the encounter. Add [setback] to combat checks when there are no other friendly nemeses, rivals, or minion groups engaged in the encounter).","setting":"space-opera","wounds":6,"defense":{"melee":0,"ranged":0},"talents":"None.","skills":[{"name":"Coercion"},{"name":"Coordination"},{"name":"Gunnery"},{"name":"Ranged (Heavy)"},{"name":"Melee"},{"name":"Vigilance"}],"id":"space-pirate","characteristics":{"brawn":2,"agility":3,"intellect":2,"cunning":2,"willpower":2,"presence":1},"soak":3,"text":"Space pirates are a staple in many space operas. They resemble their high-seas cousins of story: swaggering, uncultured rogues with a taste for plunder and mayhem."},{"name":"Street Tough","equipment":"Studded gloves (Brawl; Damage 4; Critical 4; Range [Engaged]; Disorient 2, Knockdown), club (Melee; Damage 5; Critical 3; Range [Engaged]), heavy clothing (+1 soak).","type":"minion","source":{"book":"crb","page":134},"abilities":"None.","setting":"general","wounds":4,"defense":{"melee":0,"ranged":0},"talents":"None.","skills":[{"name":"Brawl"},{"name":"Coercion"},{"name":"Melee"}],"id":"street-tough","characteristics":{"brawn":3,"agility":2,"intellect":1,"cunning":2,"willpower":1,"presence":2},"soak":4,"text":"The street tough is one of the go-to villains of any setting. These belligerent petty criminals are a reasonable first opponent for your PCs to beat up without your having to worry that they may kill the group by accident. If you\u2019re worried they may be too tough, however, have them use their studded gloves and deal damage to your PCs\u2019 strain threshold."},{"name":"Telepath","equipment":"Hoverchair, robes. P art I presented the core rules that you\u2019ll use no matter what setting. Part II augmented the core with setting-specific rules. In Part III, we discuss how to make Genesys your own unique game. This section includes several ways to do this. The first chapter discusses ways to customize the game by creating new skills, talents, items, and adventures. The second chapter discusses alternate rules that you can add to most or all settings, or leave out if you don\u2019t think you need them. The third chapter explains how to build your own adventure for your players. Finally, the fourth chapter discusses tones that you can apply to any setting to drastically shift the type of game you\u2019re running.","type":"nemesis","source":{"book":"crb","page":188},"abilities":"I Know What You\u2019re Thinking (when targeting an opponent with a social skill check, downgrade the difficulty a number of times equal to the number of [challenge] in the pool [effectively replacing all [challenge] with [difficulty]]. When targeted by a social skill check, downgrade the ability of the check a number of times equal to the number of [proficiency] in the pool [effectively replacing all [proficiency] with [ability]]). Mind Bleed (as an action, may make an opposed Discipline vs. Discipline check against one living target within medium range. If successful, the target suffers 2 wounds and 2 strain per [success], and the telepath may spend [advantage] [advantage] [advantage] [advantage] or [triumph] to inflict a Critical Injury). Dominate (Once per encounter, as an action, may make an opposed Discipline versus Discipline check against one living target within medium range. If successful, during the target\u2019s next turn, the telepath dictates what actions and maneuvers they perform. GMs should avoid actions that lead to unavoidable character death, however, such as jumping off towering cliffs or shooting oneself in the head, since that\u2019s just not fun).","setting":"space-opera","wounds":10,"defense":{"melee":0,"ranged":0},"talents":"Adversary 2 (upgrade difficulty of all combat checks against this target twice).","skills":[{"name":"Coercion","rank":3},{"name":"Discipline","rank":3},{"name":"Negotiation","rank":2},{"name":"Perception","rank":3},{"name":"Vigilance","rank":3}],"id":"telepath","characteristics":{"brawn":1,"agility":1,"intellect":4,"cunning":3,"willpower":4,"presence":2},"strain":20,"soak":1,"text":"Throughout the galaxy, some of the alien species your characters encounter are going to have strange and terrible abilities. How this particular creature possesses the powers of telepathy is unknown, but it seems to be able to control and dominate minds."},{"name":"Tracker","equipment":"None.","type":"rival","source":{"book":"epg","page":91},"abilities":"None.","setting":"general","wounds":10,"defense":{"melee":1,"ranged":1},"power":{"combat":2,"social":2,"general":3},"talents":"Hamstring Shot (once per round, on a successful ranged combat check against a non-vehicle target within range, halve the damage inflicted [before applying soak] to immobilize the target until the end of its next turn).","skills":[{"name":"Athletics","rank":2},{"name":"Coercion","rank":1},{"name":"Ranged","rank":3},{"name":"Survival","rank":4},{"name":"Vigilance","rank":3}],"id":"tracker","characteristics":{"brawn":2,"agility":3,"intellect":2,"cunning":3,"willpower":3,"presence":1},"soak":2,"text":"A tracker can discern the obscure signs left behind by humans and creatures to follow them over rugged terrain. To convert the tracker from a wilderness guide to an urban debt collector or detective, swap out Athletics for Computers, and Survival for Streetwise."},{"name":"Venomous Snake","type":"rival","source":{"book":"epg","page":88},"abilities":"Neurotoxin (if this creature inflicts wounds with a combat check, the target must make a Hard","setting":"general","wounds":4,"defense":{"melee":0,"ranged":2},"power":{"combat":1,"social":1,"general":1},"talents":"None.","skills":[{"name":"Brawl","rank":2},{"name":"Coercion","rank":2},{"name":"Perception","rank":2},{"name":"Survival","rank":2}],"id":"venomous-snake","characteristics":{"brawn":1,"agility":2,"intellect":1,"cunning":2,"willpower":1,"presence":1},"soak":1,"text":"Venomous snakes hunt small game, and their poisonous bite is effective at deterring predators as well. Their venom can cause a variety of severe effects, including death."},{"name":"Wanderer","equipment":"Fists (Damage 3; Brawl; Critical 5; Range [Engaged]; Disorient 2, Knockdown), rugged clothes.","type":"rival","source":{"book":"epg","page":91},"abilities":"Been There, Done That (when providing assistance, this character adds [success] [advantage] to the results instead of [boost]).","setting":"general","wounds":12,"defense":{"melee":0,"ranged":0},"power":{"combat":2,"social":2,"general":4},"talents":"Animal Companion (has a silhouette 0 animal companion; once per round, may spend a maneuver to direct the animal to perform one action and one maneuver during this character's turn).","skills":[{"name":"Brawl","rank":2},{"name":"Charm","rank":2},{"name":"Cool","rank":1},{"name":"Knowledge","rank":2},{"name":"Mechanics","rank":1},{"name":"Negotiation","rank":1},{"name":"Resilience","rank":3},{"name":"Streetwise","rank":2},{"name":"Survival","rank":2},{"name":"Vigilance","rank":3}],"id":"wanderer","characteristics":{"brawn":3,"agility":3,"intellect":2,"cunning":4,"willpower":1,"presence":2},"soak":4,"text":"The wanderer never stays in one place for long, and doesn\u2019t seem to have a home. They happily, or perhaps quietly, roam from place to place doing odd jobs. They often have a traveling companion in the form of a stray animal, or possibly even a small drone or robot (two creatures that would serve in this role would be the dog and falcon on page 87)."},{"name":"Warrior","equipment":"Fists (Brawl; Damage 3; Critical 5; Range [Engaged]; Disorient 1, Knockdown). I n Part II, we discussed new rules for creating your own vehicles and adversaries. Now, in Part III, we\u2019re going to introduce new alternate rules that you can use to further customize your own Genesys games. These alternate rules expand on the game in the same vein as the rules presented in Part III\u2013Chapter 2 and Chapter 4 of the Genesys Core Rulebook. The first chapter in Part III of this book expands on the magic rule set, while the second chapter presents new rules for using specialization trees to purchase talents. The third chapter offers rules and guidance for one-versusmany social encounters. Finally, the forth chapter presents two new tones for use in your game.","type":"minion","source":{"book":"epg","page":93},"abilities":"None.","setting":"general","wounds":5,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":1,"general":1},"talents":"None.","skills":[{   ].map((p) => ({ ...p, archetype: find("archetypes", p.arch), careerE: find("careers", p.career), obType: find("obligation-types", p.ob.type),
    crits: p.crits.map((r) => ({ ...critAt(r), rolled: r })) }));
  const pcById = (id) => PARTY.find((p) => p.id === id);
  const isSecretOb = (p) => p.obType.kind === "secret";

  // Sample campaign people and corps. The campaign manager owns these; here they're quick links.
  const NPCS = [
    { id: "rook", name: "Rook", role: "Haas-Bioroid dock chief, Concord cargo ring", pub: "Runs the cargo ring's docks. Owes no one, says everyone.",
      gm: "Skimming Haas-Bioroid salvage. Will sell the party out to keep it quiet." },
    { id: "mx7", name: "MX-7", role: "Bioroid deckhand", pub: "Keeps asking whether the gate counts as 'outside'.",
      gm: "Someone aboard patched its Directives. It doesn't know yet." },
    { id: "okafor", name: "Jules Okafor", role: "NBN camera crew", pub: "Friendly. Films everything.",
      gm: "Streams the raw feed to an NBN buyer who pays for the party's secrets." },
  ];
  const CORPS = [
    ["haas-bioroid", "Builds the Concord's bioroid crew.", "Wants the gate's far side surveyed by bioroids only: no human witnesses."],
    ["jinteki", "Supplies the clone medics and cryo bay.", "The Meridian's crew came back. Jinteki has been growing replacements."],
    ["nbn", "Owns the broadcast rights to the voyage.", "Is scripting a disaster for the Ten act ratings spike."],
    ["weyland-consortium", "Funds the voyage and holds the party's debts.", "Means to claim the gate before the UN rules on it, whatever it costs the crew."],
  ].map(([id, pub, gm]) => ({ ...(find("factions", id) || { id, name: id }), pub, gm }));

  // ---------- Encounter NPCs (stat blocks from the library) ----------
  let npcSeq = 0;
  const makeNpc = (advId, label, count) => {
    const a = find("adversaries", advId);
    return { uid: `n${++npcSeq}`, adv: a, label: label || a.name, count: a.type === "minion" ? count || 3 : 1, dmg: 0, strainDmg: 0 };
  };
  const npcThreshold = (n) => n.adv.wounds * n.count;
  const minionsLeft = (n) => Math.max(0, n.count - Math.floor(n.dmg / n.adv.wounds));
  const npcDown = (n) => (n.adv.type === "minion" ? minionsLeft(n) === 0 : n.dmg > n.adv.wounds || (n.adv.strain && n.strainDmg > n.adv.strain));
  // What players get instead of numbers: a condition word.
  const npcCondition = (n) => {
    if (npcDown(n)) return ["Down", "bad"];
    const f = n.adv.type === "minion" ? 1 - minionsLeft(n) / n.count : n.dmg / n.adv.wounds;
    return f === 0 ? ["Unhurt", "ok"] : f < 0.5 ? ["Hurt", "warn"] : ["Badly hurt", "bad"];
  };
  const npcSkillRank = (n, skill) => {
    const s = (n.adv.skills || []).find((x) => x.name === skill);
    if (!s) return 0;
    return n.adv.type === "minion" ? Math.min(5, minionsLeft(n) - 1) : s.rank || 0;
  };

  // ---------- Pools ----------
  const emptyPool = () => ({ proficiency: 0, ability: 0, boost: 0, challenge: 0, difficulty: 0, setback: 0 });
  const mkPool = (ch, rk) => ({ ...emptyPool(), proficiency: Math.min(ch, rk), ability: Math.max(ch, rk) - Math.min(ch, rk) });
  const pcPool = (p, skill) => mkPool(p.chars[charOf(skill)], p.ranks[skill] || 0);
  const npcPool = (n, skill) => mkPool(n.adv.characteristics[Object.keys(KEY_OF).find((k) => KEY_OF[k] === charOf(skill))] || 2, npcSkillRank(n, skill));
  const miniPool = (pool) => ["proficiency", "ability"].map((t) => Array.from({ length: pool[t] }, () => dieSVG(t, null, DICE[t].name)).join("")).join("");

  // ---------- Derived stats ----------
  const tWounds = (p) => p.archetype.wounds + p.chars.Br + ((p.bonus || {}).wounds || 0);
  const tStrainBase = (p) => p.archetype.strain + p.chars.Will + ((p.bonus || {}).strain || 0);
  // House rule: the PC whose Obligation came due gets -2 strain threshold, everyone else -1, doubled on doubles.
  const obMod = (p) => (S.due && S.due.id ? (p.id === S.due.id ? -2 : -1) * (S.due.doubles ? 2 : 1) : 0);
  const tStrain = (p) => tStrainBase(p) + obMod(p);
  const isDown = (p) => p.wounds > tWounds(p) || p.strain > tStrain(p);
  const totalMag = () => PARTY.reduce((n, p) => n + p.ob.mag, 0);
  const slices = () => { let lo = 1; return PARTY.map((p) => { const s = { p, lo, hi: lo + p.ob.mag - 1 }; lo += p.ob.mag; return s; }); };

  // ---------- State ----------
  const isDesk = () => window.matchMedia("(min-width: 1000px)").matches;
  const now = Date.now();
  const npcs = [makeNpc("militia", "Globalsec guards", 3), makeNpc("combat-drone", "Weyland security drone"), makeNpc("intelligence-agent", "Agent Sato (Weyland)")];
  const S = {
    preview: false, tab: "party", live: true, unread: 0, spMenu: false, flipped: -1, freshId: 0,
    session: 5, act: "Act II \u00B7 Sh\u014D", scene: "Dock 9, Concord cargo ring",
    story: ["player", "player", "player", "gm", "gm", "gm", "gm"],
    obRoll: null, due: null,
    notes: "Rook is stalling the guards. If the party spares the drone, Sato remembers it in Act III.\nOkafor is filming from the gantry.",
    init: { rolled: true, round: 1, cur: 1, surprised: false, filled: { 0: "krum" },
      slots: [{ side: "pc", s: 3, a: 1, by: "krum" }, { side: "npc", ref: "n2", s: 2, a: 2 }, { side: "pc", s: 2, a: 0, by: "fizz" },
        { side: "npc", ref: "n1", s: 1, a: 1 }, { side: "pc", s: 1, a: 2, by: "prance" }, { side: "pc", s: 1, a: 0, by: "adarius" },
        { side: "npc", ref: "n3", s: 0, a: 1 }, { side: "pc", s: 0, a: 0, by: "behnsun" }] },
    feed: [
      { id: 1, who: "fizz", check: "Athletics: hauling the cargo pod", netS: 1, netA: -2, triumph: 0, despair: 0, spentT: [], at: now - 1 * 60e3 },
      { id: 2, who: "behnsun", check: "Medicine: cryo pod 14", netS: -1, netA: 2, triumph: 0, despair: 0, spent: ["Notice a single important point in the ongoing conflict"], spentT: [], at: now - 3 * 60e3 },
      { id: 3, who: "gm", check: "Vigilance for Prance: sabotage alarm", netS: 1, netA: -2, triumph: 0, despair: 0, secret: true, spentT: [], at: now - 5 * 60e3 },
      { id: 4, who: "krum", check: "Computers (Hacking): nav ICE", netS: 2, netA: 1, triumph: 1, despair: 0,
        spent: ["Do something vital", "Recover 1 strain."], spentT: [], at: now - 8 * 60e3 },
    ],
    d: { open: false },
  };
  let feedSeq = 10;
  try { const saved = localStorage.getItem("ttg-gm-notes"); if (saved !== null) S.notes = saved; } catch (e) {}
  const $ = (id) => document.getElementById(id);
  const gm = () => !S.preview;
  let toastTimer = 0;
  const toast = (text) => { const t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2800); };
  const post = (entry) => { const e = { id: ++feedSeq, spentT: [], at: Date.now(), ...entry }; S.feed.unshift(e); S.freshId = e.id; if (S.tab !== "feed" && !isDesk()) S.unread++; return e; };
  const sysPost = (text) => post({ who: "sys", text });
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? "now" : m < 60 ? `${m}m` : `${Math.round(m / 60)}h`; };
  const gmTag = () => `<span class="tag gm">GM only</span>`;
  const gmBlock = (inner) => (gm() ? `<div class="gmonly"><div class="gmhd">${gmTag()}</div>${inner}</div>` : "");

  // ---------- Top bar: session, story points, view ----------
  const playerPoints = () => S.story.filter((x) => x === "player").length;
  function renderTop() {
    $("sess").textContent = `Session ${S.session} \u00B7 ${S.act}`;
    $("tokens").innerHTML = S.story.map((x, i) => {
      const label = x === "gm" ? (gm() ? "GM story point. Tap to spend." : "GM story point") : "Player story point";
      return `<button type="button" class="tok ${x}${i === S.flipped ? " flip" : ""}" data-tok="${i}" aria-label="${label}" title="${label}"${x === "player" || !gm() ? ' aria-disabled="true"' : ""}></button>`;
    }).join("");
    $("sp-count").textContent = `${playerPoints()} player \u00B7 ${S.story.length - playerPoints()} GM`;
    const m = $("sp-menu");
    m.hidden = !S.spMenu || !gm();
    if (!m.hidden) m.innerHTML = `<p>Spend a GM story point. It flips to the players' side.</p>
      <button type="button" class="btn" data-act="sp-complication">Introduce a complication</button>
      <button type="button" class="btn" data-act="sp-npc">Upgrade an NPC check (opens the roller)</button>

  }
  function flipGm(why) {
    const i = S.story.indexOf("gm");
    if (i < 0) { toast("No GM story points left"); return false; }

  // ---------- Phone tabs ----------
  const pendingThreat = () => S.feed.filter((e) => threatLeft(e).any && !e.tDone && e.who !== "gm" && e.who !== "sys").length;
  function renderTabs() {

  // ---------- Party ----------
  function bar(kind, cur, max, base, p) {
    const over = cur > max, pct = Math.min(100, (cur / Math.max(1, max)) * 100);
    const title = kind === "wounds" ? "Wounds" : "Strain";
    const mod = kind === "strain" && max !== base ? `<span class="why">${max - base} Obligation</span>` : "";
    return `<div class="bar"><div class="hd"><span class="label">${title}</span><span class="v"><b>${cur}</b> / ${max !== base ? `<s>${base}</s> ` : ""}${max}</span></div>
      <div class="meter ${kind === "wounds" ? "wound" : "strain"}${over ? " over" : ""}" role="img" aria-label="${title} ${cur} of ${max}"><i style="width:${pct}%"></i></div>
      ${gm() ? `<div class="ctl"><button type="button" class="btn step" data-adj="${kind}" data-pc="${p.id}" data-by="-1" aria-label="${p.name}: ${kind === "wounds" ? "heal 1 wound" : "recover 1 strain"}">&minus;</button>
        <button type="button" class="btn step" data-adj="${kind}" data-pc="${p.id}" data-by="1" aria-label="${p.name}: ${kind === "wounds" ? "take 1 wound" : "suffer 1 strain"}">+</button>${mod}</div>` : mod}</div>`;
  }
  function obChip(p) {
    if (!gm() && isSecretOb(p)) return `<span class="tag">Secret</span>`;
    const due = S.due && S.due.id === p.id;
    return `<span class="tag${due ? " warn" : ""}">${esc(p.obType.name)} ${p.ob.mag}${due ? " \u00B7 due" : ""}</span>`;

  function pcCard(p) {
    const flags = [isDown(p) ? `<span class="tag bad">Incapacitated</span>` : "",

    return `<article class="pc${isDown(p) ? " down" : ""}${S.flash === p.id ? " flash" : ""}" style="--pc:${p.color}">
      <div class="row1"><span class="av" aria-hidden="true">${p.initials}</span>
        <div><h3><button type="button" data-pcopen="${p.id}">${esc(p.name)}</button></h3><div class="sub">${p.archetype.name} \u00B7 ${p.careerE.name}</div></div>

  function renderParty() {
