<title>GM Campaign Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: same ship-console tokens as the sheet. Wide desktop = party + session | initiative + NPCs | roll feed.
   Narrow desktop = party + session | initiative over feed. Phone = one panel at a time under a sticky tab strip,
   drawers as bottom sheets. GM-only things carry a dashed GM tag and vanish in "View as player". */
:root {
  --bg: #e6ecec; --surface: #f6f9f9; --surface-2: #edf2f2; --ink: #12201f; --muted: #586a69; --line: #c6d2d1;
  --accent: #0d6f78; --accent-ink: #ffffff; --good: #1f7a3a; --warn: #9a6200; --bad: #a32b2b;
  --wound: #b23a3a; --strain: #2f6fb0; --gm: #7a4bb0;
  --die-stroke: rgba(0,0,0,.18); --shadow: 0 1px 2px rgba(18,32,31,.08), 0 10px 30px rgba(18,32,31,.16);
  --f-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --d-ability: #3f9b46; --d-prof: #f2c230; --d-boost: #8fd0ea; --d-diff: #5b3c8f; --d-chal: #b8262f; --d-set: #1b1b1d;
  --pc-1: #0d6f78; --pc-2: #7a4bb0; --pc-3: #9a6200; --pc-4: #2f6fb0; --pc-5: #b23a3a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1214; --surface: #141d20; --surface-2: #1a252a; --ink: #e2ebeb; --muted: #8ea1a2; --line: #26363b;
    --accent: #49bfc8; --accent-ink: #062224; --good: #5fcf7e; --warn: #e3b04b; --bad: #f07a7a;
    --wound: #f07a7a; --strain: #78b4ef; --gm: #b79be0;
    --die-stroke: rgba(255,255,255,.28); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    --pc-1: #49bfc8; --pc-2: #b79be0; --pc-3: #e3b04b; --pc-4: #78b4ef; --pc-5: #f07a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1214; --surface: #141d20; --surface-2: #1a252a; --ink: #e2ebeb; --muted: #8ea1a2; --line: #26363b;
  --accent: #49bfc8; --accent-ink: #062224; --good: #5fcf7e; --warn: #e3b04b; --bad: #f07a7a;
  --wound: #f07a7a; --strain: #78b4ef; --gm: #b79be0;
  --die-stroke: rgba(255,255,255,.28); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  --pc-1: #49bfc8; --pc-2: #b79be0; --pc-3: #e3b04b; --pc-4: #78b4ef; --pc-5: #f07a7a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 600; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1480px; margin: 0 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.step { width: 30px; height: 28px; padding: 0; font-weight: 700; font-size: 15px; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); white-space: nowrap; }
.tag.gm { border: 1px dashed var(--gm); color: var(--gm); }
.tag.bad { border-color: var(--bad); color: var(--bad); }
.tag.warn { border-color: var(--warn); color: var(--warn); }
.tag.ok { border-color: var(--good); color: var(--good); }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.cite { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; vertical-align: 2px; white-space: nowrap; }
.glyph { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -0.15em; }
.glyph svg { width: 100%; height: 100%; display: block; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
/* GM-only blocks: a dashed purple edge so the GM always knows what players can't see */
.gmonly { border: 1px dashed var(--gm) !important; border-radius: 10px; padding: 8px 10px; background: color-mix(in srgb, var(--gm) 6%, transparent); }
.gmonly > .gmhd { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 6px; }
.proto { font-size: 12px; padding: 2px 8px; border: 1px dashed var(--line); border-radius: 99px; color: var(--muted); }
.sess { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); }
.spacer { flex: 1; }
@media (max-width: 759px) {
  .spacer, #sp-label, .proto { display: none; }
  .tok { width: 22px; height: 22px; } .tok.player::after { inset: 4px; } .tok.gm::after { inset: 5px; }
  .story { flex-basis: 100%; }
}
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; cursor: pointer; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live[aria-pressed="true"] i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); animation: pulse 2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; } }
.viewas { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.viewas button { border: 0; background: var(--surface); padding: 5px 12px; font-size: 13px; cursor: pointer; }
.viewas button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.banner { margin-top: 10px; border: 1px dashed var(--accent); border-radius: 10px; padding: 8px 12px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: color-mix(in srgb, var(--accent) 7%, transparent); }

/* Story points (shared pool, GM side here) */
.story { position: relative; display: flex; align-items: center; gap: 8px; }
.tokens { display: flex; gap: 4px; flex-wrap: wrap; }
.tok { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); padding: 0; position: relative; cursor: default; }
.tok.player { background: var(--surface); }
.tok.player::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--accent); }
.tok.gm { background: var(--ink); cursor: pointer; }
.tok.gm::after { content: ""; position: absolute; inset: 6px; transform: rotate(45deg); background: var(--surface); border-radius: 2px; }
.preview .tok.gm { cursor: default; }
.tok.flip { animation: flip .5s ease; }
@keyframes flip { 0% { transform: rotateY(0) } 50% { transform: rotateY(90deg) } 100% { transform: rotateY(0) } }
.sp-count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.sp-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 8px; }
.sp-menu p { margin: 0; font-size: 13px; color: var(--muted); }
.sp-menu .btn { text-align: left; }

/* Board */
.board { display: grid; gap: 16px; margin-top: 14px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
@media (min-width: 1280px) { .board { grid-template-columns: minmax(320px, 380px) minmax(0, 1fr) minmax(320px, 400px); } }
@media (min-width: 1000px) and (max-width: 1279px) { .board { grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); grid-template-rows: auto 1fr; } .col-a { grid-row: span 2; } .col-c { grid-column: 2; } }
@media (max-width: 999px) { .col { display: contents; } [data-desk-only] { display: none !important; } }
@media (min-width: 1000px) { [data-phone-only] { display: none !important; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.panel > header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; padding: 12px 14px 8px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-size: 19px; font-weight: 600; letter-spacing: .03em; }
.panel h2 small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-left: 6px; }
.panel .pbody { padding: 0 14px 14px; display: grid; gap: 10px; }
.hdacts { display: flex; flex-wrap: wrap; gap: 6px; }

/* Phone tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 4px; border-bottom: 1px solid var(--line); scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); margin-top: 10px; }
.tabs button { border: 0; background: none; padding: 11px 12px 9px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--bad); color: #fff; font-family: var(--f-mono); font-size: 11px; margin-left: 4px; vertical-align: 1px; }
.badge.soft { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* Party */
.summary { display: flex; flex-wrap: wrap; gap: 6px; }
.pc { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; display: grid; gap: 6px; position: relative; border-left: 4px solid var(--pc); }
.pc.down { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); border-left-width: 4px; }
.pc.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); } 100% { background: var(--surface); } }
.pc .row1 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.av { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 16px; background: color-mix(in srgb, var(--pc, var(--accent)) 22%, var(--surface)); border: 1px solid var(--line); flex: none; }
.pc h3 { margin: 0; font-size: 16px; line-height: 1.15; }
.pc h3 button { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 700; text-align: left; }
.pc h3 button:hover { color: var(--accent); }
.pc .sub { font-size: 12px; color: var(--muted); }
.pc .flags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.bars { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.bar .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.bar .v { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.bar .v b { font-size: 16px; color: var(--ink); }
.bar .v s { color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin: 4px 0; }
.meter i { display: block; height: 100%; border-radius: 3px; transition: width .3s ease; }
.meter.wound i { background: var(--wound); } .meter.strain i { background: var(--strain); }
.meter.over i { background: var(--bad); }
.bar .ctl { display: flex; gap: 4px; align-items: center; }
.bar .ctl .why { font-size: 11px; color: var(--warn); margin-left: 4px; }
.pc .row3 { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.pc .row3 b { color: var(--ink); font-family: var(--f-mono); }

/* Session: Obligation check */
.slices { display: flex; height: 30px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.slices .sl { display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 13px; color: #fff; background: var(--pc); min-width: 0; overflow: hidden; white-space: nowrap; }
.slices .sl.hit { box-shadow: inset 0 0 0 3px var(--ink); }
.slices .rest { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.marker { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; transform: translateX(-1px); }
.scale { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 3px; }
.legend { display: grid; gap: 4px; font-size: 13px; }
.legend div { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--pc); }
.legend .rg { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.due { border-radius: 10px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 4px; }
.due b.n { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.due.hit { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.links { display: grid; gap: 6px; }
.lk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 14px; }
.lk:hover { border-color: var(--accent); }
.lk small { display: block; color: var(--muted); font-size: 12px; }
textarea { width: 100%; min-height: 120px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); resize: vertical; line-height: 1.5; }
details.sect > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
details.sect > summary::-webkit-details-marker { display: none; }
details.sect > summary::before { content: "\25B8"; color: var(--muted); font-size: 12px; transition: transform .15s; }
details.sect[open] > summary::before { transform: rotate(90deg); }
h3.sh { margin: 0; font-family: var(--f-display); font-size: 15px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

/* Initiative */
.round { display: flex; align-items: baseline; gap: 8px; }
.round b { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 28px 54px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.slot .ix { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: center; }
.slot .side { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-align: center; border-radius: 6px; padding: 2px 0; }
.slot .side.pc { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.slot .side.npc { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.slot .who { min-width: 0; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.slot .who .open { color: var(--muted); font-style: italic; }
.slot .res { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.slot .res svg { width: 14px; height: 14px; }
.slot.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), var(--shadow); }
.slot.done { opacity: .55; }
.slot.gone .who { text-decoration: line-through; color: var(--muted); }
.fill { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; margin-top: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .dp { display: inline-flex; gap: 2px; }
.chip .dp i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--d-diff); display: inline-block; }
.chip svg { width: 16px; height: 16px; }
.chip .pcdot { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; color: var(--muted); font-size: 14px; display: grid; gap: 8px; }

/* NPCs */
.npcs { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.foe { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; display: grid; gap: 6px; }
.foe.gone { opacity: .55; }
.foe .row1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.foe h3 { margin: 0; font-size: 15px; }
.foe .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.foe .stats b { color: var(--ink); font-family: var(--f-mono); }
.minions { display: flex; gap: 4px; }
.minions i { width: 16px; height: 16px; border-radius: 4px; background: var(--bad); opacity: .85; }
.minions i.dead { background: transparent; border: 1px dashed var(--muted); opacity: 1; }
.hit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hit input { width: 64px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.cond { font-size: 13px; font-weight: 700; }
.cond.ok { color: var(--good); } .cond.warn { color: var(--warn); } .cond.bad { color: var(--bad); }

/* Feed */
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.feed li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.feed li.fresh { animation: flash 1.6s ease; }
.feed li.sys { background: transparent; border-style: dashed; }
.feed .av { width: 34px; height: 34px; font-size: 13px; border-radius: 9px; }
.feed .t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 14px; }
.feed .t time { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: auto; }
.feed .chk { font-size: 13px; color: var(--muted); }
.feed .r { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 4px; font-size: 13px; }
.feed .r .v { font-weight: 700; }
.feed .r .v.ok { color: var(--good); } .feed .r .v.no { color: var(--bad); }
.syms { display: inline-flex; align-items: center; gap: 3px; font-family: var(--f-mono); font-size: 12px; }
.syms svg { width: 15px; height: 15px; }
.feed .spent { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.feed .spent span { border: 1px dashed var(--line); border-radius: 99px; padding: 1px 8px; }
.feed .spent span.gm { border-color: var(--gm); color: var(--gm); }
.feed .secret { font-style: italic; color: var(--muted); font-size: 13px; }
.pending { border-color: var(--bad) !important; }
.lock { font-size: 11px; border: 1px dashed var(--gm); color: var(--gm); border-radius: 4px; padding: 0 5px; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
.drawer { position: fixed; z-index: 31; background: var(--surface); box-shadow: var(--shadow); flex-direction: column; overflow: hidden; }
.drawer:not([hidden]) { display: flex; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(() => {
  // ---------- Genesys dice (face tables) ----------
  // s success, f failure, a advantage, t threat, r triumph, d despair
  const DICE = {
    proficiency: { name: "Proficiency", short: "d12", shape: "d12", color: "var(--d-prof)", hex: "#f2c230", ink: "#1b1b1d", pos: true,
      faces: ["", "s", "s", "ss", "ss", "a", "sa", "sa", "sa", "aa", "aa", "r"] },
    ability: { name: "Ability", short: "d8", shape: "d8", color: "var(--d-ability)", hex: "#3f9b46", ink: "#0d1f10", pos: true,
      faces: ["", "s", "s", "ss", "a", "a", "sa", "aa"] },
    boost: { name: "Boost", short: "d6", shape: "d6", color: "var(--d-boost)", hex: "#8fd0ea", ink: "#10222b", pos: true,
      faces: ["", "", "s", "sa", "aa", "a"] },
    challenge: { name: "Challenge", short: "d12", shape: "d12", color: "var(--d-chal)", hex: "#b8262f", ink: "#ffffff", pos: false,
      faces: ["", "f", "f", "ff", "ff", "t", "t", "ft", "ft", "tt", "tt", "d"] },
    difficulty: { name: "Difficulty", short: "d8", shape: "d8", color: "var(--d-diff)", hex: "#5b3c8f", ink: "#ffffff", pos: false,
      faces: ["", "f", "ff", "t", "t", "t", "tt", "ft"] },
    setback: { name: "Setback", short: "d6", shape: "d6", color: "var(--d-set)", hex: "#1b1b1d", ink: "#ffffff", pos: false,
      faces: ["", "", "f", "f", "t", "t"] },
  };
  const ORDER = ["proficiency", "ability", "boost", "challenge", "difficulty", "setback"];
  const SYM_NAME = { s: "Success", f: "Failure", a: "Advantage", t: "Threat", r: "Triumph", d: "Despair" };
  // Same glyphs as the <symbol> defs, reused to paint the 3D die faces.
  const GLYPH = {
    s: { d: "M12 1 L14.6 9.4 L23 12 L14.6 14.6 L12 23 L9.4 14.6 L1 12 L9.4 9.4 Z" },
    f: { d: "M4 6.5 L6.5 4 L12 9.5 L17.5 4 L20 6.5 L14.5 12 L20 17.5 L17.5 20 L12 14.5 L6.5 20 L4 17.5 L9.5 12 Z" },
    a: { d: "M12 2 L21 10 L18.2 12.6 L12 7.2 L5.8 12.6 L3 10 Z M12 10.5 L21 18.5 L18.2 21.1 L12 15.7 L5.8 21.1 L3 18.5 Z" },
    t: { d: "M12 22 L21 14 L18.2 11.4 L12 16.8 L5.8 11.4 L3 14 Z M12 13.5 L21 5.5 L18.2 2.9 L12 8.3 L5.8 2.9 L3 5.5 Z" },
    r: { ring: true, d: "M12 4.5 L13.7 10.3 L19.5 12 L13.7 13.7 L12 19.5 L10.3 13.7 L4.5 12 L10.3 10.3 Z" },
    d: { ring: true, d: "M7 8.6 L8.6 7 L12 10.4 L15.4 7 L17 8.6 L13.6 12 L17 15.4 L15.4 17 L12 13.6 L8.6 17 L7 15.4 L10.4 12 Z" },
  };

  const tally = (face) => {
    const c = { s: 0, f: 0, a: 0, t: 0, r: 0, d: 0 };
    for (const ch of face) c[ch]++;
    return c;
  };
  const rand = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const randf = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; };

  const poolList = (pool) => ORDER.flatMap((t) => Array(pool[t]).fill(t));
  function scoreDice(dice) {
    const t = dice.reduce((acc, d) => { const c = tally(d.face); for (const k in c) acc[k] += c[k]; return acc; },
      { s: 0, f: 0, a: 0, t: 0, r: 0, d: 0 });
    const netS = t.s + t.r - t.f - t.d;
    const netA = t.a - t.t;
    return { dice, raw: t, netS, netA, triumph: t.r, despair: t.d, success: netS >= 1 };
  }
  const instantRoll = (types) => types.map((type) => ({ type, face: DICE[type].faces[rand(DICE[type].faces.length)] }));

  // ---------- 3D dice: three.js render + cannon.js physics, walled in by the viewport ----------
  const Dice3D = (() => {
    const PX_PER_UNIT = 34, FOV = 30, GRAVITY = -60;
    const PHI = (1 + Math.sqrt(5)) / 2;
    let ok = false, renderer, scene, camera, world, floorMesh, walls = {}, live = [], raf = 0, fadeTimer = 0, bounds = { x: 6, z: 8 };
    const v3 = (x, y, z) => ({ x, y, z });
    const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
    const sub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
    const cross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
    const norm = (a) => { const l = Math.hypot(a.x, a.y, a.z); return v3(a.x / l, a.y / l, a.z / l); };
    const signs = (fn) => { const out = []; for (const i of [1, -1]) for (const j of [1, -1]) for (const k of [1, -1]) out.push(fn(i, j, k)); return out; };
    const cyc = (a, b) => [v3(0, a, b), v3(a, b, 0), v3(b, 0, a)];
    const pm = (fn) => [[1, 1], [1, -1], [-1, 1], [-1, -1]].flatMap(([i, j]) => fn(i, j));

    // Vertices + face normals per shape; faces are derived so every die shares one builder.
    const SOLIDS = {
      d6: { radius: 1.3, inset: 0.707, verts: signs((i, j, k) => v3(i, j, k)),
            normals: [v3(1, 0, 0), v3(-1, 0, 0), v3(0, 1, 0), v3(0, -1, 0), v3(0, 0, 1), v3(0, 0, -1)] },
      d8: { radius: 1.45, inset: 0.5, verts: [v3(1, 0, 0), v3(-1, 0, 0), v3(0, 1, 0), v3(0, -1, 0), v3(0, 0, 1), v3(0, 0, -1)],
            normals: signs((i, j, k) => v3(i, j, k)) },
      d12: { radius: 1.45, inset: 0.809,
             verts: [...signs((i, j, k) => v3(i, j, k)), ...pm((i, j) => cyc(i / PHI, j * PHI))],
             normals: pm((i, j) => cyc(i * PHI, j)) },
    };

    function faces(solid) {
      const verts = solid.verts.map(norm);
      return solid.normals.map((n0) => {
        const n = norm(n0);
        const best = Math.max(...verts.map((v) => dot(v, n)));
        const idx = verts.map((v, i) => [dot(v, n), i]).filter(([d]) => d > best - 1e-6).map(([, i]) => i);
        const c = idx.reduce((acc, i) => v3(acc.x + verts[i].x / idx.length, acc.y + verts[i].y / idx.length, acc.z + verts[i].z / idx.length), v3(0, 0, 0));
        const u = norm(sub(verts[idx[0]], c)), w = cross(n, u);
        const ang = (i) => { const p = sub(verts[i], c); return Math.atan2(dot(p, w), dot(p, u)); };
        idx.sort((a, b) => ang(a) - ang(b));
        const rFace = Math.max(...idx.map((i) => Math.hypot(...Object.values(sub(verts[i], c)))));
        return { n, idx, c, u, w, rFace };
      });
    }

    const texCache = new Map();
    function faceTexture(type, face, inset) {
      const key = `${type}|${face}`;
      if (texCache.has(key)) return texCache.get(key);
      const size = 256, cv = document.createElement("canvas");
      cv.width = cv.height = size;
      const g = cv.getContext("2d");
      g.fillStyle = DICE[type].hex; g.fillRect(0, 0, size, size);
      const syms = [...face];
      const room = size * 0.5 * inset * 0.8;
      const s = syms.length > 1 ? room * 0.95 : room * 1.35;
      syms.forEach((ch, i) => {
        const cx = size / 2 + (syms.length > 1 ? (i === 0 ? -s / 2 : s / 2) : 0);
        paintGlyph(g, GLYPH[ch], cx, size / 2, s, DICE[type].ink);
      });
      const tex = new THREE.CanvasTexture(cv);
      tex.anisotropy = 4;
      texCache.set(key, tex);
      return tex;
    }
    function paintGlyph(g, glyph, cx, cy, s, ink) {
      g.save();
      g.translate(cx - s / 2, cy - s / 2); g.scale(s / 24, s / 24);
      g.fillStyle = ink; g.strokeStyle = ink; g.lineWidth = 2.4;
      if (glyph.ring) { g.beginPath(); g.arc(12, 12, 10, 0, Math.PI * 2); g.stroke(); }
      g.fill(new Path2D(glyph.d));
      g.restore();
    }

    const shapeCache = {};
    function shape(kind) {
      if (shapeCache[kind]) return shapeCache[kind];
      const solid = SOLIDS[kind], fs = faces(solid), r = solid.radius;
      const verts = solid.verts.map(norm);
      const pos = [], nrm = [], uv = [], groups = [];
      fs.forEach((f, fi) => {
        const start = pos.length / 3;
        for (let k = 1; k < f.idx.length - 1; k++) {
          for (const vi of [f.idx[0], f.idx[k], f.idx[k + 1]]) {
            const v = verts[vi], p = sub(v, f.c);
            pos.push(v.x * r, v.y * r, v.z * r); nrm.push(f.n.x, f.n.y, f.n.z);
            uv.push(0.5 + 0.5 * dot(p, f.u) / f.rFace, 0.5 + 0.5 * dot(p, f.w) / f.rFace);
          }
        }
        groups.push([start, pos.length / 3 - start, fi]);
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute("normal", new THREE.Float32BufferAttribute(nrm, 3));
      geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
      groups.forEach(([s, c, m]) => geo.addGroup(s, c, m));
      const body = new CANNON.ConvexPolyhedron(verts.map((v) => new CANNON.Vec3(v.x * r, v.y * r, v.z * r)), fs.map((f) => f.idx.slice()));
      return (shapeCache[kind] = { geo, body, faces: fs, inset: solid.inset, radius: r });
    }

    function init() {
      if (!window.THREE || !window.CANNON) return false;
      try {
        const canvas = document.getElementById("dice3d");
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      } catch (e) { return false; }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 1000);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.75));
      const sun = new THREE.DirectionalLight(0xffffff, 0.75);
      sun.position.set(-8, 30, 10); sun.castShadow = true;
      Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 });
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.updateProjectionMatrix();
      scene.add(sun);
      floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.22 }));
      floorMesh.rotation.x = -Math.PI / 2; floorMesh.receiveShadow = true;
      scene.add(floorMesh);
      buildWorld();
      resize();
      window.addEventListener("resize", resize);
      return (ok = true);
    }

    function buildWorld() {
      world = new CANNON.World();
      world.gravity.set(0, GRAVITY, 0);
      world.broadphase = new CANNON.NaiveBroadphase();
      world.solver.iterations = 12;
      const mat = new CANNON.Material("dice");
      world.addContactMaterial(new CANNON.ContactMaterial(mat, mat, { friction: 0.35, restitution: 0.35 }));
      world.defaultContactMaterial.friction = 0.35;
      world.defaultContactMaterial.restitution = 0.35;
      const plane = (axis, angle) => {
        const b = new CANNON.Body({ mass: 0, material: mat });
        b.addShape(new CANNON.Plane());
        if (axis) b.quaternion.setFromAxisAngle(axis, angle);
        world.addBody(b);
        return b;
      };
      const X = new CANNON.Vec3(1, 0, 0), Y = new CANNON.Vec3(0, 1, 0);
      walls = { floor: plane(X, -Math.PI / 2), ceil: plane(X, Math.PI / 2), left: plane(Y, Math.PI / 2),
                right: plane(Y, -Math.PI / 2), top: plane(null, 0), bottom: plane(Y, Math.PI) };
      walls.ceil.position.set(0, 9, 0);
      Dice3D.mat = mat;
    }

    // Size the world so one unit is PX_PER_UNIT pixels on any screen, then put the walls at the window edges.
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;

s raging rivers, and leaping across chasms."},{"id":"brawl","name":"Brawl","category":"Combat","characteristic":"brawn","text":"The Brawl skill is what your character uses to fight anyone who\u2019s right in front of them, rather than beyond arm\u2019s reach, when your character is fighting without any weapons. Martial arts, wrestling, and unarmed combat are all covered by this skill.","source":{"book":"crb","page":67}},{"category":"Social","avoid-when":["Your character is not at all sincere about what they are saying or doing. If there\u2019s duplicity or lying involved, your character should use the Deception skill.","Your character is being polite, but subtly implying"],"name":"Charm","source":{"book":"crb","page":54},"characteristic":"presence","id":"charm","use-when":["Your character tries to persuade someone to do your character a favor, especially if it might be inconvenient, expensive, or even dangerous for that person.","Your character tries to appeal to someone\u2019s better nature (even if it doesn\u2019t exist!) to get them to do something out of character for that person.","Your character tries to flirt with, seduce, or make a romantic overture to someone.","Your character tries to make themselves look better to everyone around them. A lot of politicians and public figures have high ranks in Charm.","Your character performs in front of an audience, acting, playing music, telling jokes, or giving a speech."],"text":"The ability to compliment, flatter, woo, and generally make other people like you is something that\u2019s pretty important to a lot of player characters. For characters who want to be likable, popular, and good at persuading other people to do what they want them to do, Charm is the skill they rely on."},{"category":"Social","avoid-when":["Your character issues orders backed by the threat of their authority (such as threatening troops with courts-martial if they don\u2019t follow your character into battle). In cases like this, Leadership would be a better skill for your character to use.","Your character tries to drive a hard bargain with someone. As long as both sides are still getting something out of the deal, Negotiation should be the skill to use.","Your character interacts with someone who is already terrified of or completely cowed by your character. In these cases, any further threats would be superfluous."],"name":"Coercion","source":{"book":"crb","page":55},"characteristic":"willpower","id":"coercion","use-when":["Your character issues a threat, whether or not accompanied by hostile actions. Even an implied threat\u2014such as gesturing toward a weapon\u2014falls under the Coercion skill.","Your character questions or interrogates a prisoner.","Your character uses physical or psychological torture."],"text":"Some people believe that the only way to maintain respect is to be feared. Others have learned that the best way to get what they want is through screaming and the threat of violence."},{"category":"General","avoid-when":["Your character is trying to reactivate a deactivated program. This would require the Computers (Sysops) skill.","Your character is trying to open a mechanical lock. Your character needs to use Skulduggery to defeat a mechanical item of that type.","Your character is trying to backtrace someone who has intruded on a server. This also requires the Computers (Sysops) skill."],"name":"Computers (Hacking)","source":{"book":"sotb","page":43},"variant-of":"computers","characteristic":"intellect","id":"computers-hacking","use-when":["Your character is trying to enter a secured server.","Your character is shutting down a piece of ice.","Your character is trying to open an electronic lock.","Your character is trying to destroy a computer program."],"text":"Hacking represents any offensive and destructive uses of the Computers skill presented in the Genesys Core Rulebook. It covers any attempts at electronic code breaking, intrusion or, of course, running on servers and breaking ice."},{"category":"General","avoid-when":["Your character is trying to deactivate or destroy a program. This would require the Computers (Hacking) skill.","Your character wants to remember details about a particular server on the Net. They need the Knowledge (The Net) skill for that.","Your character is trying to crack an electronic code or encryption. This also requires Computers (Hacking)."],"name":"Computers (Sysops)","source":{"book":"sotb","page":44},"variant-of":"computers","characteristic":"intellect","id":"computers-sysops","use-when":["Your character is trying to backtrace a runner who is trying to hack your server.","Your character needs to activate ice or other countermeasure programs.","Your character is trying to repair a damaged program.","Your character is trying to create a new program."],"text":"If Hacking represents offensive or destructive uses of the Computers skill, Sysops represents its defensive and constructive uses. The most prominent use of Sysops is to defend computer systems against runners, viruses, and other intrusions."},{"category":"General","avoid-when":["Your character tries to prevent being surprised. The Vigilance skill would work better in that situation.","Your character tries to maintain inner self-control, such as when meditating or resisting the effects of fear. When your character is concerned with inner composure, they should use the Discipline skill."],"name":"Cool","source":{"book":"crb","page":59},"characteristic":"presence","id":"cool","use-when":["Your character begins laying a trap, staging an ambush, or otherwise setting up a combat encounter in which your character initiates the combat and has to judge the right time to do so.","Your character needs to stay calm and unaffected when being flattered or charmed by someone.","Your character needs to refrain from saying or doing something foolish during a tense situation.","Your character needs to keep their nerve in a tense situation, such as when piloting one of two vehicles headed toward each other at high speed.","Your character plays a card game or other game of chance in which bluffing, luck, and gambling are all intertwined."],"text":"Staying calm and maintaining composure, outwaiting an opponent, generally being cool: these exemplify things your character does with the Cool skill. Cool is something of a defensive skill in nature, since it most often comes up as the skill your character uses to resist attempts to sway or affect them."},{"category":"General","avoid-when":["Your character tries to climb up or down a rope or climb up a structure. This activity relies more on strength than agility, and calls for an Athletics check instead.","Your character falls from a short height or onto something soft enough that they won\u2019t suffer damage when they land, or is in any similar situation that has no consequences for failure (is lowered down a structure in a firmly secured harness, for example)."],"name":"Coordination","source":{"book":"crb","page":59},"characteristic":"agility","id":"coordination","use-when":["Your character tries to swing back and forth on a rope or rappel down a structure.","Your character walks across a narrow surface while trying to keep their balance.","Your character tries to squeeze into a tiny or cramped space such as a crawlspace, sewer pipe, air duct, or narrow crevice.","Your character falls and needs to try to slow the fall or land safely.","Your character needs to escape from physical restraints (such as handcuffs or ropes) and wants to contort their limbs or hands so that they can slip out of their bindings."],"text":"In the course of adventures, characters sometimes find themselves needing to stay stable on unsteady surfaces, crawl through narrow openings, or even land safely after a fall. Overcoming these types of challenges requires a sense of balance and a heightened degree of flexibility, both of which are represented by the Coordination skill."},{"category":"Social","avoid-when":["Your character actually believes the things they are saying (even if they are objectively untrue).","Your character tells a \u201Cwhite lie,\u201D a minor falsehood to make someone feel better."],"name":"Deception","source":{"book":"crb","page":56},"characteristic":"cunning","id":"deception","use-when":["Your character tells a lie.","Your character tries to mislead someone through clever wordplay or selective omission of certain facts.","Your character wears a disguise and pretends to be someone else."],"text":"When your character needs to lie to someone, they use Deception. In fact, the Deception skill covers most attempts to fool or deceive someone, which makes the skill one of the more straightforward skills to use."},{"category":"General","avoid-when":["Your character tries to keep their composure in a social setting and avoid letting their emotions show. Your character would make a Cool check instead.","Your character catches a lie as it is being told. Noticing a lie depends on your character\u2019s Vigilance."],"name":"Discipline","source":{"book":"crb","page":60},"characteristic":"willpower","id":"discipline","use-when":["Your character confronts something terrifying and wants to avoid fleeing in horror (or to avoid other debilitating effects of fear).","Your character tries to keep their sanity in the face of something that defies reality and rational thought.","Your character wants to heal strain they are suffering from at the end of an encounter.","Your character wants to meditate, calm their mind, and reach a mental equilibrium."],"text":"Discipline is your character\u2019s ability to focus their mind and quiet their thoughts. Discipline represents your character\u2019s maintaining self-mastery and focus, specifically."},{"category":"General","avoid-when":["Your character operates an aircraft of any kind; this would call for the Piloting skill.","Your character drives a vehicle under normal conditions (and at safe speeds) without any immediate danger, which shouldn\u2019t require a check at all.","Your character attempts to modify a vehicle to improve its speed; the Mechanics skill is more appropriate for this."],"name":"Driving","source":{"book":"crb","page":60},"characteristic":"agility","id":"driving","use-when":["Your character wants to bring a vehicle to a safe stop after one of its tires is damaged.","Your character tries to keep up speed while rounding hairpin curves when driving a vehicle.","Your character attempts to catch up to someone else in a vehicle (if the target is on foot, a check should only be necessary if they try to escape in a crowd or through a narrow space).","Your character swerves to avoid an animal darting across the road, or tries to avoid a falling rock on a winding mountain pass."],"text":"The Driving skill includes the operation of all groundbased vehicles, from simple automobiles to multi-car locomotives to high-speed futuristic driving pods. The types of vehicles depend a lot on the setting, of course."},{"id":"gunnery","name":"Gunnery","category":"Combat","characteristic":"agility","text":"Your character uses Gunnery, the third of the Ranged sub-skills, to fire machine guns, plasma cannons, heavy railguns, missile launchers, grenade launchers, and pretty much any other weapon large enough that you need a tripod or team of people to use it. Your character also uses it to fire weapons mounted on vehicles.","source":{"book":"crb","page":69},"variant-of":"ranged"},{"category":"Knowledge","avoid-when":["Your character is trying to fix a hydrogen fuel cell. This would require Mechanics.","Your character is trying to fly a spacecraft along a specific trajectory. Your character may use Knowledge (Science) to calculate the course, but they need to use Operating to fly it.","Your character needs to know the specifics of the Fed\u2019s jurisdiction in New Angeles, which would require the Knowledge (Society) skill instead. Skill Char Type Source Athletics Brawn General Core Rulebook (page 58) Brawl Brawn Combat Core Rulebook (page 67) Charm Presence Social Core Rulebook (page 54) Coercion Willpower Social Core Rulebook (page 55) Computers (Hacking) Intellect General Computers (Sysops) Intellect General Cool Presence General Core Rulebook (page 59) Coordination Agility General Core Rulebook (page 59) Deception Cunning Social Core Rulebook (page 56) Discipline Willpower General Core Rulebook (page 60) Driving Agility General Core Rulebook (page 60) Gunnery Agility Combat Core Rulebook (page 69) Knowledge (Science) Intellect Knowledge Knowledge (Society) Intellect Knowledge Knowledge (The Net) Intellect Knowledge Leadership Presence Social Core Rulebook (page 56) Mechanics Intellect General Core Rulebook (page 60) Medicine Intellect General Core Rulebook (page 61) Melee Brawn Combat Core Rulebook (page 67) Negotiation Presence Social Core Rulebook (page 56) Operating Intellect General Core Rulebook (page 62) Perception Cunning General Core Rulebook (page 62) Piloting Agility General Core Rulebook (page 62) Ranged (Heavy) Agility Combat Core Rulebook (page 69) Ranged (Light) Agility Combat Core Rulebook (page 68) Resilience Brawn General Core Rulebook (page 63) Skulduggery Cunning General Core Rulebook (page 64) Stealth Agility General Core Rulebook (page 64) Streetwise Cunning General Core Rulebook (page 65) Survival Cunning General Core Rulebook (page 65) Vigilance Willpower General Core Rulebook (page 65)"],"name":"Knowledge (Science)","source":{"book":"sotb","page":42},"variant-of":"knowledge","characteristic":"intellect","id":"knowledge-science","use-when":["Your character is trying to recall the formula for a drug or chemical.","Your character needs to remember the name of a lunar crater.","Your character tries to calculate the correct trajectory for a spacecraft entering Earth orbit.","Your character needs to know how many people a buckyweave rope can support before breaking."],"text":"Science has made great discoveries, the results of which are all around the citizens of New Angeles. New technologies such as fusion power, clones, bioroids, the space elevator, and the Net have fundamentally changed the lives of ordinary people."},{"category":"Knowledge","avoid-when":["Your character needs to find the nearest NAPD station. This would require Streetwise (although knowing information about the NAPD in general would be covered by Knowledge [Society]).","Your character needs to know some element of Network etiquette and habits. They would need Knowledge (The Net) instead.","Your character wants to know how far a local street gang\u2019s territory reaches. This would be a Streetwise check."],"name":"Knowledge (Society)","source":{"book":"sotb","page":43},"variant-of":"knowledge","characteristic":"intellect","id":"knowledge-society","use-when":["Your character wants to remember facts about New Angeles.","Your character needs to make an argument in a court of law that\u2019s grounded on a solid legal base.","Your character wants to remember how the average Loonie feels about the NAPD before traveling to Luna.","Your character wants to know if someone is trying to manipulate the stock market by short selling shares in a major company.","Your character is trying to figure out what the most powerful organized crime outfits in New Angeles are."],"text":"This skill has two distinct aspects that it governs. The first is knowledge about societies in general and how they function, which can include economic theory, sociology, law, and the like."},{"category":"Knowledge","avoid-when":["Your character is attempting to break through a piece of ice. This is handled by the Computers (Hacking) skill.","Your character is trying to reactivate or repair lines of code in a program. This is handled by the Computers (Sysops) skill.","Your character wants to see what they know about current popular culture. Although that information can be found on the Net (in exhausting detail), it still requires a Knowledge (Society) check."],"name":"Knowledge (The Net)","source":{"book":"sotb","page":43},"variant-of":"knowledge","characteristic":"intellect","id":"knowledge-the-net","use-when":["Your character wants to know which Shadow Net virtual chatspaces they should visit to recruit a reliable runner.","Your character wants to know the dangers of trying to break a piece of ice.","Your character is trying to figure out what real-world corp is hosting a server full of valuable information.","Your character is trying to remember any rumors about so-called \u201Cgod ice,\u201D \u201Cghost runners,\u201D or other legends of the Net."],"text":"These days, the Network has become far more than the internets of years past. For all intents and purposes, it is its own world, growing and changing, with its own inhabitants and dangers, all paralleling our own."},{"category":"Social","avoid-when":["Your character threatens to hurt or kill someone if they don\u2019t obey. This would be a good use of Coercion, instead.","Your character tries to convince someone to do something simply by being friendly and appealing. Your character should use Charm here.","Your character has formal authority and issues routine orders, especially outside of combat or other stressful situations. If there is no good reason not to obey your character (and your character has the rank or station to issue orders), other people are simply going to obey most mundane commands automatically."],"name":"Leadership","source":{"book":"crb","page":56},"characteristic":"presence","id":"leadership","use-when":["Your character\u2019s allies are suffering from fear (see page 243), and you want to try to rally them.","Your character tries to convince a crowd of citizens to take political action.","Your character leads troops into battle and wants to make sure they follow your character\u2019s orders.","Your character tries to convince a mob of rioters to stand down and return to their homes."],"text":"While some may follow out of a sense of duty or fear, good leaders inspire their followers through a combination of charisma, bravery, and forceful personality. We represent this quality through the Leadership skill."},{"category":"General","avoid-when":["Your character has just a simple task like refueling a vehicle, hanging a door, or changing the batteries in a flashlight.","Your character wants to program an application for a device. That would require a Computers check."],"name":"Mechanics","source":{"book":"crb","page":60},"characteristic":"intellect","id":"mechanics","use-when":["Your character needs to repair a damaged weapon, vehicle, or other piece of equipment.","Your character needs to identify any parts or tools necessary prior to completing a job. This can save time and money on the project.","Your character has access to a supply of components and tools and wants to design a completely new device.","Your character needs to sabotage an enemy\u2019s vehicle or find a weak point in their defenses.","Your character needs to build an item or modify it.","Your character tries to install and modify cybernetic implants (although if you want, working on a cybernetic implant may require a Medicine and a Mechanics check to represent the fusion of human and machine)."],"text":"The Mechanics skill allows your character to build, disassemble, repair, or modify just about anything mechanical, from a broken radio to a wrecked gyrocopter. In addition, the Mechanics skill is used when salvaging technology, building fortifications, or troubleshooting a malfunctioning water pump, or any time your character needs to swing a hammer or turn a wrench."},{"category":"General","avoid-when":["Your character researches a disease or poison. While studying a disease or poison directly might require Medicine, the act of researching requires a Knowledge check.","Your character tries to heal their own strain at the end of an encounter. Recovering from strain at the end of an encounter requires Discipline or Cool.","Your character tries to administer poison through slight of hand, such as by dropping it in a drinking cup or surreptitiously injecting it into an unsuspecting target. The inherent subterfuge in this activity makes that a Skulduggery check."],"name":"Medicine","source":{"book":"crb","page":61},"characteristic":"intellect","id":"medicine","use-when":["They or another character has suffered wounds, and your character wants to heal those wounds.","Your character tries to counteract or administer a poison.","Your character needs to cure a disease.","Your character creates a new pharmaceutical (or recreational) drug.","They or another character has suffered a Critical Injury, and your character wants to heal it.","Your character performs a complex medical procedure such as surgery, cybernetic augmentation, or psychotherapy. Three final notes: Any one character can only make one attempt to heal a particular Critical Injury per week of game time. Also, any one character can only benefit from one Medicine check per encounter. These limits exist to prevent characters from constantly repeating checks until their patient is in perfect health. Finally, if your character tries to heal themself, they increase the difficulty of the check by two. Hey, it\u2019s a lot harder to set your own broken arm!"],"text":"In the course of their adventures, we expect your character to suffer injuries: everything from cuts and bruises to broken bones and bullet wounds. Medicine gets your character and their friends back on their feet."},{"id":"melee","name":"Melee","category":"Combat","characteristic":"brawn","text":"The Melee skill is what your character uses to fight anyone who\u2019s right in front of them, rather than beyond arm\u2019s reach, when using a weapon. This skill, in its broadest interpretation, covers any sort of hand or melee weapon.","source":{"book":"crb","page":67}},{"category":"Social","avoid-when":["Your character isn\u2019t offering anything in return for what they want. Getting something for nothing is something your character can try to do using other social skills, but Negotiation is predicated on the idea of an exchange.","Your character tells someone what to do. Negotiation has to be a bargain, so at the end of the interactions, the opposing party has agreed to do something, not been ordered to do it.","Your character wants to buy something for a previously established price."],"name":"Negotiation","source":{"book":"crb","page":56},"characteristic":"presence","id":"negotiation","use-when":["Your character tries to purchase goods or services and wants to haggle over the price.","Your character tries to sell goods or services and turn a profit. In this case, your character needs to use Negotiation to raise the price.","Your character attempts to broker a political agreement or treaty between two parties."],"text":"When your character wants to make a deal, they\u2019re going to use Negotiation. If Coercion is threatening someone, Deception is lying to someone, Charm is sweet-talking someone, and Leadership is telling someone what to do, Negotiation is convincing someone to do what you want by giving them something they want in return."},{"category":"General","avoid-when":["Your character performs routine ship maneuvers in open space.","Your character wants to upgrade the engines of the ship. That requires a Mechanics check.","Your character is the captain of a ship and is giving orders. This requires the Leadership skill."],"name":"Operating","source":{"book":"crb","page":62},"characteristic":"intellect","id":"operating","use-when":["Your clipper must safely ride out a storm without losing speed (or a mast).","Your character pilots a zeppelin to slip around the stern of an opponent\u2019s flying fortress.","Your character calculates an orbital slingshot maneuver for their starship.","Your character docks a spaceship with a space station."],"text":"Sometimes, a vehicle is so big that quick reflexes and a steady hand aren\u2019t enough to operate it. When using these sorts of vehicles, for which your character needs training, a sharp mind, and the ability to keep track of a lot of information, your character employs the Operating skill."},{"category":"General","avoid-when":["Your character tries to avoid being surprised during an ambush. Constant, unconscious awareness of your character\u2019s surroundings is a function of the Vigilance skill.","Your character is being lied to, and you\u2019re trying to find out if your character noticed or not. Again, Vigilance is the skill for this situation.","Your character tries to follow a trail or track a foe through the wilderness. The Survival skill covers these activities."],"name":"Perception","source":{"book":"crb","page":62},"characteristic":"cunning","id":"perception","use-when":["Your character wants to search a crime scene for clues.","Your character wants to study the surrounding landscape for possible threats.","Your character conducts surveillance on an unaware target from a distance.","Your character studies an ancient relic, trying to spot any minute details that could reveal its purpose or construction."],"text":"When your character wants to make an active attempt to study their surroundings, notice clues in a crime scene, or search for hidden foes, they use the Perception skill to do so. Perception represents your character\u2019s conscious use of all five senses to observe their environment (or, if you\u2019re playing some sort of alien species, your character may have more than five)."},{"category":"General","avoid-when":["Your character tries to repair a damaged aircraft propeller or engine, a task that calls for the Mechanics skill.","Your character drives a car off a precipice and wants to land with as few fatalities as possible; that\u2019s still Driving (and likely with a pretty high difficulty!)","Your character fires a weapon mounted on a vehicle, which requires a Ranged or Gunnery check.","There is no chance of catastrophic failure when operating the vehicle. Checks are not required for simple tasks like flying in open skies with light wind."],"name":"Piloting","source":{"book":"crb","page":62},"characteristic":"agility","id":"piloting","use-when":["Your character needs to land an airplane with one (or both!) engines out.","Your character tries to outmaneuver opponents in a dogfight.","Your character flies a drop ship through a maze of needle-sharp rock spires to a landing zone.","Your character attempts to land a personal dirigible while under fire from an enemy airship."],"text":"This skill covers the operation of any aerial vehicle that requires reflexes and hand-eye coordination to operate, from gyrocopters and helicopters, to jet fighters and gliders, all the way up to starfighters and spacecapable drop ships. As with the Driving skill, the type of vehicles involved depend on the setting."},{"id":"ranged-heavy","name":"Ranged (Heavy)","category":"Combat","characteristic":"agility","text":"In those same firearm-focused settings, your character uses Ranged (Heavy) to shoot rifles, shotguns, assault rifles, laser rifles, and similar weapons. This skill covers pretty much every heavy ranged weapon designed to be fired while carried in two hands, but not large enough that it requires multiple people or a tripod to use.","source":{"book":"crb","page":69},"variant-of":"ranged"},{"id":"ranged-light","name":"Ranged (Light)","category":"Combat","characteristic":"agility","text":"In settings where your characters do most of their fighting with firearms, your character uses Ranged (Light) to shoot pistols, throw knives, and toss grenades at their opponents. This skill covers pretty much every light ranged weapon designed to be fired (or thrown) from one hand.","source":{"book":"crb","page":68},"variant-of":"ranged"},{"category":"General","avoid-when":["Your character tries to do something that isn\u2019t beyond the limits of normal endurance. Going for a day-long hike wouldn\u2019t call for a Resilience check unless the hike is through the Rocky Mountains in a snowstorm.","Your character immediately stops and rests to recover fully at the end of the activity. If there\u2019s no need to track lasting consequences, there\u2019s no need to make the check."],"name":"Resilience","source":{"book":"crb","page":63},"characteristic":"brawn","id":"resilience","use-when":["Your character tries to go without sleeping for days on end, and you need to see if they stay awake.","Your character ingests a toxin, and you need to see how bad the effects are.","Your character endures a hostile environment (somewhere too hot, too cold, or even too polluted) for days on end.","Your character attempts to recover from a Critical Injury on their own, without medical attention."],"text":"When the going gets tough, the tough rely on their Resilience skill to keep going. Resilience represents your character\u2019s ability to overcome pain and fight through fatigue."},{"category":"General","avoid-when":["Your character attempts to sneak into a location unnoticed. Your character needs to make a Stealth check instead.","Your character attempts to pick someone\u2019s pocket when that person is helpless or incapacitated. This doesn\u2019t require a check at all.","Your character tries to make a poison. Your character needs Medicine to make poisons or toxins, but they do need Skulduggery to use them."],"name":"Skulduggery","source":{"book":"crb","page":64},"characteristic":"cunning","id":"skulduggery","use-when":["Your character attempts to pick someone\u2019s pocket or lift their wallet.","Your character tries to pick a lock or disable a trap. Your character would also use Skulduggery to set a trap in the first place.","Your character wants to study a security system.","Your character attempts to distract an opponent through guile or a feint, such as by throwing a handful of dirt in their eyes during a fight.","Your character tries to surreptitiously slip a poison into someone\u2019s food or drink."],"text":"Most roleplaying games have a long and storied tradition of characters disarming traps, picking locks, and (if those tasks fail) breaking out of prison. In our game, characters perform those activities with the Skulduggery skill."},{"category":"General","avoid-when":["Your character tries to pick someone\u2019s pocket. Your character needs Skulduggery for this activity.","Your character tries to remain hidden when their opponent has no chance of spotting them, such as if they try to avoid being seen by an aircraft during a blizzard at midnight.","Your character has no realistic chance of hiding from an opponent, such as if trying to hide from a nearby person while in the middle of miles of salt flats at noon."],"name":"Stealth","source":{"book":"crb","page":64},"characteristic":"agility","id":"stealth","use-when":["Your character attempts to hide from someone.","Your character tries to tail someone through a crowd, and to do it without being noticed.","Your character tries to infiltrate a government installation while avoiding both electronic security and human guards.","Your character tries to move quietly through a house."],"text":"When your character wants to act unnoticed by anyone else, they use the Stealth skill. In many ways, Stealth is one of the simpler skills, and it covers a pretty specific set of activities."},{"category":"General","avoid-when":["Your character tries to find their way around a rural or wilderness environment. In this case, your character should be using Survival.","Your character interacts with the upper crust of society. Charm (or possibly Deception or Coercion) may serve the character better here.","Your character has already established themself as a member of the criminal underworld, and is continuing to interact with other criminals. Streetwise lets your character fit in, know how to act, and know what topics to bring up and what to avoid. However, it shouldn\u2019t replace social skills."],"name":"Streetwise","source":{"book":"crb","page":65},"characteristic":"cunning","id":"streetwise","use-when":["Your character looks for a merchant who sells black-market goods or illegal services.","Your character wants to understand particular references or slang in a conversation.","Your character tries to approach criminals and start up a conversation without appearing like an outsider or a threat.","Your character tries to find their way around an unfamiliar city.","Your character tries to track and hunt someone somewhere in a city."],"text":"Some call it the \u201Cschool of hard knocks,\u201D while others refer to it as \u201Cstreet smarts\u201D or \u201Cgut instincts,\u201D but in all cases, the Streetwise skill is your character\u2019s ability to survive and thrive in rough and dangerous urban areas. If your character has ranks in Streetwise, they instinctively know how criminals tend to operate, which locations to avoid after dark, where to go to obtain illicit drugs and services, and other information crucial for making their way in the seedy underbelly of a major city."},{"category":"General","avoid-when":["Your character uses a highly accurate and detailed map to find a location.","Your character tries to find their way around an urban environment. In this case, your character should be using Streetwise.","Your character interacts with an animal that already likes or respects your character, or your character asks an animal to do something completely within their nature (they wouldn\u2019t need to make a Survival check to get a dog to play \u201Cfetch,\u201D for example)."],"name":"Survival","source":{"book":"crb","page":65},"characteristic":"cunning","id":"survival","use-when":["Your character is trapped in the wilderness and needs to find food and potable water.","Your character needs to notice approaching severe weather and know how to prepare for it.","Your character needs to follow a crude map or directions through a rural area to find a specific location.","Your character tries to tame or calm a wild animal, or handle a domesticated animal.","Your character hunts something (or someone!) through a wilderness setting."],"text":"There are a thousand tricks your character needs to master in order to survive in the wilderness, and the more ranks in Survival they have, the more likely they are to know them. The Survival skill covers your character\u2019s ability to find food and water, cope with dangerous conditions, hunt and skin animals, and, well, survive in any location that doesn\u2019t have a supermarket on the corner."},{"category":"General","avoid-when":["You are determining Initiative order when your character is not surprised (such as when they are the ambushers, instead of the ambushed). In this case, your character uses Cool instead.","Your character actively looks for something. This calls for a Perception check."],"name":"Vigilance","source":{"book":"crb","page":65},"characteristic":"willpower","id":"vigilance","use-when":["Your character just got ambushed, and you are rolling to determine Initiative order. A high Vigilance means your character has a better chance of reacting quickly to the threat.","Your character is being lied to; the opponent\u2019s Deception check is opposed by your character\u2019s Vigilance skill.","Your character has a chance to notice important details in their surroundings while not looking for them directly."],"text":"Vigilance represents the ability to be constantly aware of your surroundings, often without consciously making the effort. Characters with ranks in Vigilance are more likely to spot threats in their environment, notice important clues out of the corner of their eye, and catch lies as they\u2019re being told."}],"adversaries":[{"name":"Ace","equipment":"None.","type":"rival","source":{"book":"epg","page":91},"abilities":"None.","setting":"general","wounds":8,"defense":{"melee":0,"ranged":0},"power":{"combat":3,"social":2,"general":2},"talents":"Barrel Roll (when piloting a starfighter or airplane of silhouette 3 or less, after suffering a hit, may suffer 3 system strain to reduce the damage by four as an incidental), Defensive Driving 2 (increase the defense of any vehicle this character pilots by two).","skills":[{"name":"Charm","rank":1},{"name":"Coordination","rank":2},{"name":"Gunnery","rank":3},{"name":"Mechanics","rank":1},{"name":"Piloting","rank":4},{"name":"Ranged","rank":2},{"name":"Vigilance","rank":2}],"id":"ace","characteristics":{"brawn":2,"agility":4,"intellect":2,"cunning":2,"willpower":2,"presence":3},"soak":2,"text":"Traditionally, any pilot who downs five enemy aircraft is an ace. Aces can push vehicles beyond normal tolerances to make maneuvers no one else can. In the age of myth, fantasy, and monsterworld settings, replace the Piloting skill with the Riding skill. In the post apocalypse setting, replace the Piloting skill with the Driving skill."},{"name":"Advisor","equipment":"None.","type":"nemesis","source":{"book":"epg","page":89},"abilities":"Take a Breath (once per encounter, may suffer 2 strain as an out-of-turn incidental during an ally\u2019s turn; the ally loses a maneuver and either heals 6 strain or may reroll a fear check they just failed).","setting":"general","wounds":8,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":6,"general":4},"talents":"Second Wind 3 (once per encounter as an incidental, may heal 3 strain).","skills":[{"name":"Cool","rank":3},{"name":"Deception","rank":3},{"name":"Discipline","rank":3},{"name":"Knowledge","rank":4},{"name":"Perception","rank":2},{"name":"Vigilance","rank":2}],"id":"advisor","characteristics":{"brawn":2,"agility":1,"intellect":2,"cunning":2,"willpower":4,"presence":3},"strain":16,"soak":2,"text":"An advisor might be a therapist, priest, or a wise political advisor. They are more defensive socially than offensive, which means a group will have to work hard to overcome them in a social encounter."},{"name":"Alien Warlord","equipment":"Finely crafted shudder blade (Melee; Damage 6; Critical 2; Range [Engaged]; Pierce 2, Vicious 3), laser pistol (Ranged [Light]; Damage 5; Critical 3; Range [Medium]; Pierce 2), heavy sealed armor (+2 soak), platinum-weave cloak, crimson banner of glorious conquest, sniveling servant to carry banner of glorious conquest.","type":"nemesis","source":{"book":"crb","page":188},"abilities":"Tactical Direction (may spend a maneuver to direct one friendly minion group within medium range; that group may immediately perform a free maneuver or add [boost] to its next check).","setting":"space-opera","wounds":18,"defense":{"melee":2,"ranged":2},"talents":"Adversary 1 (upgrade difficulty of all combat checks against this target once), Coordinated Assault 3 (may spend a maneuver to use this talent to let all allies at medium range add [advantage] [advantage] to all combat checks they make until the end of the alien warlord\u2019s next turn).","skills":[{"name":"Coercion","rank":3},{"name":"Cool","rank":2},{"name":"Leadership","rank":2},{"name":"Perception","rank":3},{"name":"Ranged [Light]","rank":3},{"name":"Melee","rank":3},{"name":"Vigilance","rank":3}],"id":"alien-warlord","characteristics":{"brawn":3,"agility":2,"intellect":3,"cunning":2,"willpower":3,"presence":4},"strain":18,"soak":5,"text":"This is a sapient individual from some alien species. While most of this species may be peace-loving or honorable, this character has decided to conquer a significant portion of the galaxy by force. When you describe this individual, keep in mind that the profile represents a big, tough, charismatic leader. If you don\u2019t want to invent your own foot soldiers, you can use the space pirates as their warriors, and maybe the xenomorph horror as some sort of awful, awful pet!"},{"name":"Attacker","equipment":"None.","type":"rival","source":{"book":"epg","page":91},"abilities":"Momentum (If this character performed a move maneuver, they add 3 to the damage of one hit of any successful Brawl or Melee combat checks they make during the same turn).","setting":"general","wounds":14,"defense":{"melee":0,"ranged":0},"power":{"combat":3,"social":2,"general":2},"talents":"Adversary 1 (upgrade difficulty of all combat checks against this target once).","skills":[{"name":"Athletics","rank":2},{"name":"Brawl","rank":2},{"name":"Coercion","rank":2},{"name":"Coordination","rank":3},{"name":"Discipline","rank":2},{"name":"Melee","rank":2}],"id":"attacker","characteristics":{"brawn":4,"agility":2,"intellect":2,"cunning":1,"willpower":3,"presence":2},"soak":4,"text":"This highly trained combatant favors aggressive, frontal assaults, winning engagements by employing overwhelming force. An attacker might be an ax-wielding berserker, charging soldier brandishing a bayonet, or SWAT team member who is first into the breach."},{"name":"Bear","equipment":"Claws (Brawl; Damage 7; Critical 4; Range [Engaged]; Concussive 1, Knockdown), bite (Brawl; Damage 6; Critical 2; Range [Engaged]; Ensnare 1, Pierce 3).","type":"rival","source":{"book":"epg","page":86},"abilities":"Silhouette 2.","setting":"general","wounds":21,"defense":{"melee":0,"ranged":0},"power":{"combat":5,"social":1,"general":2},"talents":"Adversary 1 (upgrade difficulty of all combat checks against this target once).","skills":[{"name":"Athletics","rank":4},{"name":"Brawl","rank":3},{"name":"Coercion","rank":3},{"name":"Perception","rank":2},{"name":"Resilience","rank":2},{"name":"Survival","rank":4}],"id":"bear","characteristics":{"brawn":4,"agility":2,"intellect":1,"cunning":1,"willpower":2,"presence":1},"soak":5,"text":"Bears tend to be strong, surprisingly fast, and very tough. This profile best represents the particularly large and ferocious specimens of bear, such as the grizzly, Kodiak, and polar bears."},{"name":"Big Cat","equipment":"Claws and fangs (Brawl; Damage 6; Critical 2; Range [Engaged]; Vicious 3).","type":"rival","source":{"book":"epg","page":86},"abilities":"Ambush Predator (when attacking a target that has not yet acted during the current encounter, this creature adds [boost] [boost] to its combat checks), Pounce (once per turn, while at short range this creature may perform a move maneuver to engage a target as an incidental).","setting":"general","wounds":16,"defense":{"melee":2,"ranged":2},"power":{"combat":4,"social":2,"general":2},"talents":"Swift (this creature does not suffer penalties for moving through difficult terrain).","skills":[{"name":"Athletics","rank":3},{"name":"Brawl","rank":3},{"name":"Cool","rank":3},{"name":"Coordination","rank":2},{"name":"Perception","rank":2},{"name":"Stealth","rank":2}],"id":"big-cat","characteristics":{"brawn":3,"agility":4,"intellect":1,"cunning":3,"willpower":2,"presence":2},"soak":3,"text":"Lions, tigers, pumas, jaguars, and leopards stalk the tall grasses of expansive plains, thick forests, and other wilderness regions. Big cats hunt their prey by silently closing the distance before pouncing, pinning their victim, and going for the jugular."},{"name":"Blueblood","equipment":"Formal clothing, expensive jewelry, unlimited funds.","type":"rival","source":{"book":"epg","page":89},"abilities":"Let Me Get You Something (once per encounter, this character may give another character 100 currency to downgrade the difficulty of the next social check they make targeting that character).","setting":"general","wounds":9,"defense":{"melee":0,"ranged":0},"power":{"combat":1,"social":3,"general":2},"talents":"None.","skills":[{"name":"Charm","rank":1},{"name":"Coercion","rank":3},{"name":"Discipline","rank":1},{"name":"Knowledge","rank":4},{"name":"Leadership","rank":3},{"name":"Perception","rank":1}],"id":"blueblood","characteristics":{"brawn":1,"agility":2,"intellect":2,"cunning":3,"willpower":3,"presence":2},"soak":1,"text":"Bluebloods are a society's wealthy people of leisure. Money affords them great power to indulge in their assorted proclivities and solve many problems."},{"name":"Bull","equipment":"Horns (Brawl; Damage 5; Critical 3; Range [Engaged]; Pierce 2, Vicious 4).","type":"rival","source":{"book":"epg","page":86},"abilities":"Encumbrance Capacity 18, Silhouette 2.","setting":"general","wounds":20,"defense":{"melee":0,"ranged":0},"power":{"combat":3,"social":1,"general":1},"talents":"Bullrush (When this creature makes a Brawl combat check after using a maneuver to engage a target, may spend [advantage] [advantage] [advantage] or [triumph] to knock the target prone and move them up to one range band away from this creature).","skills":[{"name":"Athletics","rank":3},{"name":"Brawl","rank":1},{"name":"Coercion","rank":2},{"name":"Resilience","rank":3}],"id":"bull","characteristics":{"brawn":4,"agility":2,"intellect":1,"cunning":1,"willpower":1,"presence":1},"soak":4,"text":"Bulls often get used as draft animals on farms. Although usually peaceful, a provoked bull can charge and gore enemies with its horns."},{"name":"Combat Drone","equipment":"Rapid-fire flechette gun (Ranged [Light]; Damage 4; Critical 2; Range [Medium]; Auto-fire, Pierce 2, Vicious 2).","type":"rival","source":{"book":"crb","page":178},"abilities":"Flyer (can fly; see page 100), Mechanical (does not need to breathe, eat, or drink, and can survive in vacuum and underwater; immune to poisons and toxins), Telepresence (can operate independently, or can be controlled directly by an operator via wireless link; if being controlled, the combat drone counts as having ranks in a skill equal to the controller\u2019s ranks in that skill).","setting":"science-fiction","wounds":10,"defense":{"melee":0,"ranged":1},"talents":"None.","skills":[{"name":"Coordination","rank":1},{"name":"Perception","rank":2},{"name":"Ranged (Light)","rank":1},{"name":"Vigilance","rank":2}],"id":"combat-drone","characteristics":{"brawn":1,"agility":3,"intellect":1,"cunning":1,"willpower":1,"presence":1},"soak":4,"text":"Combat drones may be built in any number of shapes and designs. This one is a futuristic quad-rotor drone with weapons and with a weak AI that can let it operate somewhat auton
