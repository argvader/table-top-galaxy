ions, and marking territory). Once per round in structured encounters, your character may spend one maneuver to direct their animal in performing one action and one maneuver during your character\u2019s turn. The animal must be within hearing and visual range of your character (generally medium range) to do this. Otherwise, the animal does not contribute to the encounter. The specifics of its behavior are up to you and your GM. For every additional rank of Animal Companion your character has, increase the allowed silhouette of the companion by one (this may mean your character gets a new companion, or their companion grows in size). This talent can also change in flavor depending on the nature of your game setting. While an animal companion may make sense in many settings, in a futuristic setting it may make more sense for the \u201Canimal\u201D to be a robot or drone, for example."},{"id":"applied-research","name":"Applied Research","tier":3,"activation":"Active (Incidental)","ranked":true,"text":"Your character may use this talent before making a check to use any knowledge skill and Intellect instead of the skill and characteristic the check would normally require. Your character may use this talent a number of times per session equal to their ranks in Applied Research. When your character uses this talent, you should explain how their mastery of knowledge lets them accomplish this task. In addition, your GM may rule that a particular knowledge skill makes the most sense in a given situation, and require your character to use that specific knowledge skill.","source":{"book":"sotb","page":49}},{"id":"bad-cop","name":"Bad Cop","tier":2,"activation":"Active (Incidental)","ranked":true,"text":"Your character may spend [advantage] [advantage] from a Coercion or Deception check to use this talent to upgrade the ability of a single ally\u2019s subsequent social skill check a number of times equal to your character\u2019s ranks in Bad Cop. The check must target the same character as your character\u2019s initial check, and it must take place during the same encounter. Only one character may affect a check with this talent.","source":{"book":"sotb","page":47}},{"id":"bad-habit","name":"Bad Habit","tier":3,"activation":"Active (Maneuver)","ranked":false,"text":"Your character may use this talent to become disoriented for the remainder of the encounter. At the beginning of each of your character\u2019s turns, if they are still disoriented due to this talent, they heal 2 strain.","source":{"book":"sotb","page":49}},{"tier":3,"name":"Barrel Roll","settings":"You should use this talent in the steampunk, weird war, modern, hard science fiction, and space opera settings.","source":{"book":"crb","page":77},"ranked":false,"activation":"Active (Incidental, Out of Turn)","id":"barrel-roll","text":"Your character can only use this talent while piloting a starfighter or airplane of Silhouette 3 or less. When your vehicle suffers a hit from a ranged combat check, after damage is calculated but before armor is applied, your character may have their vehicle suffer 3 system strain to use this talent. Then, reduce the damage suffered by a number equal to their ranks in Piloting."},{"id":"big-guns","name":"Big Guns","tier":2,"activation":"Passive","ranked":false,"text":"Your character\u2019s encumbrance threshold is 10 plus their Brawn, instead of 5 plus their Brawn. Your character reduces the Cumbersome rating of any weapon they carry by 1, to a minimum of 3.","source":{"book":"sotb","page":47}},{"id":"body-guard","name":"Body Guard","tier":3,"activation":"Active (Maneuver)","ranked":true,"text":"Once per round, your character may suffer a number of strain no greater than their ranks in Body Guard to use this talent. Choose one ally engaged with your character, until the end of your character's next turn, upgrade the difficulty of all combat checks targeting that ally a number of times equal to the strain suffered.","source":{"book":"sotb","page":49}},{"tier":1,"name":"Bought Info","settings":"You should use this talent in all settings.","source":{"book":"crb","page":72},"ranked":false,"activation":"Active (Action)","id":"bought-info","text":"When making any knowledge skill check, your character can instead use this talent to spend an amount of currency equal to fifty times the difficulty of the check and automatically succeed on the knowledge check with one uncanceled [success] (instead of rolling). At your GM\u2019s discretion, your character may not be able to use Bought Info if the information is particularly sensitive or difficult to find, or buying it doesn\u2019t make narrative sense."},{"id":"burn-through","name":"Burn Through","tier":4,"activation":"Active (Incidental)","ranked":false,"text":"After making a successful break ice action, your character may suffer 3 strain to use this talent. If they do, they may perform a second override ice action on the same system as an incidental.","source":{"book":"sotb","page":51}},{"tier":4,"name":"Can\u2019t We Talk About This?","settings":"You should use this talent in all settings.","source":{"book":"crb","page":79},"ranked":false,"activation":"Active (Action)","id":"cant-we-talk-about-this","text":"Your character can use this talent to make an opposed Charm or Deception versus Discipline check targeting a single non-nemesis adversary within medium range. If the check succeeds, the target cannot attack your character (or perform hostile actions against your character) until the end of their next turn. You may spend [advantage] [advantage] to increase the length of the effect by one additional turn, and spend [triumph] to extend the benefits to all of their identified allies within short range. The effect ends immediately if your character or a known ally attacks the target. In addition, your GM may rule that some targets are immune to this ability. An automated sentry turret, for example, has no interest in resolving a conflict through talking, nor would someone consumed by rage and the desire for revenge against your character."},{"tier":1,"name":"Clever Retort","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":false,"activation":"Active (Incidental, Out of Turn)","id":"clever-retort","text":"Once per encounter, your character may use this talent to add automatic [threat] [threat] to another character\u2019s social skill check."},{"id":"codeslinger","name":"Codeslinger","tier":2,"activation":"Passive","ranked":false,"text":"When your character performs the activate program maneuver (page 132) in a hacking encounter, they can choose not to deactivate one other active icebreaker. They may have two icebreakers active at once.","source":{"book":"sotb","page":48}},{"id":"combat-medicine","name":"Combat Medicine","tier":2,"activation":"Active (Incidental)","ranked":true,"text":"Before making a Medicine check, your character may use this talent to add [success] equal to their ranks in Combat Medicine to the results. After the check is resolved, the target suffers 2 strain for each rank your character has in Combat Medicine.","source":{"book":"sotb","page":48}},{"tier":2,"name":"Coordinated Assault","settings":"You should use this talent in all settings.","source":{"book":"crb","page":75},"ranked":true,"activation":"Active (Maneuver)","id":"coordinated-assault","text":"Once per turn, your character may use this talent to have a number of allies engaged with your character equal to your ranks in Leadership add [advantage] to all combat checks they make until the end of your character\u2019s next turn. The range of this talent increases by one band per rank of Coordinated Assault beyond the first."},{"id":"corporate-drone","name":"Corporate Drone","tier":1,"activation":"Passive","ranked":false,"text":"When you take this talent, your character gains Knowledge (Society) or Negotiation as a career skill. In addition, once per session, your character may collect a small favor from any other member of a single corporation (chosen when you take this talent), even if they do not owe your character a favor.","source":{"book":"sotb","page":44}},{"tier":2,"name":"Counteroffer","settings":"You should use this talent in all settings.","source":{"book":"crb","page":75},"ranked":false,"activation":"Active (Action)","id":"counteroffer","text":"Once per session, your character may use this talent to choose one non-nemesis adversary within medium range and make an opposed Negotiation versus Discipline check. If successful, the target becomes staggered until the end of their next turn. At your GM\u2019s discretion, you may spend [triumph] on this check to have the adversary become an ally until the end of the encounter. However, the duration of this may be shortened or extended depending on whether your GM feels your offer is appealing to the adversary and whether your character follows through on their offer!"},{"id":"custom-code","name":"Custom Code","tier":1,"activation":"Passive","ranked":false,"text":"When your character selects this talent they choose one icebreaker or piece of ice that they own. If they choose an icebreaker, whenever they use that icebreaker to override ice, they add [advantage] to the results. If they choose a piece of ice, whenever someone else attempts to override it, they add [threat] to the results.","source":{"book":"sotb","page":44}},{"id":"custom-rig","name":"Custom Rig","tier":1,"activation":"Passive","ranked":true,"text":"When your character selects this talent they choose one computer (such as a rig, PAD, or spinal modem) that they own. The amount of ice or icebreakers (your character's choice) that they can have on that computer is increased by 1 per rank of Custom Rig. (This may be a mix of ice and icebreakers, as long as the combined total increase does not exceed your character's ranks in Custom Rig). If your character loses their affected computer, they may choose a new computer to be affected by this talent.","source":{"book":"sotb","page":44}},{"id":"customer-service-experience","name":"Customer Service Experience","tier":1,"activation":"Active (Incidental)","ranked":true,"text":"After your character makes a Charm check, they may suffer 1 strain use this talent to cancel [threat] equal to your character\u2019s ranks in Customer Service Experience.","source":{"book":"sotb","page":45}},{"tier":2,"name":"Daring Aviator","settings":"You should use this talent in the steampunk, weird war, modern day, science fiction, and space opera settings.","source":{"book":"crb","page":75},"ranked":true,"activation":"Active (Incidental)","id":"daring-aviator","text":"Before your character makes a Driving or Piloting check, they may add a number of [threat] to the results to use this talent to add an equal number of [success]. The number may not exceed your character\u2019s ranks in Daring Aviator."},{"tier":4,"name":"Deadeye","settings":"You should use this talent in all settings.","source":{"book":"crb","page":79},"ranked":false,"activation":"Active (Incidental)","id":"deadeye","text":"After your character inflicts a Critical Injury with a ranged weapon and rolls the result, your character may suffer 2 strain to use this talent. Then, you may select any Critical Injury of the same severity to apply to the target instead."},{"tier":5,"name":"Dedication","settings":"You should use this talent in all settings.","source":{"book":"crb","page":81},"ranked":true,"activation":"Passive","id":"dedication","text":"Each rank of Dedication increases one of your character\u2019s characteristics by one. This talent cannot increase a characteristic above 5. You cannot increase the same characteristic with Dedication twice."},{"id":"deep-pockets","name":"Deep Pockets","tier":1,"activation":"Active (Maneuver)","ranked":false,"text":"Once per session, your character may use this talent to produce a small but narratively useful item from their pockets, backpack, or similar receptacle (it turns out the item had been there the whole time). Your GM has final say as to what items can be produced with Deep Pockets, but generally the item should cost less than 100 credits and have an encumbrance of 0 or 1.","source":{"book":"sotb","page":45}},{"tier":4,"name":"Defensive","settings":"You should use this talent in all settings.","source":{"book":"crb","page":80},"ranked":true,"activation":"Passive","id":"defensive","text":"Each rank of Defensive increases your character\u2019s melee defense and ranged defense by one."},{"tier":4,"name":"Defensive Driving","settings":"You should use this talent in the steampunk, weird war, modern day, science fiction, and space opera settings.","source":{"book":"crb","page":80},"ranked":true,"activation":"Passive","id":"defensive-driving","text":"Increase the defense of any vehicle your character pilots by one per rank of Defensive Driving. The specifics of this talent require the optional vehicle rules, on page 220. If your game does not use these rules, this talent adds [setback] per rank to combat checks targeting your character\u2019s vehicle or your character while piloting it."},{"tier":2,"name":"Defensive Stance","settings":"You should use this talent in all settings.","source":{"book":"crb","page":75},"ranked":true,"activation":"Active (Maneuver)","id":"defensive-stance","text":"Once per round, your character may suffer a number of strain no greater than their ranks in Defensive Stance to use this talent. Then, until the end of your character\u2019s next turn, upgrade the difficulty of all melee combat checks targeting your character a number of times equal to the strain suffered."},{"tier":1,"name":"Defensive Sysops","settings":"You should use this talent in the modern day, science fiction, and space opera settings.","source":{"book":"crb","page":73},"ranked":false,"activation":"Passive","id":"defensive-sysops","text":"When attempting to defend a computer system against intrusion (or when someone attempts to hack a computer owned or programmed by your character) your character adds [setback] [setback] to their opponent\u2019s checks. If your character has access to the computer system when the intrusion takes place, they are automatically aware of the intrusion."},{"tier":2,"name":"Defensive Sysops (Improved)","settings":"You should use this talent in the modern day, science fiction, and space opera settings.","source":{"book":"crb","page":76},"ranked":false,"activation":"Active (Incidental)","id":"defensive-sysops-improved","text":"Your character must have purchased the Defensive Sysops talent to benefit from this talent. Before adding [setback] [setback] from Defensive Sysops to a check, use this talent to add [failure] [threat] to the results of the check instead."},{"tier":1,"name":"Desperate Recovery","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":false,"activation":"Passive","id":"desperate-recovery","text":"Before your character heals strain at the end of an encounter, if their strain is more than half of their strain threshold, they heal two additional strain."},{"id":"determined-driver","name":"Determined Driver","tier":2,"activation":"Active (Incidental)","ranked":false,"text":"You may spend a Story Point to use this talent to have your character heal system strain on a vehicle they are currently driving, piloting, or operating equal to their ranks in Driving, Piloting, or Operating (choose the skill used to direct the vehicle).","source":{"book":"sotb","page":48}},{"id":"disenfrancisto","name":"Disenfrancisto","tier":1,"activation":"Passive","ranked":false,"text":"When you take this talent, your character gains Streetwise or Survival (your choice) as a career skill. In addition, once per session, your character may collect a small favor from any other disenfrancisto, even if they do not owe your character a favor.","source":{"book":"sotb","page":45}},{"tier":3,"name":"Distinctive Style","settings":"You should use this talent in the modern day, science fiction, and space opera settings.","source":{"book":"crb","page":78},"ranked":false,"activation":"Active (Incidental)","id":"distinctive-style","text":"When making a Computers check to hack a system or break into a secured network, before rolling, your character may use this talent to add [success] [success] [threat] [threat] to the results. If you are using the optional hacking rules on page 232 and your check generates [threat] [threat], your GM should spend it on the I Know You! option in Table I.2-22 on page 234."},{"tier":3,"name":"Dodge","settings":"You should use this talent in all settings.","source":{"book":"crb","page":78},"ranked":true,"activation":"Active (Incidental, Out of Turn)","id":"dodge","text":"When your character is targeted by a combat check (ranged or melee), they may suffer a number of strain no greater than their ranks in Dodge to use this talent. Then, upgrade the difficulty of the combat check targeting your character a number of times equal to the strain suffered."},{"id":"drone-master","name":"Drone Master","tier":5,"activation":"Passive","ranked":false,"text":"Your character may control two drones or minion groups of drones no larger than your character's Willpower (either via the rules found on page 233 or via the Animal Companion talent, found on page 77 of the Genesys Core Rulebook). Your character resolves each drone\u2019s (or minion group's) turn individually, choosing the order in which they activate.","source":{"book":"sotb","page":52}},{"tier":2,"name":"Dual Wielder","settings":"You should use this talent in all settings.","source":{"book":"crb","page":76},"ranked":false,"activation":"Active (Maneuver)","id":"dual-wielder","text":"Your character may use this talent to decrease the difficulty of the next combined combat check (see TwoWeapon Combat, on page 108) they make during the same turn by one."},{"tier":1,"name":"Duelist","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":false,"activation":"Passive","id":"duelist","text":"Your character adds [boost] to their melee combat checks while engaged with a single opponent. Your character adds [setback] to their melee combat checks while engaged with three or more opponents."},{"id":"dumb-luck","name":"Dumb Luck","tier":3,"activation":"Active (Incidental)","ranked":false,"text":"Once per session, you may spend a Story Point to use this talent after your character suffers a Critical Injury but before the result is rolled. Their opponent must roll two results, and you select which applies to your character.","source":{"book":"sotb","page":49}},{"tier":1,"name":"Durable","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":true,"activation":"Passive","id":"durable","text":"Your character reduces any Critical Injury result they suffer by 10 per rank of Durable, to a minimum of 01."},{"tier":3,"name":"Eagle Eyes","settings":"You should use this talent in all settings.","source":{"book":"crb","page":78},"ranked":false,"activation":"Active (Incidental)","id":"eagle-eyes","text":"Once per encounter before making a ranged combat check, you may use this talent to increase your weapon\u2019s range by one range band (to a maximum of extreme range). This lasts for the duration of the combat check."},{"id":"elementary","name":"Elementary","tier":4,"activation":"Active (Action)","ranked":false,"text":"Once per session, your character may use this talent to make a Hard ([difficulty] [difficulty] [difficulty]) Perception check while present at a crime scene. If they succeed, they identify all prominent physical characteristics of one person who was at the crime scene when the crime was committed (as long as the crime was committed in the past 48 hours). This could include a person's height, weight, body type, clothing, and if they are human or not. Your character may identify all the physical characteristics of one additional person present at the crime scene per additional [success].","source":{"book":"sotb","page":51}},{"tier":4,"name":"Enduring","settings":"You should use this talent in all settings.","source":{"book":"crb","page":80},"ranked":true,"activation":"Passive","id":"enduring","text":"Each rank of Enduring increases your character\u2019s soak value by one."},{"tier":3,"name":"Field Commander","settings":"You should use this talent in all settings.","source":{"book":"crb","page":78},"ranked":false,"activation":"Active (Action)","id":"field-commander","text":"Your character may use this talent to make an Average ([difficulty] [difficulty]) Leadership check. If successful, a number of allies equal to your character\u2019s Presence may immediately suffer 1 strain to perform one maneuver (out of turn). If there are any questions as to which allies take their maneuvers first, your character is the final arbiter."},{"tier":4,"name":"Field Commander (Improved)","settings":"You should use this talent in all settings.","source":{"book":"crb","page":80},"ranked":false,"activation":"Passive","id":"field-commander-improved","text":"Your character must have purchased the Field Commander talent to benefit from this talent. When your character uses the Field Commander talent, your character affects a number of allies equal to twice the character\u2019s Presence. In addition, you may spend [triumph] to allow one ally to suffer 1 strain to perform an action, instead of a maneuver."},{"tier":1,"name":"Forager","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":false,"activation":"Passive","id":"forager","text":"Your character removes up to [setback] [setback] from any skill checks they make to find food, water, or shelter. Checks to forage or search the area that your character makes take half the time they would normally."},{"tier":3,"name":"Forgot to Count?","settings":"You should use this talent in the steampunk, weird war, modern day, science fiction, and space opera settings.","source":{"book":"crb","page":78},"ranked":false,"activation":"Active (Incidental, Out of Turn)","id":"forgot-to-count","text":"When an opponent makes a ranged combat check, you can spend [threat] [threat] from that check to use this talent to cause their weapon to run out of ammo (see page 104), as long as the weapon can normally run out of ammunition."},{"id":"former-professor","name":"Former Professor","tier":1,"activation":"Passive","ranked":false,"text":"When you take this talent, your character gains one Knowledge skill (of your choice) as a career skill. In addition, once per session, your character may collect a small favor from a member of an institute of higher learning, even if they do not owe your character a favor.","source":{"book":"sotb","page":45}},{"tier":3,"name":"Full Throttle","settings":"You should use this talent in the steampunk, weird war, modern day, science fiction, and space opera settings.","source":{"book":"crb","page":78},"ranked":false,"activation":"Active (Action)","id":"full-throttle","text":"While driving or flying, your character may use this talent to make a Hard ([difficulty] [difficulty] [difficulty]) Piloting or Driving check. If successful, the top speed of the vehicle increases by one (to a maximum of 5) for a number of rounds equal to your character\u2019s Cunning. The specifics of this talent require the optional vehicle rules, on page 220. If your game does not use these rules, this talent simply makes the vehicle go much faster than normal, with the specifics up to your GM."},{"id":"ghost-in-the-machine","name":"Ghost in the Machine","tier":5,"activation":"Active (Action)","ranked":false,"text":"As long as they have some sort of access point to the Network, your character may use this talent to make a Hard ([difficulty] [difficulty] [difficulty]) Computers (Hacking) check. If they succeed, they may select one drone, vehicle, or piece of equipment involved in the current encounter and dictate its actions until the start of your character\u2019s next turn. Alternatively, your character can select someone with cybernetic implants or who is wearing powered armor or an exosuit and manipulate it until the beginning of your character\u2019s next turn. This must be approved by your GM but could include shutting off cybereyes, directing the movements of cyberlimbs, or causing an exosuit to eject its occupant. Your character may spend [advantage] [advantage] [advantage] on the check to extend the effects for one additional round, or they may spend [triumph] to extend the effects for the remainder of the encounter.","source":{"book":"sotb","page":52}},{"id":"good-cop","name":"Good Cop","tier":2,"activation":"Active (Incidental)","ranked":true,"text":"Your character may spend [advantage] [advantage] from a Charm or Negotiation check to use this talent to upgrade the ability of a single ally\u2019s subsequent social skill check a number of times equal to your character\u2019s ranks in Good Cop. The check must target the same character as your character\u2019s initial check, and it must take place during the same encounter. Only one character may affect a check with this talent.","source":{"book":"sotb","page":48}},{"tier":3,"name":"Grenadier","settings":"You should use this talent in the steampunk, weird war, modern day, science fiction, and space opera settings.","source":{"book":"crb","page":78},"ranked":true,"activation":"Active (Incidental)","id":"grenadier","text":"When your character makes a ranged combat check with a weapon that has the Blast item quality, you may spend one Story Point to use this talent to trigger the weapon\u2019s Blast quality, instead of spending [advantage] (even if the attack misses). In addition, your character treats grenades as having a range of medium."},{"tier":1,"name":"Grit","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":true,"activation":"Passive","id":"grit","text":"Each rank of Grit increases your character\u2019s strain threshold by one."},{"tier":1,"name":"Hamstring Shot","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":false,"activation":"Active (Action)","id":"hamstring-shot","text":"Once per round, your character may use this talent to perform a ranged combat check against one non-vehicle target within range of the weapon used. If the check is successful, halve the damage inflicted by the attack (before reducing damage by the target\u2019s soak). The target is immobilized until the end of its next turn."},{"id":"hand-on-the-throttle","name":"Hand on the Throttle","tier":1,"activation":"Active (Incidental)","ranked":false,"text":"Once per round while driving or piloting a vehicle, your character may use this talent to increase or decrease its speed by 1, to a minimum of 0 or a maximum of the vehicle\u2019s max speed.","source":{"book":"sotb","page":45}},{"id":"hard-boiled","name":"Hard-Boiled","tier":3,"activation":"Active (Incidental)","ranked":false,"text":"When your character makes a check to recover from strain at the end of an encounter (as described on page 117 of the Genesys Core Rulebook), your character may make a Simple (\u2013) Resilience check instead of Discipline or Cool. If your character does so, they heal 1 strain per [success] and 1 wound per [advantage].","source":{"book":"sotb","page":50}},{"id":"haughty-demeanor","name":"Haughty Demeanor","tier":2,"activation":"Passive","ranked":false,"text":"Other characters add [threat] to social skill checks targeting your character.","source":{"book":"sotb","page":48}},{"tier":2,"name":"Heightened Awareness","settings":"You should use this talent in all settings.","source":{"book":"crb","page":76},"ranked":false,"activation":"Passive","id":"heightened-awareness","text":"Allies within short range of your character add [boost] to their Perception and Vigilance checks. Allies engaged with your character add [boost] [boost] instead."},{"tier":3,"name":"Heroic Will","settings":"You should use this talent in all settings.","source":{"book":"crb","page":79},"ranked":false,"activation":"Active (Incidental, Out of Turn)","id":"heroic-will","text":"When you purchase this talent for your character, choose two characteristics. You may spend a Story Point to use this talent to have your character ignore the effects of all Critical Injuries on any skill checks using those two characteristics until the end of the current encounter. (Your character still suffers the Critical Injuries; they just ignore the effects. See page 114.)"},{"id":"hold-it-steady","name":"Hold It Steady","tier":3,"activation":"Active (Incidental)","ranked":false,"text":"Before performing a combat check using a weapon with the Auto-fire quality, your character may use this talent to use the Auto-fire quality without increasing the difficulty of the combat check. If they do so, each time they trigger an additional hit during the attack, they suffer 2 strain.","source":{"book":"sotb","page":50}},{"tier":4,"name":"How Convenient!","settings":"You should use this talent in all settings.","source":{"book":"crb","page":80},"ranked":false,"activation":"Active (Action)","id":"how-convenient","text":"Once per session, your character may use this talent to make a Hard ([difficulty] [difficulty] [difficulty]) Mechanics check. If successful, one device involved in the current encounter (subject to your GM\u2019s approval) spontaneously fails. This can be because of your character\u2019s actions, or it can simply be incredibly convenient timing!"},{"id":"iaijutsu-training","name":"Iaijutsu Training","tier":1,"activation":"Passive","ranked":false,"text":"The first time during an encounter that your character draws a Melee weapon, increase the weapon's damage by 2 for the remainder of the turn.","source":{"book":"sotb","page":45}},{"tier":5,"name":"Indomitable","settings":"You should use this talent in all settings.","source":{"book":"crb","page":81},"ranked":false,"activation":"Active (Incidental, Out of Turn)","id":"indomitable","text":"Once per encounter, when your character would be incapacitated due to exceeding their wound or strain threshold, you may spend a Story Point to use this talent. Then, your character is not incapacitated until the end of their next turn. If your character reduces their strain or wounds to below their threshold before the end of their next turn, they are not incapacitated."},{"tier":2,"name":"Inspiring Rhetoric","settings":"You should use this talent in all settings.","source":{"book":"crb","page":76},"ranked":false,"activation":"Active (Action)","id":"inspiring-rhetoric","text":"Your character may use this talent to make an Average ([difficulty] [difficulty]) Leadership check. For each [success] the check generates, one ally within short range heals one strain. For each [advantage], one ally benefiting from Inspiring Rhetoric heals one additional strain."},{"tier":3,"name":"Inspiring Rhetoric (Improved)","settings":"You should use this talent in all settings.","source":{"book":"crb","page":78},"ranked":false,"activation":"Passive","id":"inspiring-rhetoric-improved","text":"Your character must have purchased the Inspiring Rhetoric talent to benefit from this talent. Allies affected by your character\u2019s Inspiring Rhetoric add [boost] to all skill checks they make for a number of rounds equal to your character\u2019s ranks in Leadership."},{"tier":4,"name":"Inspiring Rhetoric (Supreme)","settings":"You should use this talent in all settings.","source":{"book":"crb","page":80},"ranked":false,"activation":"Active (Incidental)","id":"inspiring-rhetoric-supreme","text":"Your character must have purchased the Inspiring Rhetoric talent to benefit from this talent. Your character may choose to suffer 1 strain to use the Inspiring Rhetoric talent as a maneuver, instead of as an action."},{"tier":2,"name":"Inventor","settings":"You should use this talent in all settings.","source":{"book":"crb","page":76},"ranked":true,"activation":"Active (Incidental)","id":"inventor","text":"When your character makes a check to construct new items or modify existing ones, use this talent to add a number of [boost] to the check equal to ranks of Inventor. In addition, your character may attempt to reconstruct devices that they have heard described but have not seen and do not have any kinds of plans or schematics for."},{"tier":1,"name":"Jump Up","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":false,"activation":"Active (Incidental)","id":"jump-up","text":"Once per round during your character\u2019s turn, your character may use this talent to stand from a prone or seated position as an incidental."},{"tier":1,"name":"Knack for It","settings":"You should use this talent in all settings.","source":{"book":"crb","page":73},"ranked":true,"activation":"Passive","id":"knack-for-it","text":"When you purchase this talent for your character, select one skill. Your character removes [setback] [setback] from any checks they make using this skill. Each additional time you purchase this talent for your character, select two additional skills. Your character also removes [setback] [setback] from any checks they make using these skills. You cannot select combat or magic skills when choosing skills for this talent."},{"id":"knockout-punch","name":"Knockout Punch","tier":1,"activation":"Passive","ranked":false,"text":"Your character adds the Stun quality to their Brawl combat checks, with a rating equal to two plus your character\u2019s ranks in Coordination (this does not stack with other instances of the Stun quality).","source":{"book":"sotb","page":45}},{"tier":1,"name":"Know Somebody","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":true,"activation":"Active (Incidental)","id":"know-somebody","text":"Once per session, when attempting to purchase a legally available item, your character may use this talent to reduce its rarity by one per rank of Know Somebody."},{"id":"laugh-it-off","name":"Laugh It Off","tier":3,"activation":"Active (Incidental, Out of Turn)","ranked":false,"text":"When your character is targeted by a social skill check they may use this talent to spend [threat] [threat] [threat] or [despair] to reduce any strain the check inflicts by a number equal to their ranks in Charm. If they do so, the character who targeted them suffers an amount of strain equal to the amount of strain reduced.","source":{"book":"sotb","page":50}},{"tier":1,"name":"Let\u2019s Ride","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":false,"activation":"Active (Incidental)","id":"lets-ride","text":"Once per round during your character's turn, your character can use this talent to mount or dismount from a vehicle or animal, or move from one position in a vehicle to another (such as from the cockpit to a gun turret) as an incidental. In addition, if your character suffers a short-range fall (see page 112) from a vehicle or animal, they suffer no damage and land on their feet."},{"tier":2,"name":"Lucky Strike","settings":"You should use this talent in all settings.","source":{"book":"crb","page":76},"ranked":false,"activation":"Active (Incidental)","id":"lucky-strike","text":"When your character purchases this talent, choose one characteristic. After your character makes a successful combat check, you may spend one Story Point to use this talent to add damage equal to your character\u2019s ranks in that characteristic to one hit of the combat check."},{"id":"martial-weapons-master","name":"Martial Weapons Master","tier":3,"activation":"Active (Action)","ranked":false,"text":"While armed with a Melee weapon, your character may use this talent to make an Average ([difficulty] [difficulty]) Melee check. If successful, your character may force one engaged target to either drop one weapon they are holding or move up to one range band in a direction of your choosing. If your character forces a named rival or nemesis into dangerous terrain (or off a ledge or cliff) using this talent, your GM can spend a Story Point to allow them to catch themselves at the edge and fall prone instead.","source":{"book":"sotb","page":50}},{"tier":5,"name":"Master","settings":"You should use this talent in all settings.","source":{"book":"crb","page":81},"ranked":false,"activation":"Active (Incidental)","id":"master","text":"When you purchase this talent for your character, choose one skill. Once per round, your character may suffer 2 strain to use this talent to reduce the difficulty of the next check they make using that skill by two, to a minimum of Easy ([difficulty])."},{"id":"master-plan","name":"Master Plan","tier":5,"activation":"Active (Action)","ranked":false,"text":"Once per session, your character may use this talent to make a Hard ([difficulty] [difficulty] [difficulty]) Discipline check. If they succeed, they reveal that whatever terrible circumstances they currently find themselves in are all part of a brilliant plan that they established at an earlier point. They then choose one non-nemesis adversary in the encounter and reveal them to be a close friend or ally who has positioned themselves to help your character at this exact moment. The details of which character turns out to be an ally depend on the type of encounter and your GM\u2019s approval. However, the ally could also have done their work beforehand, such as loading a squadron of drones with blank ammunition, shutting down power to a security system, or planting a tracer in an opponent\u2019s vehicle.","source":{"book":"sotb","page":52}},{"tier":3,"name":"Natural","settings":"You should use this talent in all settings.","source":{"book":"crb","page":79},"ranked":false,"activation":"Active (Incidental)","id":"natural","text":"When your character purchases this talent, choose two skills. Once per session, your character may use this talent to reroll one skill check that uses one of those two skills."},{"id":"net-search","name":"Net Search","tier":1,"activation":"Active (Maneuver)","ranked":false,"text":"If your character has access to the Network, they may use this talent to upgrade the ability of the next Knowledge check they make during their turn twice and the difficulty of that check once. Your GM must spend a [despair] to have your character learn some seemingly relevant and believable information that turns out to be completely (and possibly maliciously) false.","source":{"book":"sotb","page":45}},{"id":"net-warrior","name":"Net Warrior","tier":3,"activation":"Active (Action)","ranked":false,"text":"While accessing a system using a brain-machine interface (BMI), your character may use this talent to make an opposed Computers (Hacking) versus Computers (Sysops) check targeting one other character on the system that they are aware of. The target suffers 1 strain per [success], and if they are using a BMI, they also suffer 1 wound per [success].","source":{"book":"sotb","page":50}},{"id":"nethunter","name":"Nethunter","tier":2,"activation":"Passive","ranked":false,"text":"When your character successfully traces another character during a Network encounter, your character gains one additional trace.","source":{"book":"sotb","page":48}},{"id":"nimble","name":"Nimble","tier":3,"activation":"Active (Incidental)","ranked":false,"text":"At the start of your character\u2019s turn, you may spend one Story Point to use this talent to allow your character to perform a move maneuver as an incidental. (This does not count against the limit of two maneuvers per turn.) If you use this talent, your character can only perform one additional move maneuver during this turn.","source":{"book":"sotb","page":50}},{"id":"offensive-driving","name":"Offensive Driving","tier":4,"activation":"Active (Action)","ranked":false,"text":"While driving or piloting a vehicle, your character may use this talent to select one other vehicle within medium range and make an opposed Driving or Piloting versus Driving or Piloting check (depending on whether your character and their opponent pilot are using Driving or Piloting to control their vehicle) targeting the other vehicle\u2019s driver or pilot. If successful, roll twice on Table III.2\u201319: Critical Hit Result, on page 230 of the Genesys Core Rulebook. Choose one Critical Hit result to apply to your character\u2019s vehicle, and the other to apply to the other vehicle. You may spend [triumph] to add +20 to one Critical Hit result. Your GM may spend [despair] to add +20 to both Critical Hit results.","source":{"book":"sotb","page":51}},{"tier":1,"name":"One with Nature","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":false,"activation":"Active (Incidental)","id":"one-with-nature","text":"When in the wilderness, your character may make a Simple (\u2013) Survival check, instead of Discipline or Cool, to recover strain at the end of an encounter (see page 117)."},{"id":"overcharge","name":"Overcharge","tier":4,"activation":"Active (Action)","ranked":false,"text":"Once per encounter, your character may use this talent to make a Hard ([difficulty] [difficulty] [difficulty]) Mechanics check and choose one of their cybernetic implants that grants them one of the following: +1 to a characteristic rating, +1 rank to a skill, +1 rank of a ranked talent. If your character succeeds, until the end of the encounter, the","source":{"book":"crb","page":80}},{"tier":5,"name":"Overcharge (Improved)","settings":"You should use this talent in the science fiction and space opera settings.","source":{"book":"crb","page":81},"ranked":false,"activation":"Passive","id":"overcharge-improved","text":"Your character must have purchased the Overcharge talent to benefit from this talent. When using the Overcharge talent, your character may spend [advantage] [advantage] or [triumph] from the Mechanics check to immediately take one additional action. This talent can only be used once per check."},{"tier":3,"name":"Painkiller Specialization","settings":"You should use this talent in all settings.","source":{"book":"crb","page":79},"ranked":true,"activation":"Passive","id":"painkiller-specialization","text":"When your character uses painkillers (or their equivalent, depending on the setting), the target heals one additional wound per rank of Painkiller Specialization. The sixth painkiller and beyond each day still has no effect."},{"id":"parkour","name":"Parkour!","tier":2,"activation":"Active (Maneuver)","ranked":false,"text":"Once per round, your character may suffer 1 strain to use this talent and move to any location within short range. This includes locations that are vertically distant or have no easy access route, but there must be an object to move across or path to move along. Your GM may rule some locations cannot be reached (such as ones behind locked doors or walls).","source":{"book":"sotb","page":49}},{"id":"parkour-improved","name":"Parkour! (Improved)","tier":4,"activation":"Active (Incidental)","ranked":false,"text":"Your character must have purchased the Parkour! talent to benefit from this talent. Once per round, when using the Parkour! talent, your character may suffer 4 strain instead of 1 strain to move to any location within medium range instead of within short range. All other restrictions of Parkour! apply to this movement.","source":{"book":"sotb","page":51}},{"tier":1,"name":"Parry","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":true,"activation":"Active (Incidental, Out of Turn)","id":"parry","text":"When your character suffers a hit from a melee combat check, after damage is calculated but before soak is applied (so immediately after Step 3 of Perform a Combat check, page 102), your character may suffer 3 strain to use this talent to reduce the damage of the hit by two plus their ranks in Parry. This talent can only be used once per hit, and your character needs to be wielding a Melee weapon."},{"tier":3,"name":"Parry (Improved)","settings":"You should use this talent in all settings.","source":{"book":"crb","page":79},"ranked":false,"activation":"Active (Incidental, Out of Turn)","id":"parry-improved","text":"Your character must have purchased the Parry talent to benefit from this talent. When your character suffers a hit from a melee combat check and uses Parry to reduce the damage from that hit, after the attack is resolved, you may spend [despair] or [threat] [threat] [threat] from the attacker\u2019s check to use this talent. Then, your character automatically hits the attacker once with a Brawl or Melee weapon your character is wielding. The hit deals the weapon\u2019s base damage, plus any damage from applicable talents or abilities. Your character can\u2019t use this talent if the original attack incapacitates them."},{"id":"probing-question","name":"Probing Question","tier":2,"activation":"Passive","ranked":false,"text":"If your character knows an opponent\u2019s Flaw or Fear motivation, when your character inflicts strain on that opponent using a social skill, the opponent suffers 3 additional strain.","source":{"book":"sotb","page":49}},{"tier":1,"name":"Proper Upbringing","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":true,"activation":"Active (Incidental)","id":"proper-upbringing","text":"When your character makes a social skill check in polite company (as determined by your GM), they may suffer a number of strain to use this talent to add an equal number of [advantage] to the check. The number may not exceed your character\u2019s ranks in Proper Upbringing."},{"tier":1,"name":"Quick Draw","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":false,"activation":"Active (Incidental)","id":"quick-draw","text":"Once per round on your character\u2019s turn, they may use this talent to draw or holster an easily accessible weapon or item as an incidental. Quick Draw also reduces a weapon\u2019s Prepare rating by one, to a minimum of one."},{"id":"quick-fix","name":"Quick Fix","tier":2,"activation":"Active (Maneuver)","ranked":false,"text":"You may spend a Story Point to use this talent to have your character temporarily repair one damaged item they are engaged with. For a number of rounds equal to your character's ranks in Mechanics, the item may be used without penalty (see page 89 of the Genesys Core Rulebook), even if it is unusable. When the effect ends, the item is damaged one additional step; if it was already suffering from major damage, it is destroyed and cannot be repaired.","source":{"book":"sotb","page":49}},{"tier":1,"name":"Quick Strike","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":true,"activation":"Passive","id":"quick-strike","text":"Your character adds [boost] for each rank of Quick Strike to any combat checks they make against any targets that have not yet taken their turn in the current encounter."},{"id":"quick-witted","name":"Quick-Witted","tier":4,"activation":"Active (Incidental, Out of Turn)","ranked":false,"text":"Once per encounter, after another character makes a social skill check, your character may use this talent to make an Average ([difficulty] [difficulty]) Vigilance check. If successful, you may add a number of [success] or [advantage] (your choice) equal to your character\u2019s ranks in Charm to the other character\u2019s check. If your character fails, your character suffers 3 strain.","source":{"book":"sotb","page":51}},{"tier":1,"name":"Rapid Reaction","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":true,"activation":"Active (Incidental, Out of Turn)","id":"rapid-reaction","text":"Your character may suffer a number of strain to use this talent to add an equal number of [success] to a Vigilance or Cool check they make to determine Initiative order. The number may not exceed your character\u2019s ranks in Rapid Reaction."},{"id":"resourceful-mechanic","name":"Resourceful Mechanic","tier":1,"activation":"Passive","ranked":true,"text":"When your character makes a Mechanics check to repair system strain or hull trauma on a vehicle, they repair one additional system strain or hull trauma per rank of Resourceful Mechanic.","source":{"book":"sotb","page":45}},{"tier":5,"name":"Ruinous Repartee","settings":"You should use this talent in all settings.","source":{"book":"crb","page":81},"ranked":false,"activation":"Active (Action)","id":"ruinous-repartee","text":"Once per encounter, your character may use this talent to make an opposed Charm or Coercion versus Discipline check targeting one character within medium range (or within earshot). If successful, the target suffers strain equal to twice your character\u2019s Presence, plus one additional strain per [success]. Your character heals strain equal to the strain inflicted. If incapacitated due to this talent, the target could flee the scene in shame, collapse in a dejected heap, or throw themself at your character in fury, depending on your GM and the nature of your character\u2019s witty barbs."},{"tier":2,"name":"Scathing Tirade","settings":"You should use this talent in all settings.","source":{"book":"crb","page":77},"ranked":false,"activation":"Active (Action)","id":"scathing-tirade","text":"Your character may use this talent to make an Average ([difficulty] [difficulty]) Coercion check. For each [success] the check generates, one enemy within short range suffers 1 strain. For each [advantage], one enemy affected by Scathing Tirade suffers 1 additional strain."},{"tier":3,"name":"Scathing Tirade (Improved)","settings":"You should use this talent in all settings.","source":{"book":"crb","page":79},"ranked":false,"activation":"Passive","id":"scathing-tirade-improved","text":"Your character must have purchased the Scathing Tirade talent to benefit from this talent. Enemies affected by your character\u2019s Scathing Tirade add [setback] to all skill checks they make for a number of rounds equal to your character\u2019s ranks in Coercion."},{"tier":4,"name":"Scathing Tirade (Supreme)","settings":"You should use this talent in all settings.","source":{"book":"crb","page":81},"ranked":false,"activation":"Active (Incidental)","id":"scathing-tirade-supreme","text":"Your character must have purchased the Scathing Tirade talent to benefit from this talent. Your character may choose to suffer 1 strain to use the Scathing Tirade talent as a maneuver, instead of as an action."},{"tier":1,"name":"Second Wind","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":true,"activation":"Active (Incidental)","id":"second-wind","text":"Once per encounter, your character may use this talent to heal an amount of strain equal to their ranks in Second Wind."},{"tier":2,"name":"Side Step","settings":"You should use this talent in all settings.","source":{"book":"crb","page":77},"ranked":true,"activation":"Active (Action)","id":"side-step","text":"Once per round, your character may suffer a number of strain no greater than their ranks in Side Step to use this talent. Until the end of your character\u2019s next turn, upgrade the difficulty of all ranged combat checks targeting your character a number of times equal to the strain suffered."},{"id":"snare","name":"Snare","tier":3,"activation":"Active (Action)","ranked":false,"text":"Once per session, your character may use this talent to make a Hard ([difficulty] [difficulty] [difficulty]) Computers (Sysops) check. If they succeed, once before the end of the encounter, you may spend a Story Point to force one character in the encounter to make a Daunting ([difficulty] [difficulty] [difficulty] [difficulty]) Vigilance check as an incidental. If they fail, they are staggered until the end of their next turn, plus one additional turn per [threat] [threat].","source":{"book":"sotb","page":50}},{"id":"special-use-permit","name":"Special Use Permit","tier":2,"activation":"Passive","ranked":false,"text":"Your character does not treat any Ranged (Heavy) weapons as restricted (R). This also means your character can carry a Ranged (Heavy) weapon that normally would be restricted in public without being arrested. However, they can still be arrested for using such a weapon in an unlawful manner.","source":{"book":"sotb","page":49}},{"id":"street-fighter","name":"Street Fighter","tier":1,"activation":"Active (Incidental)","ranked":false,"text":"When your character disorients or knocks their target prone while making a Brawl combat check, they may use this talent to cause the target to suffer wounds equal to your character\u2019s ranks in Skulduggery.","source":{"book":"sotb","page":45}},{"id":"suppressing-fire","name":"Suppressing Fire","tier":3,"activation":"Active (Maneuver)","ranked":true,"text":"If your character does not make a combat check during their turn, they use this talent to target one character (or minion group) within long range. That character must upgrade the difficulty of any ranged combat checks they make once until the end of your character\u2019s next turn. Your character may choose to affect one additional character for each additional rank of Suppressing Fire. Your character must be holding a ranged weapon to use this talent.","source":{"book":"sotb","page":50}},{"tier":1,"name":"Surgeon","settings":"You should use this talent in all settings.","source":{"book":"crb","page":74},"ranked":true,"activation":"Passive","id":"surgeon","text":"When your character makes a Medicine check to heal wounds, the target heals one additional wound per rank of Surgeon."},{"tier":1,"name":"Swift","settings":"You should use this talent in all settings.","source":{"book":"crb","page":75},"ranked":false,"activation":"Passive","id":"swift","text":"Your character does not suffer the penalties for moving through difficult terrain (they move through difficult terrain at normal speed without spending additional maneuvers)."},{"id":"tactical-focus","name":"Tactical Focus","tier":2,"activation":"Passive","ranked":false,"text":"When performing a combat check with a Ranged (Heavy) weapon, if your character did not perform a maneuver to ready or stow a weapon or item during this turn, they add [advantage] to the results.","source":{"book":"sotb","page":49}},{"id":"takedown","name":"Takedown","tier":3,"activation":"Active (Action)","ranked":false,"text":"Your character may use this talent to make an opposed Brawl versus Resilience check targeting one engaged opponent. If the check succeeds, the target is knocked prone and is immobilized until the end of your character\u2019s next turn. If the target is a minion or rival, your character can spend [triumph] to incapacitate (but not kill) the target instead.","source":{"book":"sotb","page":51}},{"tier":1,"name":"Toughened","settings":"You should use this talent in all settings.","source":{"book":"crb","page":75},"ranked":true,"activation":"Passive","id":"toughened","text":"Each rank of Toughened increases your character\u2019s wound threshold by two."},{"id":"tri-maf-contact","name":"Tri-Maf Contact","tier":1,"activation":"Passive","ranked":false,"text":"When you take this talent, your character gains Melee or Skulduggery (your choice) as a career skill. In addition, once per session, your character may collect a small favor from a member of a single orgcrime group (chosen when you take this talent), even if they do not owe your character a favor.","source":{"book":"sotb","page":45}},{"id":"trick-of-the-light","name":"Trick of the Light","tier":5,"activation":"Active (Incidental)","ranked":false,"text":"When making a combat check with a laser or maser weapon, your character may use this talent to spend [advantage] to inflict one additional hit with this weapon, dealing base damage plus damage equal to the total number of [success] scored on the check. This hit may target the original target or another target within short range of the original target.","source":{"book":"sotb","page":52}},{"id":"two-handed-stance","name":"Two-Handed Stance","tier":2,"activation":"Passive","ranked":false,"text":"When performing a combat check with a Ranged (Light) weapon, if your character has nothing in their other hand, they add [advantage] to the results.","source":{"book":"sotb","page":49}},{"id":"undercity-contacts","name":"Undercity Contacts","tier":2,"activation":"Active (Incidental)","ranked":false,"text":"Once per session, you may spend one Story Point to use this talent to let your character learn if a character of your choice is in New Angeles, and if so, what district. At your GM\u2019s discretion, the information may take up to an hour to come back to your character.","source":{"book":"sotb","page":49}},{"id":"undercity-contacts-improved","name":"Undercity Contacts (Improved)","tier":3,"activation":"Active (Incidental)","ranked":false,"text":"Your character must have purchased the Undercity Contacts talent to benefit from this talent. When you use Undercity Contacts, you may choose to spend two Story Points instead of one. If you do, your character learns the target's specific location.","source":{"book":"sotb","page":51}},{"id":"union-member","name":"Union Member","tier":1,"activation":"Passive","ranked":false,"text":"When you take this talent, your character gains Athletics, Mechanics, or Operating (your choice) as a career skill. In addition, once per session, your character may collect a small favor from a member of Humanity Labor or Human First, even if they do not owe your character a favor. TABLE 1\u20132: GENESYS TALENTS FOR THE ANDROID SETTING Talent Ranked Source Tier 1 Iaijutsu Training Talent Ranked Source Tier 2 Tier 3 TABLE 1\u20132: GENESYS TALENTS FOR THE ANDROID SETTING (CONT.) Talent Ranked Source Tier 4","source":{"book":"sotb","page":45}},{"tier":1,"name":"Unremarkable","settings":"You should use this talent in all settings.","source":{"book":"crb","page":75},"ranked":false,"activation":"Passive","id":"unremarkable","text":"Other characters add [failure] to any checks made to find or identify your character in a crowd."},{"id":"urban-combatant","name":"Urban Combatant","tier":4,"activation":"Active (Incidental, Out of Turn)","ranked":false,"text":"When your character is targeted by a combat check while in an urban environment, you may spend one Story Point to use this talent before the dice pool is rolled. If you do so, your character's opponent removes all [setback] added to the check, and instead adds an equal number of [failure] to the results.","source":{"book":"sotb","page":52}},{"id":"web-of-knowledge","name":"Web of Knowledge","tier":5,"activation":"Active (Action)","ranked":false,"text":"Once per session your character may make an Average ([difficulty] [difficulty]) Knowledge (Net) check during a Network encounter. If you succeed, your character knows the names, strengths, and other qualities of all ice (active or deactivated) on one system that you currently have access to, as well as all other characters (sysops and runners) that currently are accessing that system. Your character may spend [advantage] [advantage] [advantage] or [triumph] from this check (whether or not they succeeded) to add [success] to all Computer checks involving that system that they make for the remainder of the encounter.","source":{"book":"sotb","page":52}},{"id":"worlds-war-vet","name":"Worlds War Vet","tier":1,"activation":"Passive","ranked":false,"text":"When you take this talent, your character gains Ranged (Heavy) or Resilience as a career skill. In addition, once per session, your character may collect a small favor from a current or former member of a single country's military (chosen when you take this talent), even if they do not owe your character a favor.","source":{"book":"sotb","page":47}},{"id":"years-on-the-force","name":"Years on the Force","tier":1,"activation":"Passive","ranked":false,"text":"When you take this talent, your character gains Perception or Ranged (Light) as a career skill. In addition, once per session, your character may collect a small favor from a current or former member of the NAPD or New Angeles city government, even if they do not owe your character a favor. Talent Ranked Source Tier 5","source":{"book":"sotb","page":47}},{"id":"you-owe-me-one","name":"You Owe Me One","tier":3,"activation":"Active (Incidental)","ranked":false,"text":"Once per session, you may spend two Story Points to use this talent to have one NPC in the current encounter owe your character a favor. If the favor is not resolved by the end of the encounter, it is forgotten. It\u2019s up to you and your GM to determine exactly why the NPC owes your character a favor.","source":{"book":"sotb","page":51}},{"id":"you-owe-me-one-improved","name":"You Owe Me One (Improved)","tier":4,"activation":"Active (Incidental)","ranked":false,"text":"Your character must have purchased the You Owe Me One talent to benefit from this talent. Once per session, you may spend two Story Points to use You Owe Me One to have one NPC in the current encounter owe your character a big favor instead of a favor. If the big favor is not resolved by the end of the encounter, it is forgotten.","source":{"book":"sotb","page":52}}],"skills":[{"category":"General","avoid-when":["Your character attempts an activity without any chances of failure. If your character swims on a calm day in a shallow pond, goes for an early morning jog, or jumps over a small log, they don\u2019t need to bother making a check.","Your character attempts a physical activity that relies more on hand-eye coordination and general agility than straight strength. Engaging in parkour and freerunning, swinging on a rope and rappelling down a surface, and most forms of gymnastics are activities better represented by the Coordination skill."],"name":"Athletics","source":{"book":"crb","page":58},"characteristic":"brawn","id":"athletics","use-when":["Your character attempts to climb up or down a structure, particularly when the climb may be tricky or the drop to the bottom is significant.","Your character tries to swim in difficult conditions. High winds, waves, tides, and currents could all contribute to making swimming difficult enough to require an Athletics check.","Your character tries to jump, either vertically or horizontally. Leaping across a deep chasm or trying to jump up and grab a fire escape to get away from an angry dog are both situations when your character needs to make an Athletics check.","Your character attempts to run for an extended time."],"text":"Your group\u2019s characters lead dramatic lives filled with constant physical feats. Sometimes they\u2019ll be fighting an opponent with a gun, but just as often they\u2019ll be climbing mountains, swimming across raging rivers, and leaping across chasms."},{"id":"brawl","name":"Brawl","category":"Combat","characteristic":"brawn","text":"The Brawl skill is what your character uses to fight anyone who\u2019s right in front of them, rather than beyond arm\u2019s reach, when your character is fighting without any weapons. Martial arts, wrestling, and unarmed combat are all covered by this skill.","source":{"book":"crb","page":67}},{"category":"Social","avoid-when":["Your character is not at all sincere about what they are saying or doing. If there\u2019s duplicity or lying involved, your character should use the Deception skill.","Your character is being polite, but subtly implying"],"name":"Charm","source":{"book":"crb","page":54},"characteristic":"presence","id":"charm","use-when":["Your character tries to persuade someone to do your character a favor, especially if it might be inconvenient, expensive, or even dangerous for that person.","Your character tries to appeal to someone\u2019s better nature (even if it doesn\u2019t exist!) to get them to do something out of character for that person.","Your character tries to flirt with, seduce, or make a romantic overture to someone.","Your character tries to make themselves look better to everyone around them. A lot of politicians and public figures have high ranks in Charm.","Your character performs in front of an audience, acting, playing music, telling jokes, or giving a speech."],"text":"The ability to compliment, flatter, woo, and generally make other people like you is something that\u2019s pretty important to a lot of player characters. For characters who want to be likable, popular, and good at persuading other people to do what they want them to do, Charm is the skill they rely on."},{"category":"Social","avoid-when":["Your character issues orders backed by the threat of their authority (such as threatening troops with courts-martial if they don\u2019t follow your character into battle). In cases like this, Leadership would be a better skill for your character to use.","Your character tries to drive a hard bargain with someone. As long as both sides are still getting something out of the deal, Negotiation should be the skill to use.","Your character interacts with someone who is already terrified of or completely cowed by your character. In these cases, any further threats would be superfluous."],"name":"Coercion","source":{"book":"crb","page":55},"characteristic":"willpower","id":"coercion","use-when":["Your character issues a threat, whether or not accompanied by hostile actions. Even an implied threat\u2014such as gesturing toward a weapon\u2014falls under the Coercion skill.","Your character questions or interrogates a prisoner.","Your character uses physical or psychological torture."],"text":"Some people believe that the only way to maintain respect is to be feared. Others have learned that the best way to get what they want is through screaming and the threat of violence."},{"category":"General","avoid-when":["Your character is trying to reactivate a deactivated program. This would require the Computers (Sysops) skill.","Your character is trying to open a mechanical lock. Your character needs to use Skulduggery to defeat a mechanical item of that type.","Your character is trying to backtrace someone who has intruded on a server. This also requires the Computers (Sysops) skill."],"name":"Computers (Hacking)","source":{"book":"sotb","page":43},"variant-of":"computers","characteristic":"intellect","id":"computers-hacking","use-when":["Your character is trying to enter a secured server.","Your character is shutting down a piece of ice.","Your character is trying to open an electronic lock.","Your character is trying to destroy a computer program."],"text":"Hacking represents any offensive and destructive uses of the Computers skill presented in the Genesys Core Rulebook. It covers any attempts at electronic code breaking, intrusion or, of course, running on servers and breaking ice."},{"category":"General","avoid-when":["Your character is trying to deactivate or destroy a program. This would require the Computers (Hacking) skill.","Your character wants to remember details about a particular server on the Net. They need the Knowledge (The Net) skill for that.","Your character is trying to crack an electronic code or encryption. This also requires Computers (Hacking)."],"name":"Computers (Sysops)","source":{"book":"sotb","page":44},"variant-of":"computers","characteristic":"intellect","id":"computers-sysops","use-when":["Your character is trying to backtrace a runner who is trying to hack your server.","Your character needs to activate ice or other countermeasure programs.","Your character is trying to repair a damaged program.","Your character is trying to create a new program."],"text":"If Hacking represents offensive or destructive uses of the Computers skill, Sysops represents its defensive and constructive uses. The most prominent use of Sysops is to defend computer systems against runners, viruses, and other intrusions."},{"category":"General","avoid-when":["Your character tries to prevent being surprised. The Vigilance skill would work better in that situation.","Your character tries to maintain inner self-control, such as when meditating or resisting the effects of fear. When your character is concerned with inner composure, they should use the Discipline skill."],"name":"Cool","source":{"book":"crb","page":59},"characteristic":"presence","id":"cool","use-when":["Your character begins laying a trap, staging an ambush, or otherwise setting up a combat encounter in which your character initiates the combat and has to judge the right time to do so.","Your character needs to stay calm and unaffected when being flattered or charmed by someone.","Your character needs to refrain from saying or doing something foolish during a tense situation.","Your character needs to keep their nerve in a tense situation, such as when piloting one of two vehicles headed toward each other at high speed.","Your character plays a card game or other game of chance in which bluffing, luck, and gambling are all intertwined."],"text":"Staying calm and maintaining composure, outwaiting an opponent, generally being cool: these exemplify things your character does with the Cool skill. Cool is something of a defensive skill in nature, since it most often comes up as the skill your character uses to resist attempts to sway or affect them."},{"category":"General","avoid-when":["Your character tries to climb up or down a rope or climb up a structure. This activity relies more on strength than agility, and calls for an Athletics check instead.","Your character falls from a short height or onto something soft enough that they won\u2019t suffer damage when they land, or is in any similar situation that has no consequences for failure (is lowered down a structure in a firmly secured harness, for example)."],"name":"Coordination","source":{"book":"crb","page":59},"characteristic":"agility","id":"coordination","use-when":["Your character tries to swing back and forth on a rope or rappel down a structure.","Your character walks across a narrow surface while trying to keep their balance.","Your character tries to squeeze into a tiny or cramped space such as a crawlspace, sewer pipe, air duct, or narrow crevice.","Your character falls and needs to try to slow the fall or land safely.","Your character needs to escape from physical restraints (such as handcuffs or ropes) and wants to contort their limbs or hands so that they can slip out of their bindings."],"text":"In the course of adventures, characters sometimes find themselves needing to stay stable on unsteady surfaces, crawl through narrow openings, or even land safely after a fall. Overcoming these types of challenges requires a sense of balance and a heightened degree of flexibility, both of which are represented by the Coordination skill."},{"category":"Social","avoid-when":["Your character actually believes the things they are saying (even if they are objectively untrue).","Your character tells a \u201Cwhite lie,\u201D a minor falsehood to make someone feel better."],"name":"Deception","source":{"book":"crb","page":56},"characteristic":"cunning","id":"deception","use-when":["Your character tells a lie.","Your character tries to mislead someone through clever wordplay or selective omission of certain facts.","Your character wears a disguise and pretends to be someone else."],"text":"When your character needs to lie to someone, they use Deception. In fact, the Deception skill covers most attempts to fool or deceive someone, which makes the skill one of the more straightforward skills to use."},{"category":"General","avoid-when":["Your character tries to keep their composure in a social setting and avoid letting their emotions show. Your character would make a Cool check instead.","Your character catches a lie as it is being told. Noticing a lie depends on your character\u2019s Vigilance."],"name":"Discipline","source":{"book":"crb","page":60},"characteristic":"willpower","id":"discipline","use-when":["Your character confronts something terrifying and wants to avoid fleeing in horror (or to avoid other debilitating effects of fear).","Your character tries to keep their sanity in the face of something that defies reality and rational thought.","Your character wants to heal strain they are suffering from at the end of an encounter.","Your character wants to meditate, calm their mind, and reach a mental equilibrium."],"text":"Discipline is your character\u2019s ability to focus their mind and quiet their thoughts. Discipline represents your character\u2019s maintaining self-mastery and focus, specifically."},{"category":"General","avoid-when":["Your character operates an aircraft of any kind; this would call for the Piloting skill.","Your character drives a vehicle under normal conditions (and at safe speeds) without any immediate danger, which shouldn\u2019t require a check at all.","Your character attempts to modify a vehicle to improve its speed; the Mechanics skill is more appropriate for this."],"name":"Driving","source":{"book":"crb","page":60},"characteristic":"agility","id":"driving","use-when":["Your character wants to bring a vehicle to a safe stop after one of its tires is damaged.","Your character tries to keep up speed while rounding hairpin curves when driving a vehicle.","Your character attempts to catch up to someone else in a vehicle (if the target is on foot, a check should only be necessary if they try to escape in a crowd or through a narrow space).","Your character swerves to avoid an animal darting across the road, or tries to avoid a falling rock on a winding mountain pass."],"text":"The Driving skill includes the operation of all groundbased vehicles, from simple automobiles to multi-car locomotives to high-speed futuristic driving pods. The types of vehicles depend a lot on the setting, of course."},{"id":"gunnery","name":"Gunnery","category":"Combat","characteristic":"agility","text":"Your character uses Gunnery, the third of the Ranged sub-skills, to fire machine guns, plasma cannons, heavy railguns, missile launchers, grenade launchers, and pretty much any other weapon large enough that you need a tripod or team of people to use it. Your character also uses it to fire weapons mounted on vehicles.","source":{"book":"crb","page":69},"variant-of":"ranged"},{"category":"Knowledge","avoid-when":["Your character is trying to fix a hydrogen fuel cell. This would require Mechanics.","Your character is trying to fly a spacecraft along a specific trajectory. Your character may use Knowledge (Science) to calculate the course, but they need to use Operating to fly it.","Your character needs to know the specifics of the Fed\u2019s jurisdiction in New Angeles, which would require the Knowledge (Society) skill instead. Skill Char Type Source Athletics Brawn General Core Rulebook (page 58) Brawl Brawn Combat Core Rulebook (page 67) Charm Presence Social Core Rulebook (page 54) Coercion Willpower Social Core Rulebook (page 55) Computers (Hacking) Intellect General Computers (Sysops) Intellect General Cool Presence General Core Rulebook (page 59) Coordination Agility General Core Rulebook (page 59) Deception Cunning Social Core Rulebook (page 56) Discipline Willpower General Core Rulebook (page 60) Driving Agility General Core Rulebook (page 60) Gunnery Agility Combat Core Rulebook (page 69) Knowledge (Science) Intellect Knowledge Knowledge (Society) Intellect Knowledge Knowledge (The Net) Intellect Knowledge Leadership Presence Social Core Rulebook (page 56) Mechanics Intellect General Core Rulebook (page 60) Medicine Intellect General Core Rulebook (page 61) Melee Brawn Combat Core Rulebook (page 67) Negotiation Presence Social Core Rulebook (page 56) Operating Intellect General Core Rulebook (page 62) Perception Cunning General Core Rulebook (page 62) Piloting Agility General Core Rulebook (page 62) Ranged (Heavy) Agility Combat Core Rulebook (page 69) Ranged (Light) Agility Combat Core Rulebook (page 68) Resilience Brawn General Core Rulebook (page 63) Skulduggery Cunning General Core Rulebook (page 64) Stealth Agility General Core Rulebook (page 64) Streetwise Cunning General Core Rulebook (page 65) Survival Cunning General Core Rulebook (page 65) Vigilance Willpower General Core Rulebook (page 65)"],"name":"Knowledge (Science)","source":{"book":"sotb","page":42},"variant-of":"knowledge","characteristic":"intellect","id":"knowledge-science","use-when":["Your character is trying to recall the formula for a drug or chemical.","Your character needs to remember the name of a lunar crater.","Your character tries to calculate the correct trajectory for a spacecraft entering Earth orbit.","Your character needs to know how many people a buckyweave rope can support before breaking."],"text":"Science has made great discoveries, the results of which are all around the citizens of New Angeles. New technologies such as fusion power, clones, bioroids, the space elevator, and the Net have fundamentally changed the lives of ordinary people."},{"category":"Knowledge","avoid-when":["Your character needs to find the nearest NAPD station. This would require Streetwise (although knowing information about the NAPD in general would be covered by Knowledge [Society]).","Your character needs to know some element of Network etiquette and habits. They would need Knowledge (The Net) instead.","Your character wants to know how far a local street gang\u2019s territory reaches. This would be a Streetwise check."],"name":"Knowledge (Society)","source":{"book":"sotb","page":43},"variant-of":"knowledge","characteristic":"intellect","id":"knowledge-society","use-when":["Your character wants to remember facts about New Angeles.","Your character needs to make an argument in a court of law that\u2019s grounded on a solid legal base.","Your character wants to remember how the average Loonie feels about the NAPD before traveling to Luna.","Your character wants to know if someone is trying to manipulate the stock market by short selling shares in a major company.","Your character is trying to figure out what the most powerful organized crime outfits in New Angeles are."],"text":"This skill has two distinct aspects that it governs. The first is knowledge about societies in general and how they function, which can include economic theory, sociology, law, and the like."},{"category":"Knowledge","avoid-when":["Your character is attempting to break through a piece of ice. This is handled by the Computers (Hacking) skill.","Your character is trying to reactivate or repair lines of code in a program. This is handled by the Computers (Sysops) skill.","Your character wants to see what they know about current popular culture. Although that information can be found on the Net (in exhausting detail), it still requires a Knowledge (Society) check."],"name":"Knowledge (The Net)","source":{"book":"sotb","page":43},"variant-of":"knowledge","characteristic":"intellect","id":"knowledge-the-net","use-when":["Your character wants to know which Shadow Net virtual chatspaces they should visit to recruit a reliable runner.","Your character wants to know the dangers of trying to break a piece of ice.","Your character is trying to figure out what real-world corp is hosting a server full of valuable information.","Your character is trying to remember any rumors about so-called \u201Cgod ice,\u201D \u201Cghost runners,\u201D or other legends of the Net."],"text":"These days, the Network has become far more than the internets of years past. For all intents and purposes, it is its own world, growing and changing, with its own inhabitants and dangers, all paralleling our own."},{"category":"Social","avoid-when":["Your character threatens to hurt or kill someone if they don\u2019t obey. This would be a good use of Coercion, instead.","Your character tries to convince someone to do some
