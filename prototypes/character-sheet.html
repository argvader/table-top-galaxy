<title>Genesys Character Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: same ship-console tokens as the dice roller. Desktop = identity + stat band + vitals across the top,
   skills column on the left, tabbed detail on the right, roll drawer slides in from the right.
   Phone = one column, sticky tab strip (Skills first), roll drawer as a bottom sheet. */
:root {
  --bg: #e6ecec; --surface: #f6f9f9; --surface-2: #edf2f2; --ink: #12201f; --muted: #586a69; --line: #c6d2d1;
  --accent: #0d6f78; --accent-ink: #ffffff; --good: #1f7a3a; --warn: #9a6200; --bad: #a32b2b;
  --wound: #b23a3a; --strain: #2f6fb0;
  --die-stroke: rgba(0,0,0,.18); --shadow: 0 1px 2px rgba(18,32,31,.08), 0 10px 30px rgba(18,32,31,.16);
  --f-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --d-ability: #3f9b46; --d-prof: #f2c230; --d-boost: #8fd0ea; --d-diff: #5b3c8f; --d-chal: #b8262f; --d-set: #1b1b1d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1214; --surface: #141d20; --surface-2: #1a252a; --ink: #e2ebeb; --muted: #8ea1a2; --line: #26363b;
    --accent: #49bfc8; --accent-ink: #062224; --good: #5fcf7e; --warn: #e3b04b; --bad: #f07a7a;
    --wound: #f07a7a; --strain: #78b4ef;
    --die-stroke: rgba(255,255,255,.28); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1214; --surface: #141d20; --surface-2: #1a252a; --ink: #e2ebeb; --muted: #8ea1a2; --line: #26363b;
  --accent: #49bfc8; --accent-ink: #062224; --good: #5fcf7e; --warn: #e3b04b; --bad: #f07a7a;
  --wound: #f07a7a; --strain: #78b4ef;
  --die-stroke: rgba(255,255,255,.28); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 600; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1320px; margin: 0 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); white-space: nowrap; }
.tag.gm { border-style: dashed; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
/* Book citation: every rule and entry says where it came from */
.cite { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; vertical-align: 2px; white-space: nowrap; }
/* Dice and symbols inline in rules text ([advantage], [setback] ...) */
.glyph { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -0.15em; }
.glyph svg { width: 100%; height: 100%; display: block; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 6px; }
.proto { font-size: 12px; padding: 2px 8px; border: 1px dashed var(--line); border-radius: 99px; color: var(--muted); }
.spacer { flex: 1; }

/* Story points (shared group pool) */
.story { position: relative; display: flex; align-items: center; gap: 8px; }
.tokens { display: flex; gap: 4px; }
.tok { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); cursor: pointer; padding: 0; position: relative; }
.tok.player { background: var(--surface); }
.tok.player::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--accent); }
.tok.gm { background: var(--ink); cursor: default; }
.tok.gm::after { content: ""; position: absolute; inset: 7px; transform: rotate(45deg); background: var(--surface); border-radius: 2px; }
.tok.flip { animation: flip .5s ease; }
@keyframes flip { 0% { transform: rotateY(0) } 50% { transform: rotateY(90deg) } 100% { transform: rotateY(0) } }
@media (prefers-reduced-motion: reduce) { .tok.flip { animation: none; } }
.sp-count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.sp-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 8px; }
.sp-menu p { margin: 0; font-size: 13px; color: var(--muted); }
.sp-menu .btn { text-align: left; }
.chip.sp { border-color: var(--accent); }
.chip.sp .tok-mini { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); position: relative; }
.chip.sp .tok-mini::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent); }

/* Identity */
.ident { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-block: 16px 12px; }
.portrait { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; font-family: var(--f-display); font-size: 26px; font-weight: 700;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--surface)), var(--surface-2)); border: 1px solid var(--line); }
.ident h1 { margin: 0; font-family: var(--f-display); font-size: 34px; line-height: 1; font-weight: 700; text-wrap: balance; }
.ident .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.xp { text-align: right; }
.xp b { font-family: var(--f-mono); font-size: 22px; display: block; line-height: 1.1; }
.xp span { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .ident { grid-template-columns: auto minmax(0, 1fr); } .xp { grid-column: 1 / -1; text-align: left; display: flex; gap: 8px; align-items: baseline; } .xp b { display: inline; } .ident h1 { font-size: 28px; } }

/* Characteristics */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px 6px; text-align: center; cursor: pointer; position: relative; }
.stat:hover { border-color: var(--accent); }
.stat b { display: block; font-family: var(--f-display); font-size: 38px; line-height: 1; font-weight: 700; }
.stat span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stat b { font-size: 30px; } }

/* Vitals */
.vitals { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.4fr) repeat(3, minmax(0, .8fr)); gap: 8px; margin-top: 8px; }
@media (max-width: 1000px) { .vitals { grid-template-columns: repeat(2, minmax(0, 1fr)); } .vitals .small { grid-column: span 1; } }
@media (max-width: 1000px) and (min-width: 561px) { .vitals { grid-template-columns: repeat(6, minmax(0, 1fr)); } .vitals .track { grid-column: span 3; } .vitals .small { grid-column: span 2; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.track { padding: 10px 12px; }
.track.over { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.track .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.track .val { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.track .val b { font-size: 26px; color: var(--ink); }
.pips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; margin: 8px 0; }
.pips i { height: 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.pips.wound i.on { background: var(--wound); border-color: var(--wound); }
.pips.strain i.on { background: var(--strain); border-color: var(--strain); }
.pips i.over { background: var(--bad); border-color: var(--bad); opacity: .55; }
.track .ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.track .ctl .step { width: 34px; height: 30px; padding: 0; font-weight: 700; font-size: 16px; }
.hit { display: flex; gap: 6px; align-items: center; }
.hit input { width: 62px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.alert { margin-top: 8px; font-size: 13px; color: var(--bad); font-weight: 700; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.small { padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.small b { font-family: var(--f-display); font-size: 32px; line-height: 1; }
.small .pair { display: flex; gap: 14px; }
.small .pair div { display: flex; flex-direction: column; }
.small .pair small { font-size: 11px; color: var(--muted); }
.small .why { font-size: 12px; color: var(--muted); }
.enc-bar { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.enc-bar i { display: block; height: 100%; background: var(--accent); }

/* Main */
.main { display: grid; gap: 16px; margin-top: 16px; }
@media (min-width: 1000px) { .main { grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); align-items: start; } }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 600; letter-spacing: .03em; }
.search { margin: 0 14px 8px; display: block; width: calc(100% - 28px); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.group > .label { padding: 8px 14px 4px; display: block; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 14px; text-align: left; cursor: pointer; border-top: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.srow:hover { background: var(--surface-2); }
.srow .nm { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .nm i { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 4px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: middle; }
.dot.off { background: transparent; border: 1px solid var(--line); }
.ranks { display: inline-flex; gap: 2px; }
.ranks i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); }
.ranks i.on { background: var(--ink); border-color: var(--ink); }
.mini { display: flex; gap: 2px; min-width: 54px; justify-content: flex-end; }
.mini svg { width: 17px; height: 17px; }

/* Tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 11px 12px 9px; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--f-mono); font-size: 11px; margin-left: 4px; color: var(--muted); }
.tabbody { padding: 14px; }
@media (max-width: 999px) {
  .tabs.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-radius: 12px 12px 0 0; }
  [data-desk-only] { display: none !important; }
}
@media (min-width: 1000px) { [data-phone-only] { display: none !important; } }
.list { display: grid; gap: 8px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); display: grid; gap: 4px; }
.item .row1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.item h3 { margin: 0; font-size: 16px; font-weight: 700; }
.item .meta { font-size: 13px; color: var(--muted); }
.item p { margin: 0; font-size: 14px; }
.item .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.weap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.weap .stats-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.weap .stats-row b { color: var(--ink); font-family: var(--f-mono); }
.pyramid { display: grid; gap: 4px; justify-items: center; margin-bottom: 14px; }
.pyramid .tier { display: flex; gap: 4px; align-items: center; }
.pyramid .tier span { font-size: 11px; color: var(--muted); width: 52px; text-align: right; margin-right: 6px; }
.pyramid .slot { width: 30px; height: 18px; border-radius: 4px; border: 1px dashed var(--line); }
.pyramid .slot.on { background: var(--accent); border: 1px solid var(--accent); }
.pyr-ok { font-size: 12px; color: var(--good); text-align: center; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.sect { margin-bottom: 18px; }
.sect > h3 { margin: 0 0 8px; font-family: var(--f-display); font-size: 16px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.debt-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.debt-big b { font-family: var(--f-display); font-size: 44px; line-height: 1; }
.corp { font-weight: 700; }
textarea { width: 100%; min-height: 220px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); resize: vertical; line-height: 1.5; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist time { color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
.critroll { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 12px; }
.critroll b { font-family: var(--f-mono); font-size: 20px; }

/* Roll drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
.drawer { position: fixed; z-index: 31; background: var(--surface); box-shadow: var(--shadow); flex-direction: column; overflow: hidden; }
.drawer:not([hidden]) { display: flex; }
@media (min-width: 760px) { .drawer { top: 0; right: 0; bottom: 0; width: min(440px, 100%); border-left: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0; } }
@media (max-width: 759px) { .drawer { left: 0; right: 0; bottom: 0; max-height: 88vh; border-radius: 16px 16px 0 0; border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); } }
.drawer .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
@media (min-width: 760px) { .drawer .grab { display: none; } }
.drawer header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 12px 16px 8px; }
.drawer h2 { margin: 0; font-family: var(--f-display); font-size: 26px; line-height: 1.05; font-weight: 700; }
.drawer .meta { font-size: 13px; color: var(--muted); }
.drawer .body { overflow: auto; padding: 0 16px 16px; display: grid; gap: 12px; }
.x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.tray { border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 12px; min-height: 76px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tray .vs { font-family: var(--f-display); color: var(--muted); padding: 0 4px; font-size: 13px; letter-spacing: .1em; }
.die { border: 0; background: none; padding: 0; cursor: pointer; line-height: 0; }
.die svg { width: 44px; height: 44px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .dp { display: inline-flex; gap: 2px; }
.chip .dp i { width: 7px; height: 7px; transform: rotate(45deg); background: var(--d-diff); display: inline-block; }
.chip small { color: var(--muted); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .75; }
.chip svg { width: 16px; height: 16px; }
.rollbtn { width: 100%; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 18px; cursor: pointer; }
.rollbtn:disabled { opacity: .4; cursor: not-allowed; }
.verdict h3 { margin: 0; font-family: var(--f-display); font-size: 30px; line-height: 1; font-weight: 700; }
.verdict h3.ok { color: var(--good); } .verdict h3.no { color: var(--bad); }
.verdict p { margin: 4px 0 0; color: var(--muted); }
.net { display: flex; flex-wrap: wrap; gap: 6px; }
.net .n { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: var(--surface-2); font-size: 14px; }
.net .n svg { width: 18px; height: 18px; }
.net .n b { font-family: var(--f-mono); }
.rolled { display: flex; flex-wrap: wrap; gap: 4px; }
.rolled svg { width: 36px; height: 36px; }
.rolled.tumble svg { animation: tumble .45s ease-out; }
@keyframes tumble { 0% { transform: rotate(-200deg) scale(.6); opacity: .2 } 100% { transform: none; opacity: 1 } }
.dmg { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.dmg b { font-family: var(--f-mono); font-size: 22px; }
.dmg .crit { font-weight: 700; color: var(--bad); }
.opt { display: grid; grid-template-columns: 50px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; cursor: pointer; margin-bottom: 6px; font-size: 14px; }
.opt:disabled { opacity: .4; cursor: not-allowed; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt .cost { display: inline-flex; gap: 1px; } .opt .cost svg { width: 14px; height: 14px; }
.spent { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.spent span { border: 1px dashed var(--line); border-radius: 99px; padding: 2px 8px; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.readonly { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
h4 .left { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
h4 .left svg { width: 13px; height: 13px; vertical-align: -2px; }
#dice3d { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; transition: opacity .6s ease; }
#dice3d.fade { opacity: 0; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(() => {
  // ---------- Genesys dice (face tables) ----------
  // s success, f failure, a advantage, t threat, r triumph, d despair
  const DICE = {
    proficiency: { name: "Proficiency", short: "d12", shape: "d12", color: "var(--d-prof)", hex: "#f2c230", ink: "#1b1b1d", pos: true,
      faces: ["", "s", "s", "ss", "ss", "a", "sa", "sa", "sa", "aa", "aa", "r"] },
    ability: { name: "Ability", short: "d8", shape: "d8", color: "var(--d-ability)", hex: "#3f9b46", ink: "#0d1f10", pos: true,
      faces: ["", "s", "s", "ss", "a", "a", "sa", "aa"] },
    boost: { name: "Boost", short: "d6", shape: "d6", color: "var(--d-boost)", hex: "#8fd0ea", ink: "#10222b", pos: true,
      faces: ["", "", "s", "sa", "aa", "a"] },
    challenge: { name: "Challenge", short: "d12", shape: "d12", color: "var(--d-chal)", hex: "#b8262f", ink: "#ffffff", pos: false,
      faces: ["", "f", "f", "ff", "ff", "t", "t", "ft", "ft", "tt", "tt", "d"] },
    difficulty: { name: "Difficulty", short: "d8", shape: "d8", color: "var(--d-diff)", hex: "#5b3c8f", ink: "#ffffff", pos: false,
      faces: ["", "f", "ff", "t", "t", "t", "tt", "ft"] },
    setback: { name: "Setback", short: "d6", shape: "d6", color: "var(--d-set)", hex: "#1b1b1d", ink: "#ffffff", pos: false,
      faces: ["", "", "f", "f", "t", "t"] },
  };
  const ORDER = ["proficiency", "ability", "boost", "challenge", "difficulty", "setback"];
  const SYM_NAME = { s: "Success", f: "Failure", a: "Advantage", t: "Threat", r: "Triumph", d: "Despair" };
  // Same glyphs as the <symbol> defs, reused to paint the 3D die faces.
  const GLYPH = {
    s: { d: "M12 1 L14.6 9.4 L23 12 L14.6 14.6 L12 23 L9.4 14.6 L1 12 L9.4 9.4 Z" },
    f: { d: "M4 6.5 L6.5 4 L12 9.5 L17.5 4 L20 6.5 L14.5 12 L20 17.5 L17.5 20 L12 14.5 L6.5 20 L4 17.5 L9.5 12 Z" },
    a: { d: "M12 2 L21 10 L18.2 12.6 L12 7.2 L5.8 12.6 L3 10 Z M12 10.5 L21 18.5 L18.2 21.1 L12 15.7 L5.8 21.1 L3 18.5 Z" },
    t: { d: "M12 22 L21 14 L18.2 11.4 L12 16.8 L5.8 11.4 L3 14 Z M12 13.5 L21 5.5 L18.2 2.9 L12 8.3 L5.8 2.9 L3 5.5 Z" },
    r: { ring: true, d: "M12 4.5 L13.7 10.3 L19.5 12 L13.7 13.7 L12 19.5 L10.3 13.7 L4.5 12 L10.3 10.3 Z" },
    d: { ring: true, d: "M7 8.6 L8.6 7 L12 10.4 L15.4 7 L17 8.6 L13.6 12 L17 15.4 L15.4 17 L12 13.6 L8.6 17 L7 15.4 L10.4 12 Z" },
  };

  const tally = (face) => {
    const c = { s: 0, f: 0, a: 0, t: 0, r: 0, d: 0 };
    for (const ch of face) c[ch]++;
    return c;
  };
  const rand = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const randf = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; };

  const poolList = (pool) => ORDER.flatMap((t) => Array(pool[t]).fill(t));
  function scoreDice(dice) {
    const t = dice.reduce((acc, d) => { const c = tally(d.face); for (const k in c) acc[k] += c[k]; return acc; },
      { s: 0, f: 0, a: 0, t: 0, r: 0, d: 0 });
    const netS = t.s + t.r - t.f - t.d;
    const netA = t.a - t.t;
    return { dice, raw: t, netS, netA, triumph: t.r, despair: t.d, success: netS >= 1 };
  }
  const instantRoll = (types) => types.map((type) => ({ type, face: DICE[type].faces[rand(DICE[type].faces.length)] }));

  // ---------- 3D dice: three.js render + cannon.js physics, walled in by the viewport ----------
  const Dice3D = (() => {
    const PX_PER_UNIT = 34, FOV = 30, GRAVITY = -60;
    const PHI = (1 + Math.sqrt(5)) / 2;
    let ok = false, renderer, scene, camera, world, floorMesh, walls = {}, live = [], raf = 0, fadeTimer = 0, bounds = { x: 6, z: 8 };
    const v3 = (x, y, z) => ({ x, y, z });
    const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
    const sub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
    const cross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
    const norm = (a) => { const l = Math.hypot(a.x, a.y, a.z); return v3(a.x / l, a.y / l, a.z / l); };
    const signs = (fn) => { const out = []; for (const i of [1, -1]) for (const j of [1, -1]) for (const k of [1, -1]) out.push(fn(i, j, k)); return out; };
    const cyc = (a, b) => [v3(0, a, b), v3(a, b, 0), v3(b, 0, a)];
    const pm = (fn) => [[1, 1], [1, -1], [-1, 1], [-1, -1]].flatMap(([i, j]) => fn(i, j));

    // Vertices + face normals per shape; faces are derived so every die shares one builder.
    const SOLIDS = {
      d6: { radius: 1.3, inset: 0.707, verts: signs((i, j, k) => v3(i, j, k)),
            normals: [v3(1, 0, 0), v3(-1, 0, 0), v3(0, 1, 0), v3(0, -1, 0), v3(0, 0, 1), v3(0, 0, -1)] },
      d8: { radius: 1.45, inset: 0.5, verts: [v3(1, 0, 0), v3(-1, 0, 0), v3(0, 1, 0), v3(0, -1, 0), v3(0, 0, 1), v3(0, 0, -1)],
            normals: signs((i, j, k) => v3(i, j, k)) },
      d12: { radius: 1.45, inset: 0.809,
             verts: [...signs((i, j, k) => v3(i, j, k)), ...pm((i, j) => cyc(i / PHI, j * PHI))],
             normals: pm((i, j) => cyc(i * PHI, j)) },
    };

    function faces(solid) {
      const verts = solid.verts.map(norm);
      return solid.normals.map((n0) => {
        const n = norm(n0);
        const best = Math.max(...verts.map((v) => dot(v, n)));
        const idx = verts.map((v, i) => [dot(v, n), i]).filter(([d]) => d > best - 1e-6).map(([, i]) => i);
        const c = idx.reduce((acc, i) => v3(acc.x + verts[i].x / idx.length, acc.y + verts[i].y / idx.length, acc.z + verts[i].z / idx.length), v3(0, 0, 0));
        const u = norm(sub(verts[idx[0]], c)), w = cross(n, u);
        const ang = (i) => { const p = sub(verts[i], c); return Math.atan2(dot(p, w), dot(p, u)); };
        idx.sort((a, b) => ang(a) - ang(b));
        const rFace = Math.max(...idx.map((i) => Math.hypot(...Object.values(sub(verts[i], c)))));
        return { n, idx, c, u, w, rFace };
      });
    }

    const texCache = new Map();
    function faceTexture(type, face, inset) {
      const key = `${type}|${face}`;
      if (texCache.has(key)) return texCache.get(key);
      const size = 256, cv = document.createElement("canvas");
      cv.width = cv.height = size;
      const g = cv.getContext("2d");
      g.fillStyle = DICE[type].hex; g.fillRect(0, 0, size, size);
      const syms = [...face];
      const room = size * 0.5 * inset * 0.8;
      const s = syms.length > 1 ? room * 0.95 : room * 1.35;
      syms.forEach((ch, i) => {
        const cx = size / 2 + (syms.length > 1 ? (i === 0 ? -s / 2 : s / 2) : 0);
        paintGlyph(g, GLYPH[ch], cx, size / 2, s, DICE[type].ink);
      });
      const tex = new THREE.CanvasTexture(cv);
      tex.anisotropy = 4;
      texCache.set(key, tex);
      return tex;
    }
    function paintGlyph(g, glyph, cx, cy, s, ink) {
      g.save();
      g.translate(cx - s / 2, cy - s / 2); g.scale(s / 24, s / 24);
      g.fillStyle = ink; g.strokeStyle = ink; g.lineWidth = 2.4;
      if (glyph.ring) { g.beginPath(); g.arc(12, 12, 10, 0, Math.PI * 2); g.stroke(); }
      g.fill(new Path2D(glyph.d));
      g.restore();
    }

    const shapeCache = {};
    function shape(kind) {
      if (shapeCache[kind]) return shapeCache[kind];
      const solid = SOLIDS[kind], fs = faces(solid), r = solid.radius;
      const verts = solid.verts.map(norm);
      const pos = [], nrm = [], uv = [], groups = [];
      fs.forEach((f, fi) => {
        const start = pos.length / 3;
        for (let k = 1; k < f.idx.length - 1; k++) {
          for (const vi of [f.idx[0], f.idx[k], f.idx[k + 1]]) {
            const v = verts[vi], p = sub(v, f.c);
            pos.push(v.x * r, v.y * r, v.z * r); nrm.push(f.n.x, f.n.y, f.n.z);
            uv.push(0.5 + 0.5 * dot(p, f.u) / f.rFace, 0.5 + 0.5 * dot(p, f.w) / f.rFace);
          }
        }
        groups.push([start, pos.length / 3 - start, fi]);
      });
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute("normal", new THREE.Float32BufferAttribute(nrm, 3));
      geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
      groups.forEach(([s, c, m]) => geo.addGroup(s, c, m));
      const body = new CANNON.ConvexPolyhedron(verts.map((v) => new CANNON.Vec3(v.x * r, v.y * r, v.z * r)), fs.map((f) => f.idx.slice()));
      return (shapeCache[kind] = { geo, body, faces: fs, inset: solid.inset, radius: r });
    }

    function init() {
      if (!window.THREE || !window.CANNON) return false;
      try {
        const canvas = document.getElementById("dice3d");
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      } catch (e) { return false; }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 1000);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.75));
      const sun = new THREE.DirectionalLight(0xffffff, 0.75);
      sun.position.set(-8, 30, 10); sun.castShadow = true;
      Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 });
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.updateProjectionMatrix();
      scene.add(sun);
      floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.22 }));
      floorMesh.rotation.x = -Math.PI / 2; floorMesh.receiveShadow = true;
      scene.add(floorMesh);
      buildWorld();
      resize();
      window.addEventListener("resize", resize);
      return (ok = true);
    }

    function buildWorld() {
      world = new CANNON.World();
      world.gravity.set(0, GRAVITY, 0);
      world.broadphase = new CANNON.NaiveBroadphase();
      world.solver.iterations = 12;
      const mat = new CANNON.Material("dice");
      world.addContactMaterial(new CANNON.ContactMaterial(mat, mat, { friction: 0.35, restitution: 0.35 }));
      world.defaultContactMaterial.friction = 0.35;
      world.defaultContactMaterial.restitution = 0.35;
      const plane = (axis, angle) => {
        const b = new CANNON.Body({ mass: 0, material: mat });
        b.addShape(new CANNON.Plane());
        if (axis) b.quaternion.setFromAxisAngle(axis, angle);
        world.addBody(b);
        return b;
      };
      const X = new CANNON.Vec3(1, 0, 0), Y = new CANNON.Vec3(0, 1, 0);
      walls = { floor: plane(X, -Math.PI / 2), ceil: plane(X, Math.PI / 2), left: plane(Y, Math.PI / 2),
                right: plane(Y, -Math.PI / 2), top: plane(null, 0), bottom: plane(Y, Math.PI) };
      walls.ceil.position.set(0, 9, 0);
      Dice3D.mat = mat;
    }

    // Size the world so one unit is PX_PER_UNIT pixels on any screen, then put the walls at the window edges.
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const halfZ = h / 2 / PX_PER_UNIT, height = halfZ / Math.tan((FOV / 2) * Math.PI / 180);
      camera.position.set(0, height, 0); camera.up.set(0, 0, -1); camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();
      bounds = { x: halfZ * camera.aspect - 0.4, z: halfZ - 0.4 };
      walls.left.position.set(-bounds.x, 0, 0); walls.right.position.set(bounds.x, 0, 0);
      walls.top.position.set(0, 0, -bounds.z); walls.bottom.position.set(0, 0, bounds.z);
      if (!raf) renderer.render(scene, camera);
    }

    function clear() {
      clearTimeout(fadeTimer);
      for (const d of live) { scene.remove(d.mesh); world.remove(d.body); }
      live = [];
      document.getElementById("dice3d").classList.remove("fade");
      renderer.render(scene, camera);
    }

    function spawn(type, i, n) {
      const sh = shape(DICE[type].shape);
      const mats = sh.faces.map((_, fi) => new THREE.MeshStandardMaterial({ map: faceTexture(type, DICE[type].faces[fi], sh.inset), roughness: 0.42, metalness: 0.05 }));
      const mesh = new THREE.Mesh(sh.geo, mats);
      mesh.castShadow = true;
      const body = new CANNON.Body({ mass: 1, material: Dice3D.mat, linearDamping: 0.12, angularDamping: 0.12 });
      body.addShape(sh.body);
      const cols = Math.max(1, Math.floor((bounds.x * 2 - 2) / 3));
      const col = i % cols, row = Math.floor(i / cols);
      body.position.set(-bounds.x + 1.5 + (col + 0.5) * ((bounds.x * 2 - 3) / cols), 2.5 + row * 1.5, bounds.z - 1.8 - row * 0.6);
      body.quaternion.setFromEuler(randf() * 6.28, randf() * 6.28, randf() * 6.28);
      body.velocity.set((randf() - 0.5) * 10, 2 + randf() * 4, -(22 + randf() * 14));
      body.angularVelocity.set((randf() - 0.5) * 40, (randf() - 0.5) * 40, (randf() - 0.5) * 40);
      world.addBody(body); scene.add(mesh);
      return { type, mesh, body, faces: sh.faces };
    }

    function upness(d) {
      let best = -2, at = 0;
      d.faces.forEach((f, i) => {
        const n = d.body.quaternion.vmult(new CANNON.Vec3(f.n.x, f.n.y, f.n.z));
        if (n.y > best) { best = n.y; at = i; }
      });
      return { best, at };
    }
    const topFace = (d) => DICE[d.type].faces[upness(d).at];
    // A die resting on an edge or against a wall gets a small hop so it lands flat.
    function nudgeCocked() {
      const cocked = live.filter((d) => upness(d).best < 0.9);
      for (const d of cocked) {
        d.body.velocity.set((randf() - 0.5) * 4, 6 + randf() * 3, (randf() - 0.5) * 4);
        d.body.angularVelocity.set((randf() - 0.5) * 12, (randf() - 0.5) * 12, (randf() - 0.5) * 12);
      }
      return cocked.length > 0;
    }
    const isCalm = (d) => d.body.velocity.length() < 0.12 && d.body.angularVelocity.length() < 0.12;

    function roll(types, onDone) {
      clear();
      live = types.map((t, i) => spawn(t, i, types.length));
      let last = performance.now(), started = last, still = 0, nudges = 0, damped = false;
      const step = (now) => {
        world.step(1 / 60, Math.min(0.05, (now - last) / 1000), 4);
        last = now;
        for (const d of live) { d.mesh.position.copy(d.body.position); d.mesh.quaternion.copy(d.body.quaternion); }
        renderer.render(scene, camera);
        if (!damped && now - started > 2200) {
          damped = true;
          for (const d of live) { d.body.linearDamping = 0.4; d.body.angularDamping = 0.4; }
        }
        still = live.every(isCalm) ? still + 1 : 0;
        if (still > 18 && nudges < 3 && nudgeCocked()) { nudges++; still = 0; }
        if (still > 18 || now - started > 8000) {
          raf = 0;
          onDone(live.map((d) => ({ type: d.type, face: topFace(d) })));
          fadeTimer = setTimeout(() => document.getElementById("dice3d").classList.add("fade"), 4500);
          return;
        }
        raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }

    return { init, roll, clear, get ok() { return ok; }, get busy() { return raf !== 0; } };
  })();


  // ---------- SVG (2D dice in the tray, steppers and result card) ----------
  const SHAPES = {
    d6: '<rect x="4" y="4" width="40" height="40" rx="7"/>',
    d8: '<polygon points="24,1.5 46.5,24 24,46.5 1.5,24"/>',
    d12: '<polygon points="24,2 43.5,13 43.5,35 24,46 4.5,35 4.5,13"/>',
  };
  function dieSVG(type, face, label) {
    const d = DICE[type];
    const syms = face ? [...face] : [];
    const size = syms.length > 1 ? 15 : 20;
    const xs = syms.length > 1 ? [24 - size - 0.5, 24 + 0.5] : [24 - size / 2];
    const glyphs = syms.map((s, i) => `<use href="#sym-${s}" x="${xs[i]}" y="${24 - size / 2}" width="${size}" height="${size}"/>`).join("");
    const title = label || `${d.name} die${face ? ": " + syms.map((s) => SYM_NAME[s]).join(", ") : face === "" ? ": blank" : ""}`;
    return `<svg viewBox="0 0 48 48" role="img" aria-label="${title}"><g fill="${d.color}" stroke="var(--die-stroke)" stroke-width="1.5">${SHAPES[d.shape]}</g><g style="color:${d.ink}">${glyphs}</g></svg>`;

,"page":108},"setting":"android","id":"geno-sculpted-physique-android","kind":"gear","rarity":5,"price":800,"text":"A body designed to be striking. People notice you and want to listen."},{"group":"Tools and General Gear","encumbrance":1,"name":"Handheld Scanner","source":{"book":"sotb","page":101},"setting":"android","id":"handheld-scanner-android","kind":"gear","rarity":2,"price":100,"text":"A palm sensor that reads what's around you: life signs, chemicals, energy, hidden devices."},{"group":"Meds and Drugs","encumbrance":0,"name":"Happy Patch","source":{"book":"sotb","page":101},"setting":"android","id":"happy-patch-android","kind":"gear","rarity":1,"price":10,"text":"A cheap stick-on mood lifter. Takes the edge off a bad day, and some people use one every day."},{"group":"Clandestine and Black Ops","encumbrance":1,"name":"Infiltrator Goggles","source":{"book":"sotb","page":101},"setting":"android","id":"infiltrator-goggles-android","kind":"gear","rarity":6,"price":300,"text":"Low-light and thermal vision in one set of goggles, for seeing what's in the dark."},{"group":"Tools and General Gear","encumbrance":1,"name":"Las-Scanner","source":{"book":"sotb","page":101},"setting":"android","id":"las-scanner-android","kind":"gear","rarity":4,"price":170,"text":"A laser scanner that maps a space or an object into a precise 3D model."},{"group":"Carrying and Storage","encumbrance":0,"name":"Load-Bearing Gear","source":{"book":"sotb","page":101},"setting":"android","encumbrance-bonus":3,"id":"load-bearing-gear-android","kind":"gear","rarity":3,"price":45,"text":"Straps, webbing and pouches that spread a load across your body so you can carry more."},{"group":"Clandestine and Black Ops","encumbrance":1,"name":"Lockbreaker","source":{"book":"sotb","page":101},"setting":"android","id":"lockbreaker-android","kind":"gear","rarity":5,"price":125,"text":"An electronic tool that cracks maglocks and keypads, if you know how to use it."},{"group":"Clandestine and Black Ops","encumbrance":1,"name":"Lockpick Set","source":{"book":"sotb","page":101},"setting":"android","id":"lockpick-set-android","kind":"gear","rarity":5,"price":75,"text":"Picks and tension tools for old-fashioned mechanical locks, which are still everywhere."},{"group":"Meds and Drugs","encumbrance":0,"name":"Low-Fi","source":{"book":"sotb","page":101},"setting":"android","id":"low-fi-android","kind":"gear","rarity":2,"price":50,"text":"A downer that dulls the senses and quiets the noise in your head."},{"group":"Carrying and Storage","encumbrance":15,"name":"MAL Container","source":{"book":"sotb","page":101},"setting":"android","id":"mal-container-android","kind":"gear","rarity":8,"price":10000,"text":"A secure, armoured case for carrying something very valuable or very dangerous. Priced like it."},{"group":"Tools and General Gear","encumbrance":5,"name":"Makerbox","source":{"book":"sotb","page":101},"setting":"android","id":"makerbox-android","kind":"gear","rarity":6,"price":1000,"text":"A portable fabricator that prints small parts and simple objects from a design file."},{"group":"Tools and General Gear","encumbrance":1,"name":"Micro-Welder","source":{"book":"sotb","page":101},"setting":"android","id":"micro-welder-android","kind":"gear","rarity":2,"price":80,"text":"A pen-sized welder for delicate electronics and small mechanical fixes."},{"group":"Carrying and Storage","encumbrance":0,"name":"Modular Backpack","source":{"book":"sotb","page":101},"setting":"android","encumbrance-bonus":5,"id":"modular-backpack-android","kind":"gear","rarity":3,"price":100,"text":"A large pack with clip-on pouches, built for carrying a lot over a long way."},{"group":"Computers and Computer Accessories","encumbrance":0,"name":"Monocam","source":{"book":"sotb","page":101},"setting":"android","id":"monocam-android","kind":"gear","rarity":2,"price":120,"text":"A tiny camera you can stick anywhere and watch through from your PAD."},{"group":"Cybernetics","encumbrance":null,"name":"Neuro-Regulator","source":{"book":"sotb","page":108},"setting":"android","id":"neuro-regulator-android","kind":"gear","rarity":6,"price":1500,"text":"An implant that keeps your mind steady under pressure. Some say it makes you a little colder."},{"group":"G-Mods","encumbrance":null,"name":"Nighteyes","source":{"book":"sotb","page":108},"setting":"android","id":"nighteyes-android","kind":"gear","rarity":6,"price":800,"text":"A gene-tweak that lets you see in near-darkness. Bright light is harder on your eyes."},{"group":"Tools and General Gear","encumbrance":1,"name":"O2 Bottle","source":{"book":"sotb","page":101},"setting":"android","id":"o2-bottle-android","kind":"gear","rarity":2,"price":35,"text":"A small air supply for smoke, gas or a breach. Lasts minutes, not hours."},{"group":"Computers and Computer Accessories","encumbrance":1,"name":"PAD","source":{"book":"sotb","page":101},"setting":"android","id":"pad-android","kind":"gear","rarity":2,"price":200,"text":"Your personal data device: phone, wallet, ID and window onto the Network in one."},{"group":"Cybernetics","encumbrance":null,"name":"Pain Editor","source":{"book":"sotb","page":108},"setting":"android","id":"pain-editor-android","kind":"gear","rarity":6,"price":400,"text":"An implant that shuts off pain when you need to keep going. Your body still keeps the score."},{"encumbrance":0,"name":"Painkiller","source":{"book":"crb","page":94},"setting":"general","id":"painkiller","kind":"gear","rarity":2,"price":25,"text":"A dose of medicine that dulls pain and gets you back on your feet after a hit."},{"group":"Comms","encumbrance":0,"name":"Personal Comlink","source":{"book":"sotb","page":101},"setting":"android","id":"personal-comlink-android","kind":"gear","rarity":4,"price":25,"text":"A short-range earpiece for keeping in touch with your crew."},{"group":"Meds and Drugs","encumbrance":3,"name":"Portable Clinic Kit","source":{"book":"sotb","page":101},"setting":"android","id":"portable-clinic-kit-android","kind":"gear","rarity":4,"price":700,"text":"A full medical kit for real treatment away from a hospital: surgery tools, drugs, monitors."},{"group":"Computers and Computer Accessories","encumbrance":3,"name":"Portable Rig","source":{"book":"sotb","page":101},"setting":"android","id":"portable-rig-android","kind":"gear","rarity":5,"price":750,"text":"A netrunning computer small enough to carry. Less power than a big rig, but it goes where you go."},{"group":"Tools and General Gear","encumbrance":4,"name":"Portable Toolkit","source":{"book":"sotb","page":101},"setting":"android","id":"portable-toolkit-android","kind":"gear","rarity":2,"price":200,"text":"A compact set of tools for fixing machines, vehicles and electronics on the job."},{"group":"Computers and Computer Accessories","encumbrance":0,"name":"Reader","source":{"book":"sotb","page":101},"setting":"android","id":"reader-android","kind":"gear","rarity":2,"price":175,"text":"A slim screen for reading and showing files without exposing your PAD."},{"group":"Tools and General Gear","encumbrance":1,"name":"Respirator","source":{"book":"sotb","page":101},"setting":"android","id":"respirator-android","kind":"gear","rarity":1,"price":40,"text":"A mask that filters smoke, dust and gas. Not for vacuum."},{"encumbrance":1,"name":"Rope","source":{"book":"crb","page":94},"setting":"general","id":"rope","kind":"gear","rarity":1,"price":5,"text":"A length of strong rope. Never has anyone regretted bringing it."},{"group":"Tools and General Gear","encumbrance":1,"name":"Rope","source":{"book":"sotb","page":101},"setting":"android","id":"rope-android","kind":"gear","rarity":1,"price":5,"text":"A length of synthetic rope. Light, strong, and endlessly useful."},{"group":"Cybernetics","encumbrance":null,"name":"Skulljack","source":{"book":"sotb","page":108},"setting":"android","id":"skulljack-android","kind":"gear","rarity":5,"price":1250,"text":"A port in your skull that links your brain straight to a computer. For netrunners who want nothing between them and the machine."},{"group":"Meds and Drugs","encumbrance":0,"name":"Slap-Patch","source":{"book":"sotb","page":101},"setting":"android","id":"slap-patch-android","kind":"gear","rarity":2,"price":25,"text":"A stick-on medical patch that stabilizes you after a wound."},{"group":"Computers and Computer Accessories","encumbrance":1,"name":"Smartspecs","source":{"book":"sotb","page":101},"setting":"android","id":"smartspecs-android","kind":"gear","rarity":3,"price":90,"text":"Glasses with a heads-up display for messages, maps and data from your PAD."},{"group":"Clandestine and Black Ops","encumbrance":0,"name":"Snap-Locks","source":{"book":"sotb","page":101},"setting":"android","id":"snap-locks-android","kind":"gear","rarity":3,"price":5,"text":"Disposable restraints that lock with a snap. For prisoners, or for securing a door fast."},{"group":"Tools and General Gear","encumbrance":6,"name":"Space Suit","source":{"book":"sotb","page":101},"setting":"android","id":"space-suit-android","kind":"gear","rarity":3,"price":500,"text":"A pressurized suit for working in vacuum. Essential on the Beanstalk, the Moon or a hull walk."},{"group":"Cybernetics","encumbrance":null,"name":"Spinal Modem","source":{"book":"sotb","page":108},"setting":"android","restricted":true,"id":"spinal-modem-android","kind":"gear","rarity":7,"price":1350,"text":"A computer built into your spine, always connected. You're never offline, which cuts both ways."},{"group":"Meds and Drugs","encumbrance":0,"name":"Stim","source":{"book":"sotb","page":101},"setting":"android","id":"stim-android","kind":"gear","rarity":1,"price":5,"text":"A quick chemical jolt to stay awake and alert, with a crash later."},{"group":"Meds and Drugs","encumbrance":0,"name":"Sting","source":{"book":"sotb","page":101},"setting":"android","id":"sting-android","kind":"gear","rarity":3,"price":50,"text":"A recreational drug with a sharp, short high. Cheap on the street."},{"group":"Cybernetics","encumbrance":null,"name":"Sub-Dermal Armor","source":{"book":"sotb","page":108},"setting":"android","id":"sub-dermal-armor-android","kind":"gear","rarity":5,"price":1000,"text":"Armour plating under the skin. It's always on, and nobody can see it."},{"group":"G-Mods","encumbrance":null,"name":"Tooth Buds","source":{"book":"sotb","page":108},"setting":"android","id":"tooth-buds-android","kind":"gear","rarity":6,"price":600,"text":"Sharp, reinforced teeth that bite like a weapon. They do make a first impression."},{"group":"G-Mods","encumbrance":null,"name":"Toxin Filters","source":{"book":"sotb","page":108},"setting":"android","id":"toxin-filters-android","kind":"gear","rarity":6,"price":400,"text":"Modified organs that clear poisons and drugs from your blood faster."},{"group":"Carrying and Storage","encumbrance":0,"name":"Utility Belt","source":{"book":"sotb","page":101},"setting":"android","encumbrance-bonus":2,"id":"utility-belt-android","kind":"gear","rarity":1,"price":20,"text":"A belt of pouches and clips for keeping small tools at hand."}],"obligation-types":[{"id":"addiction","name":"Addiction","kind":"secret","roll":[61,70],"text":"A habit you hide, and a supplier who knows it.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"betrayal","name":"Betrayal","kind":"secret","roll":[71,80],"text":"You sold someone out, and they may be alive.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"blackmail","name":"Blackmail","kind":"secret","roll":[1,10],"text":"Someone has proof of what you did and wants something for it.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"bounty","name":"Bounty","kind":"obligation","roll":[41,50],"text":"There's a price on you, legal or otherwise.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"corporate-contract","name":"Corporate Contract","kind":"obligation","roll":[91,100],"text":"Your body, skills or future belong to a corp on paper.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"criminal-record","name":"Criminal Record","kind":"secret","roll":[81,90],"text":"A name, a face, a record you've buried.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"debt","name":"Debt","kind":"obligation","roll":[11,20],"text":"You owe a corp or a person, and they will collect.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"family-duty","name":"Family Duty","kind":"obligation","roll":[21,30],"text":"Kin depend on you, or expect you to take a role you never chose.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"forbidden-knowledge","name":"Forbidden Knowledge","kind":"secret","roll":[31,40],"text":"You know something a corp would kill to keep buried.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}},{"id":"oath","name":"Oath","kind":"obligation","roll":[51,60],"text":"You swore to see something through.","source":{"book":"house","doc":"docs/house-rules.md#secrets-and-obligations"}}],"motivations":[{"id":"strength-adaptable","type":"Strength","name":"Adaptable","roll":[0,10],"text":"No matter what life throws at your character, they always rise to the challenge. Your character is flexible and can handle nearly every situation, no matter how grim or strange the circumstances.","source":{"book":"crb","page":49}},{"id":"desire-ambition","type":"Desire","name":"Ambition","roll":[0,10],"text":"Your character craves power and authority over others. The character may pursue privilege, social status, or rank to achieve this goal.","source":{"book":"crb","page":47}},{"id":"strength-analytical","type":"Strength","name":"Analytical","roll":[11,20],"text":"Your character\u2019s mind is like a computer, able to absorb a barrage of information and come to a logical conclusion. Your solutions always have the inarguable weight of reason, and you know how to pick your battles and when to bide your time.","source":{"book":"crb","page":49}},{"id":"flaw-anger","type":"Flaw","name":"Anger","roll":[0,10],"text":"Your character lashes out at themself or others with undue cause or with extreme force. They are quick to resort to physical force to solve their problems.","source":{"book":"crb","page":50}},{"id":"desire-belonging","type":"Desire","name":"Belonging","roll":[11,20],"text":"Your character seeks to be liked by others and goes out of the way to make a good impression. Your character seeks to be accepted by a community or faction.","source":{"book":"crb","page":47}},{"id":"fear-change","type":"Fear","name":"Change","roll":[0,10],"text":"Your character finds routine and stability comforting, and fears changes that could upend their day-to-day routine.","source":{"book":"crb","page":48}},{"id":"fear-commitment","type":"Fear","name":"Commitment","roll":[11,20],"text":"The idea of making promises or being relied on scares your character, who hates the idea that someone else is relying on them. This fear of commitment could manifest in relationships, on the job, or among family.","source":{"book":"crb","page":48}},{"id":"flaw-compulsion","type":"Flaw","name":"Compulsion","roll":[11,20],"text":"This could be addiction, fascination, obsession, or another automatic behavior that is self-destructive or otherwise impedes your character\u2019s ability to function and be healthy.","source":{"book":"crb","page":50}},{"id":"strength-courageous","type":"Strength","name":"Courageous","roll":[21,30],"text":"Fear has no place in your character\u2019s heart. They laugh at danger and gladly push themself to confront what others flee from. Note that your character probably still has a Fear Motivation. It\u2019s up to you whether that Fear is the one thing that can undo your character\u2019s courage, or if this Strength pushes them to confront the source of their Fear no matter what.","source":{"book":"crb","page":49}},{"id":"strength-curious","type":"Strength","name":"Curious","roll":[31,40],"text":"Life is a million mysteries, and your character wants to learn about every one. Whether curiosity drives them to meet new people, explore distant locales, or learn fantastic new truths and ideas is up to you.","source":{"book":"crb","page":49}},{"id":"fear-death","type":"Fear","name":"Death","roll":[21,30],"text":"The fear of death is deep and primal, and it drives a lot of our behaviors. There are a large number of ways this could manifest in your character, many of them similar to what you see in real life.","source":{"book":"crb","page":48}},{"id":"flaw-deception","type":"Flaw","name":"Deception","roll":[21,30],"text":"Your character may be disloyal or a compulsive liar. They are concerned with their own wellbeing first and foremost, and they might always present themselves in the best possible light even when that isn\u2019t the case.","source":{"book":"crb","page":50}},{"id":"desire-expertise","type":"Desire","name":"Expertise","roll":[21,30],"text":"Your character wants to excel in a chosen field or skill. To achieve perfection, your character practices constantly.","source":{"book":"crb","page":47}},{"id":"fear-expression","type":"Fear","name":"Expression","roll":[31,40],"text":"Your character has some behavior or means of expressing themself privately that they do not want the world to know about. The nature of that behavior is up to you. Keep the setting in mind when you come up with it, though.","source":{"book":"crb","page":48}},{"id":"fear-failure","type":"Fear","name":"Failure","roll":[41,50],"text":"Most people dislike failure, but some actively fear it. That fear may drive them to try to become absolutely perfect, or it may crush them into inaction. Maybe it does both.","source":{"book":"crb","page":48}},{"id":"desire-fame","type":"Desire","name":"Fame","roll":[31,40],"text":"Your character seeks the limelight and wants to be famous. They pursue anything that can garner attention and praise.","source":{"book":"crb","page":47}},{"id":"flaw-greed","type":"Flaw","name":"Greed","roll":[31,40],"text":"Your character is never satisfied with what they have, always wanting more. They are willing to flout the law or infringe upon others\u2019 rights in order to get what they want.","source":{"book":"crb","page":50}},{"id":"fear-humiliation","type":"Fear","name":"Humiliation","roll":[51,60],"text":"Characters who are especially concerned with how others view them are particularly sensitive to potential humiliation. They go out of their way to avoid ever appearing wrong or foolish, even if that means missing out on exciting opportunities and experiences.","source":{"book":"crb","page":48}},{"id":"strength-idealistic","type":"Strength","name":"Idealistic","roll":[41,50],"text":"What ideals your character believes in are up to you, but to your character, those ideals are nothing short of sacred. Your character may feel that everyone should live up to those same ideals (and may be disappointed when people don\u2019t), or they may be content to meet the standards they have set for themself.","source":{"book":"crb","page":49}},{"id":"flaw-ignorance","type":"Flaw","name":"Ignorance","roll":[51,60],"text":"Your character lacks a basic knowledge base or understanding of a society\u2019s norms. This may be due to your character\u2019s upbringing or their recent travel to another area of the world. This could be more than just being \u201Cuneducated\u201D; at some level, your character may be willfully ignorant.","source":{"book":"crb","page":50}},{"id":"strength-independent","type":"Strength","name":"Independent","roll":[51,60],"text":"When everyone else has failed or fallen, your character knows they can still count on themself. Your character may get along with others just fine but makes sure not to rely on others. That way, when things go wrong, your character is always prepared to deal with the situation and isn\u2019t waiting for someone else to help.","source":{"book":"crb","page":49}},{"id":"flaw-intolerance","type":"Flaw","name":"Intolerance","roll":[61,70],"text":"For whatever reason, your character harbors some prejudices toward a group of people. These may be relatively \u201Cminor\u201D biases, or they may give rise to an intense emotion of hatred or revulsion. Whatever form it takes, remember that intolerance is based more in emotion than rationality.","source":{"book":"crb","page":50}},{"id":"fear-isolation","type":"Fear","name":"Isolation","roll":[61,70],"text":"Your character fears being isolated from other people and being doomed to live and die alone. Maybe this drives them to seek out relationships with anyone and everyone, even when a relationship is unpleasant or unhealthy.","source":{"book":"crb","page":48}},{"id":"desire-justice","type":"Desire","name":"Justice","roll":[41,50],"text":"Your character believes in a set of ethics that demands fair treatment for all. Your character is dedicated to righting inequality and protecting others\u2019 rights.","source":{"book":"crb","page":47}},{"id":"desire-knowledge","type":"Desire","name":"Knowledge","roll":[51,60],"text":"Your character wishes to uncover knowledge that may have been lost, forgotten, or locked away. This information could pertain to the world, or it could pertain to your character\u2019s past or origins.","source":{"book":"crb","page":47}},{"id":"flaw-laziness","type":"Flaw","name":"Laziness","roll":[41,50],"text":"Your character always seeks the path of least resistance and becomes intimidated by difficult or complex tasks.","source":{"book":"crb","page":50}},{"id":"desire-love","type":"Desire","name":"Love","roll":[61,70],"text":"Your character seeks romantic affection and intimacy from another character. Your character might already have a true love or may strive to find someone to love and be loved by.","source":{"book":"crb","page":47}},{"id":"fear-nemesis","type":"Fear","name":"Nemesis","roll":[71,80],"text":"Your character has a deadly foe, someone they fear (even if they don\u2019t admit it). The nature of this enemy is up to you, but we suggest you consult with your GM. After all, your GM surely wants to bring this up in the game!","source":{"book":"crb","page":48}},{"id":"fear-obscurity","type":"Fear","name":"Obscurity","roll":[81,90],"text":"Your character wishes to be remembered after they are gone and works tirelessly to secure their legacy.","source":{"book":"crb","page":48}},{"id":"strength-patient","type":"Strength","name":"Patient","roll":[61,70],"text":"Your character is always willing to wait and knows the power of being calm. By waiting for the right opportunity, your character avoids all manner of unpleasant and dangerous situations. However, when such an opportunity presents itself, your character acts swiftly and decisively.","source":{"book":"crb","page":49}},{"id":"fear-poverty","type":"Fear","name":"Poverty","roll":[91,100],"text":"For your character, it\u2019s all about wealth and security. They fear being without, and they work hard to amass money, supplies, and other valuable items to ensure their status.","source":{"book":"crb","page":48}},{"id":"flaw-pride","type":"Flaw","name":"Pride","roll":[71,80],"text":"Pride does not always have to be a Flaw, but it can easily become one. Your character is arrogant, vain, or self-absorbed, or thinks highly of themself at the expense of others.","source":{"book":"crb","page":50}},{"id":"flaw-recklessness","type":"Flaw","name":"Recklessness","roll":[81,90],"text":"Your character shows little regard for how their actions may affect themself or others, due either to low self- esteem or lack of forethought. They are especially prone to dangerous or inconsiderate actions.","source":{"book":"crb","page":50}},{"id":"desire-safety","type":"Desire","name":"Safety","roll":[71,80],"text":"Your character values peace and comfort above all else. Perhaps they seek shelter, a steady source of food, or other material necessities, or they might seek emotional security in a place free from oppression and abuse.","source":{"book":"crb","page":47}},{"id":"strength-spiritual","type":"Strength","name":"Spiritual","roll":[71,80],"text":"It doesn\u2019t matter so much what your character believes in: that depends a lot on your game\u2019s setting. What\u2019s important is that your character believes. Their belief gives them a solid mental bedrock they can always rely on.","source":{"book":"crb","page":49}},{"id":"flaw-timid","type":"Flaw","name":"Timid","roll":[91,100],"text":"Your character is extremely risk averse, opting instead to take more thorough or tried-and-true approaches. They may take too long to act or may be unable to act at all in the face of new or intimidating challenges.","source":{"book":"crb","page":50}},{"id":"desire-vengeance","type":"Desire","name":"Vengeance","roll":[81,90],"text":"Someone or something wronged your character in the past, and the character has sworn to exact revenge against the aggrieving party.","source":{"book":"crb","page":47}},{"id":"desire-wealth","type":"Desire","name":"Wealth","roll":[91,100],"text":"Money or material possessions are the prime goal for your character. Your character may be active in business, trade, or the tried-and-true method of theft to increase their net worth.","source":{"book":"crb","page":47}},{"id":"strength-wise","type":"Strength","name":"Wise","roll":[81,90],"text":"Through years of experience and countless events, your character has developed that rare quality: wisdom. The wise understand the truths of how their world works. Just as importantly, they know that sometimes, with the right effort, those truths can be overcome.","source":{"book":"crb","page":49}},{"id":"strength-witty","type":"Strength","name":"Witty","roll":[91,100],"text":"Your character is extremely clever, with the right joke for a friend and the perfect insult for a foe. Some may love their company, while others loathe their cutting remarks, but none can deny that your character has the sharpest tongue around.","source":{"book":"crb","page":49}}],"item-qualities":[{"id":"accurate","name":"Accurate","activation":"passive","ranked":true,"text":"Accurate weapons are easier to aim or wield, whether through design or technology. For each level of this quality, the attacker adds [boost] to their combat checks while using this weapon.","source":{"book":"crb","page":86}},{"id":"auto-fire","name":"Auto-Fire","activation":"active","ranked":false,"text":"A weapon with Auto-fire can be set to shoot in rapid succession and potentially spray an area with bolts, flechettes, slugs, or other types of projectiles. The advantage in using Auto-fire is that it has the chance to hit multiple targets or to hit a single target multiple times. As attacking with a weapon on Auto-fire is generally less accurate, the attacker must increase the difficulty of the combat check by [difficulty]. The user may choose not to use the Auto-fire quality on a weapon; in this case, they cannot trigger the quality but also do not suffer the aforementioned penalty.","source":{"book":"crb","page":86}},{"id":"blast","name":"Blast","activation":"active","ranked":true,"text":"The weapon has a large spread, an explosive blast, or a similar area of effect, like a detonated grenade or a warhead fired from a missile launcher. If the attack is successful and Blast activates, each character (friend or foe) engaged with the original target suffers a hit dealing damage equal to the Blast quality\u2019s rating, plus damage equal to the total [success] scored on the check. In a relatively small and enclosed area, the Game Master might decide that everyone in the room suffers damage. If the Blast quality doesn\u2019t activate, the ordnance still detonates, but bad luck or poor aim on the part of the firer (or quick reactions on the part of the targets) means the explosion may not catch anyone else in its radius. However, the user may also trigger Blast if the attack misses by spending [advantage] [advantage] [advantage]. In this case, the original target and every target engaged with the original target suffers a hit dealing damage equal to the Blast rating of the weapon.","source":{"book":"crb","page":86}},{"id":"breach","name":"Breach","activation":"passive","ranked":true,"text":"Weapons with Breach burn through the toughest armor; they are often heavy weapons or weapons mounted on some sort of vehicle. Hits from weapons with the Breach quality ignore one point of vehicle armor for every rating of Breach (meaning they also ignore 10 soak for every rating of Breach).","source":{"book":"crb","page":87}},{"id":"burn","name":"Burn","activation":"active","ranked":true,"text":"Weapons with Burn inflict damage over time. When Burn is triggered, one target hit by the attack continues to suffer the weapon\u2019s base damage each round for a number of rounds equal to the weapon\u2019s Burn rating. Apply damage at the start of each of the target\u2019s turns. If multiple targets suffer hits from a weapon with Burn, the quality may be triggered multiple times, affecting a different target each time. A victim might be able to stop the damage by performing an action to roll around and make a Coordination check. The difficulty is Average ([difficulty] [difficulty]) on hard surfaces such as the floor of a building, or an Easy ([difficulty]) on grass or soft ground. Jumping into a body of water stops the damage immediately. Both situations assume the flame is from actual combustion rather than a chemical reaction. With the latter, there is usually little the victim can do.","source":{"book":"crb","page":87}},{"id":"concussive","name":"Concussive","activation":"active","ranked":true,"text":"The weapon\u2019s attack can leave the target shell-shocked from mighty blows or punishing shock waves, unable to perform any but the most basic actions. When Concussive is triggered, one target hit by the attack is staggered (see page 114) for a number of rounds equal to the weapon\u2019s Concussive rating. A staggered target cannot perform actions. If multiple targets suffer hits from a weapon with Concussive, the quality may be triggered multiple times, affecting a different target each time.","source":{"book":"crb","page":87}},{"id":"cumbersome","name":"Cumbersome","activation":"passive","ranked":true,"text":"A Cumbersome weapon is large, unwieldy, awkward, or heavy. To wield a Cumbersome weapon properly, the character needs a Brawn characteristic equal to or greater than the weapon\u2019s Cumbersome rating. For each point of Brawn by which the character is deficient, they must increase the difficulty of all checks made while using the weapon by one.","source":{"book":"crb","page":87}},{"id":"defensive","name":"Defensive","activation":"passive","ranked":true,"text":"An item with the Defensive quality increases the user\u2019s melee defense by its Defensive rating.","source":{"book":"crb","page":87}},{"id":"deflection","name":"Deflection","activation":"passive","ranked":true,"text":"An item with the Deflection quality increases the user\u2019s ranged defense by its Deflection rating.","source":{"book":"crb","page":87}},{"id":"disorient","name":"Disorient","activation":"active","ranked":true,"text":"A weapon with Disorient can daze an opponent. When Disorient is triggered, one target hit by the attack is disoriented (see page 114) for a number of rounds equal to the weapon\u2019s Disorient rating. A disoriented target adds [setback] to all skill checks they perform. If multiple targets suffer hits from a weapon with Disorient, the quality may be triggered multiple times, affecting a different target each time.","source":{"book":"crb","page":87}},{"id":"ensnare","name":"Ensnare","activation":"active","ranked":true,"text":"A weapon with Ensnare binds a foe and restricts their movements. When Ensnare is triggered, one target hit by the attack becomes immobilized (see page 114) for a number of rounds equal to the weapon\u2019s Ensnare rating. An immobilized target cannot perform maneuvers. If multiple targets suffer hits from a weapon with Ensnare, the quality may be triggered multiple times, affecting a different target each time. An Ensnared target may perform an action to attempt a Hard ([difficulty] [difficulty] [difficulty]) Athletics check on their turn to break free from the effect.","source":{"book":"crb","page":87}},{"id":"guided","name":"Guided","activation":"active","ranked":true,"text":"A weapon with the Guided quality can track opponents. The Guided quality can only be triggered if an attack misses. If Guided is triggered, the controlling character may make a combat check at the end of the round as an out-of-turn incidental. The difficulty of this combat check is Average ([difficulty] [difficulty]); instead of building the ability of the pool normally, add [ability] equal to the weapon\u2019s Guided rating. If the check is successful, the weapon strikes the target, and the attack is resolved normally. Guided requires [advantage] [advantage] [advantage] to activate, unless otherwise specified in the weapon\u2019s description. The Guided quality can activate on any subsequent combat check it makes, representing the projectile continuing to track the target.","source":{"book":"crb","page":87}},{"id":"inaccurate","name":"Inaccurate","activation":"passive","ranked":true,"text":"Inaccurate weapons are less likely to be accurate or precise. When making an attack with an Inaccurate weapon, add [setback] to the check equal to the Inaccurate rating.","source":{"book":"crb","page":87}},{"id":"inferior","name":"Inferior","activation":"passive","ranked":false,"text":"An Inferior item is a lackluster example of its kind, representing shoddy and poor craftsmanship. An Inferior item generates automatic [threat] on all checks related to its use.","source":{"book":"crb","page":88}},{"id":"knockdown","name":"Knockdown","activation":"active","ranked":false,"text":"When Knockdown is triggered, one target hit by the attack is knocked prone. If multiple targets suffer hits from a weapon with Knockdown, the quality may be triggered multiple times, affecting a different target each time. Unless specified otherwise, Knockdown requires [advantage] [advantage] to trigger, plus one additional [advantage] per silhouette of the target beyond 1.","source":{"book":"crb","page":88}},{"id":"limited-ammo","name":"Limited Ammo","activation":"passive","ranked":true,"text":"Some weapons fire particularly large or complex projectiles that cost lots of money. Other weapons are expendable weapons like grenades that, once used, are destroyed. A weapon with the Limited Ammo quality may be used to make a number of attacks equal to its Limited Ammo rating before it must be reloaded with a maneuver. In addition, each shot expends one of a limited number of rounds of ammo; more ammo must be purchased or obtained before anyone fires the weapon again. This also applies to grenades and other \u201Cone-use\u201D weapons that have the Limited Ammo 1 quality (here, your character is not \u201Creloading\u201D the grenade, but drawing another to use\u2014mechanically, they are equivalent).","source":{"book":"crb","page":88}},{"id":"linked","name":"Linked","activation":"active","ranked":true,"text":"Some weapons are designed to fire together at the same target (turrets housing multiple guns are a good example of this). When a character fires a linked weapon, on a successful attack, the weapon deals one hit. The wielder may spend [advantage] [advantage] to gain an additional hit, and may do so a number of times equal to the weapon\u2019s Linked rating. Additional hits from the Linked weapon may only be applied against the original target. Each hit deals the weapon\u2019s base damage plus damage equal to the [success] scored on the check.","source":{"book":"crb","page":88}},{"id":"pierce","name":"Pierce","activation":"passive","ranked":true,"text":"Any hits from this weapon ignore a number of points point of soak equal to the weapon\u2019s Pierce rating. If the weapon has more ranks of Pierce than the target\u2019s total soak, it completely ignores the target\u2019s soak. For example, Pierce 3 against a soak of 2 ignores two points of soak, but the extra point of Pierce has no further effect.","source":{"book":"crb","page":88}},{"id":"prepare","name":"Prepare","activation":"passive","ranked":true,"text":"Items with this quality require time to set up before being used. The user must perform a number of preparation maneuvers equal to the item\u2019s Prepare rating before using the item (if the item is a weapon, \u201Cusing\u201D it would be making attacks with the weapon). At your GM\u2019s discretion, moving with the item, being knocked prone with the item, or other disruptions may require the user to perform the preparation maneuvers again before using the item.","source":{"book":"crb","page":88}},{"id":"reinforced","name":"Reinforced","activation":"passive","ranked":false,"text":"Weapons or items with the Reinforced quality are immune to the Sunder quality. Armor with the Reinforced quality make the wearer\u2019s soak immune to the Pierce and Breach qualities.","source":{"book":"crb","page":88}},{"id":"slow-firing","name":"Slow-Firing","activation":"passive","ranked":true,"text":"Slow-Firing weapons tend to deal incredible damage, but need time to recharge or cool down between shots. A weapon\u2019s Slow-Firing rating dictates the number of rounds that must pass before the weapon can be fired again after attacking. For example, a heavy laser cannon with Slow-Firing 2 must wait two rounds after being fired before it can be fired again.","source":{"book":"crb","page":88}},{"id":"stun","name":"Stun","activation":"active","ranked":true,"text":"A weapon with Stun can deal strain to the target. When the Stun quality is activated, it inflicts strain equal to the weapon\u2019s Stun rating. Since this is strain, and not strain damage, it is not reduced by the target\u2019s soak.","source":{"book":"crb","page":88}},{"id":"stun-damage","name":"Stun Damage","activation":"passive","ranked":false,"text":"A weapon with this quality can only deal strain damage (damage applied to the target\u2019s strain threshold). Because this is strain damage, not strain, it is still reduced by a target\u2019s soak.","source":{"book":"crb","page":88}},{"id":"sunder","name":"Sunder","activation":"active","ranked":false,"text":"When activating Sunder, the attacker chooses one item openly wielded by the target (such as a weapon, shield, or item on a belt). That item is damaged one step: to minor if undamaged, from minor to moderate, or from moderate to major. If an item already suffering major damage is the target of a successful Sunder, it is destroyed. Sunder requires [advantage] to activate, and may be activated even if the attack is unsuccessful. Sunder may be activated multiple times in the same attack, but each activation must be applied to the same item, potentially taking it from undamaged to destroyed in a single attack.","source":{"book":"crb","page":88}},{"id":"superior","name":"Superior","activation":"passive","ranked":false,"text":"A Superior item is a sterling example of its kind, representing masterful craftsmanship. A Superior item generates automatic [advantage] on all checks related to its use.","source":{"book":"crb","page":88}},{"id":"tractor","name":"Tractor","activation":"passive","ranked":true,"text":"Instead of firing searing beams of laser fire or crackling ion discharges, this weapon fires relatively harmless electromagnetic beams that ensnare ships and hold them fast in space. Tractor beams, like all weapons, are fired at their target using the appropriate skill check with all suitable modifiers. Once the weapon hits its target, the target may not move unless its pilot makes a successful Piloting check with a difficulty equal to the tractor beam\u2019s rating. If the target is an individual character, the character is immobilized while the beam is active. (Weapons with the Tractor quality are only going to show up in sci-fi settings, and probably only the more fanciful sci-fi settings! However, they are such a staple in those settings that we included the quality here.)","source":{"book":"crb","page":89}},{"id":"unwieldy","name":"Unwieldy","activation":"passive","ranked":true,"text":"An Unwieldy weapon is a weapon that can be particularly awkward to use for those without impressive dexterity and hand-eye coordination. To wield an Unwieldy weapon properly, the character needs an Agility characteristic equal to or greater than the weapon\u2019s Unwieldy rating. For each point of Agility by which the character is deficient, they must increase the difficulty of all checks made while using the weapon by one.","source":{"book":"crb","page":89}},{"id":"vicious","name":"Vicious","activation":"passive","ranked":true,"text":"When an attack with this weapon results in a Critical Injury or Hit, the character adds ten times the Vicious rating to the Critical roll. With Vicious 3, for example, you would add +30 to the resulting Critical Injury or Hit result.","source":{"book":"crb","page":89}}],"talents":[{"tier":3,"name":"Animal Companion","settings":"You should use this talent in all settings.","source":{"book":"crb","page":77},"ranked":true,"activation":"Passive","id":"animal-companion","text":"Your character creates a bond with a single animal approved by your GM. This animal must be silhouette 0 (no larger than a mid-sized dog). The bond persists as long as your character chooses, although at your GM\u2019s discretion, the bond may also be broken due to abusive treatment or other extenuating circumstances. As long as the bond persists, the animal follows your character, and you dictate the animal\u2019s overall behavior (although, since the animal is only bonded with the character, not dominated, it may still perform inconvenient actions such as scratching furniture, consuming rat
