thing simply by being friendly and appealing. Your character should use Charm here.","Your character has formal authority and issues routine orders, especially outside of combat or other stressful situations. If there is no good reason not to obey your character (and your character has the rank or station to issue orders), other people are simply going to obey most mundane commands automatically."],"name":"Leadership","source":{"book":"crb","page":56},"characteristic":"presence","id":"leadership","use-when":["Your character\u2019s allies are suffering from fear (see page 243), and you want to try to rally them.","Your character tries to convince a crowd of citizens to take political action.","Your character leads troops into battle and wants to make sure they follow your character\u2019s orders.","Your character tries to convince a mob of rioters to stand down and return to their homes."],"text":"While some may follow out of a sense of duty or fear, good leaders inspire their followers through a combination of charisma, bravery, and forceful personality. We represent this quality through the Leadership skill."},{"category":"General","avoid-when":["Your character has just a simple task like refueling a vehicle, hanging a door, or changing the batteries in a flashlight.","Your character wants to program an application for a device. That would require a Computers check."],"name":"Mechanics","source":{"book":"crb","page":60},"characteristic":"intellect","id":"mechanics","use-when":["Your character needs to repair a damaged weapon, vehicle, or other piece of equipment.","Your character needs to identify any parts or tools necessary prior to completing a job. This can save time and money on the project.","Your character has access to a supply of components and tools and wants to design a completely new device.","Your character needs to sabotage an enemy\u2019s vehicle or find a weak point in their defenses.","Your character needs to build an item or modify it.","Your character tries to install and modify cybernetic implants (although if you want, working on a cybernetic implant may require a Medicine and a Mechanics check to represent the fusion of human and machine)."],"text":"The Mechanics skill allows your character to build, disassemble, repair, or modify just about anything mechanical, from a broken radio to a wrecked gyrocopter. In addition, the Mechanics skill is used when salvaging technology, building fortifications, or troubleshooting a malfunctioning water pump, or any time your character needs to swing a hammer or turn a wrench."},{"category":"General","avoid-when":["Your character researches a disease or poison. While studying a disease or poison directly might require Medicine, the act of researching requires a Knowledge check.","Your character tries to heal their own strain at the end of an encounter. Recovering from strain at the end of an encounter requires Discipline or Cool.","Your character tries to administer poison through slight of hand, such as by dropping it in a drinking cup or surreptitiously injecting it into an unsuspecting target. The inherent subterfuge in this activity makes that a Skulduggery check."],"name":"Medicine","source":{"book":"crb","page":61},"characteristic":"intellect","id":"medicine","use-when":["They or another character has suffered wounds, and your character wants to heal those wounds.","Your character tries to counteract or administer a poison.","Your character needs to cure a disease.","Your character creates a new pharmaceutical (or recreational) drug.","They or another character has suffered a Critical Injury, and your character wants to heal it.","Your character performs a complex medical procedure such as surgery, cybernetic augmentation, or psychotherapy. Three final notes: Any one character can only make one attempt to heal a particular Critical Injury per week of game time. Also, any one character can only benefit from one Medicine check per encounter. These limits exist to prevent characters from constantly repeating checks until their patient is in perfect health. Finally, if your character tries to heal themself, they increase the difficulty of the check by two. Hey, it\u2019s a lot harder to set your own broken arm!"],"text":"In the course of their adventures, we expect your character to suffer injuries: everything from cuts and bruises to broken bones and bullet wounds. Medicine gets your character and their friends back on their feet."},{"id":"melee","name":"Melee","category":"Combat","characteristic":"brawn","text":"The Melee skill is what your character uses to fight anyone who\u2019s right in front of them, rather than beyond arm\u2019s reach, when using a weapon. This skill, in its broadest interpretation, covers any sort of hand or melee weapon.","source":{"book":"crb","page":67}},{"category":"Social","avoid-when":["Your character isn\u2019t offering anything in return for what they want. Getting something for nothing is something your character can try to do using other social skills, but Negotiation is predicated on the idea of an exchange.","Your character tells someone what to do. Negotiation has to be a bargain, so at the end of the interactions, the opposing party has agreed to do something, not been ordered to do it.","Your character wants to buy something for a previously established price."],"name":"Negotiation","source":{"book":"crb","page":56},"characteristic":"presence","id":"negotiation","use-when":["Your character tries to purchase goods or services and wants to haggle over the price.","Your character tries to sell goods or services and turn a profit. In this case, your character needs to use Negotiation to raise the price.","Your character attempts to broker a political agreement or treaty between two parties."],"text":"When your character wants to make a deal, they\u2019re going to use Negotiation. If Coercion is threatening someone, Deception is lying to someone, Charm is sweet-talking someone, and Leadership is telling someone what to do, Negotiation is convincing someone to do what you want by giving them something they want in return."},{"category":"General","avoid-when":["Your character performs routine ship maneuvers in open space.","Your character wants to upgrade the engines of the ship. That requires a Mechanics check.","Your character is the captain of a ship and is giving orders. This requires the Leadership skill."],"name":"Operating","source":{"book":"crb","page":62},"characteristic":"intellect","id":"operating","use-when":["Your clipper must safely ride out a storm without losing speed (or a mast).","Your character pilots a zeppelin to slip around the stern of an opponent\u2019s flying fortress.","Your character calculates an orbital slingshot maneuver for their starship.","Your character docks a spaceship with a space station."],"text":"Sometimes, a vehicle is so big that quick reflexes and a steady hand aren\u2019t enough to operate it. When using these sorts of vehicles, for which your character needs training, a sharp mind, and the ability to keep track of a lot of information, your character employs the Operating skill."},{"category":"General","avoid-when":["Your character tries to avoid being surprised during an ambush. Constant, unconscious awareness of your character\u2019s surroundings is a function of the Vigilance skill.","Your character is being lied to, and you\u2019re trying to find out if your character noticed or not. Again, Vigilance is the skill for this situation.","Your character tries to follow a trail or track a foe through the wilderness. The Survival skill covers these activities."],"name":"Perception","source":{"book":"crb","page":62},"characteristic":"cunning","id":"perception","use-when":["Your character wants to search a crime scene for clues.","Your character wants to study the surrounding landscape for possible threats.","Your character conducts surveillance on an unaware target from a distance.","Your character studies an ancient relic, trying to spot any minute details that could reveal its purpose or construction."],"text":"When your character wants to make an active attempt to study their surroundings, notice clues in a crime scene, or search for hidden foes, they use the Perception skill to do so. Perception represents your character\u2019s conscious use of all five senses to observe their environment (or, if you\u2019re playing some sort of alien species, your character may have more than five)."},{"category":"General","avoid-when":["Your character tries to repair a damaged aircraft propeller or engine, a task that calls for the Mechanics skill.","Your character drives a car off a precipice and wants to land with as few fatalities as possible; that\u2019s still Driving (and likely with a pretty high difficulty!)","Your character fires a weapon mounted on a vehicle, which requires a Ranged or Gunnery check.","There is no chance of catastrophic failure when operating the vehicle. Checks are not required for simple tasks like flying in open skies with light wind."],"name":"Piloting","source":{"book":"crb","page":62},"characteristic":"agility","id":"piloting","use-when":["Your character needs to land an airplane with one (or both!) engines out.","Your character tries to outmaneuver opponents in a dogfight.","Your character flies a drop ship through a maze of needle-sharp rock spires to a landing zone.","Your character attempts to land a personal dirigible while under fire from an enemy airship."],"text":"This skill covers the operation of any aerial vehicle that requires reflexes and hand-eye coordination to operate, from gyrocopters and helicopters, to jet fighters and gliders, all the way up to starfighters and spacecapable drop ships. As with the Driving skill, the type of vehicles involved depend on the setting."},{"id":"ranged-heavy","name":"Ranged (Heavy)","category":"Combat","characteristic":"agility","text":"In those same firearm-focused settings, your character uses Ranged (Heavy) to shoot rifles, shotguns, assault rifles, laser rifles, and similar weapons. This skill covers pretty much every heavy ranged weapon designed to be fired while carried in two hands, but not large enough that it requires multiple people or a tripod to use.","source":{"book":"crb","page":69},"variant-of":"ranged"},{"id":"ranged-light","name":"Ranged (Light)","category":"Combat","characteristic":"agility","text":"In settings where your characters do most of their fighting with firearms, your character uses Ranged (Light) to shoot pistols, throw knives, and toss grenades at their opponents. This skill covers pretty much every light ranged weapon designed to be fired (or thrown) from one hand.","source":{"book":"crb","page":68},"variant-of":"ranged"},{"category":"General","avoid-when":["Your character tries to do something that isn\u2019t beyond the limits of normal endurance. Going for a day-long hike wouldn\u2019t call for a Resilience check unless the hike is through the Rocky Mountains in a snowstorm.","Your character immediately stops and rests to recover fully at the end of the activity. If there\u2019s no need to track lasting consequences, there\u2019s no need to make the check."],"name":"Resilience","source":{"book":"crb","page":63},"characteristic":"brawn","id":"resilience","use-when":["Your character tries to go without sleeping for days on end, and you need to see if they stay awake.","Your character ingests a toxin, and you need to see how bad the effects are.","Your character endures a hostile environment (somewhere too hot, too cold, or even too polluted) for days on end.","Your character attempts to recover from a Critical Injury on their own, without medical attention."],"text":"When the going gets tough, the tough rely on their Resilience skill to keep going. Resilience represents your character\u2019s ability to overcome pain and fight through fatigue."},{"category":"General","avoid-when":["Your character attempts to sneak into a location unnoticed. Your character needs to make a Stealth check instead.","Your character attempts to pick someone\u2019s pocket when that person is helpless or incapacitated. This doesn\u2019t require a check at all.","Your character tries to make a poison. Your character needs Medicine to make poisons or toxins, but they do need Skulduggery to use them."],"name":"Skulduggery","source":{"book":"crb","page":64},"characteristic":"cunning","id":"skulduggery","use-when":["Your character attempts to pick someone\u2019s pocket or lift their wallet.","Your character tries to pick a lock or disable a trap. Your character would also use Skulduggery to set a trap in the first place.","Your character wants to study a security system.","Your character attempts to distract an opponent through guile or a feint, such as by throwing a handful of dirt in their eyes during a fight.","Your character tries to surreptitiously slip a poison into someone\u2019s food or drink."],"text":"Most roleplaying games have a long and storied tradition of characters disarming traps, picking locks, and (if those tasks fail) breaking out of prison. In our game, characters perform those activities with the Skulduggery skill."},{"category":"General","avoid-when":["Your character tries to pick someone\u2019s pocket. Your character needs Skulduggery for this activity.","Your character tries to remain hidden when their opponent has no chance of spotting them, such as if they try to avoid being seen by an aircraft during a blizzard at midnight.","Your character has no realistic chance of hiding from an opponent, such as if trying to hide from a nearby person while in the middle of miles of salt flats at noon."],"name":"Stealth","source":{"book":"crb","page":64},"characteristic":"agility","id":"stealth","use-when":["Your character attempts to hide from someone.","Your character tries to tail someone through a crowd, and to do it without being noticed.","Your character tries to infiltrate a government installation while avoiding both electronic security and human guards.","Your character tries to move quietly through a house."],"text":"When your character wants to act unnoticed by anyone else, they use the Stealth skill. In many ways, Stealth is one of the simpler skills, and it covers a pretty specific set of activities."},{"category":"General","avoid-when":["Your character tries to find their way around a rural or wilderness environment. In this case, your character should be using Survival.","Your character interacts with the upper crust of society. Charm (or possibly Deception or Coercion) may serve the character better here.","Your character has already established themself as a member of the criminal underworld, and is continuing to interact with other criminals. Streetwise lets your character fit in, know how to act, and know what topics to bring up and what to avoid. However, it shouldn\u2019t replace social skills."],"name":"Streetwise","source":{"book":"crb","page":65},"characteristic":"cunning","id":"streetwise","use-when":["Your character looks for a merchant who sells black-market goods or illegal services.","Your character wants to understand particular references or slang in a conversation.","Your character tries to approach criminals and start up a conversation without appearing like an outsider or a threat.","Your character tries to find their way around an unfamiliar city.","Your character tries to track and hunt someone somewhere in a city."],"text":"Some call it the \u201Cschool of hard knocks,\u201D while others refer to it as \u201Cstreet smarts\u201D or \u201Cgut instincts,\u201D but in all cases, the Streetwise skill is your character\u2019s ability to survive and thrive in rough and dangerous urban areas. If your character has ranks in Streetwise, they instinctively know how criminals tend to operate, which locations to avoid after dark, where to go to obtain illicit drugs and services, and other information crucial for making their way in the seedy underbelly of a major city."},{"category":"General","avoid-when":["Your character uses a highly accurate and detailed map to find a location.","Your character tries to find their way around an urban environment. In this case, your character should be using Streetwise.","Your character interacts with an animal that already likes or respects your character, or your character asks an animal to do something completely within their nature (they wouldn\u2019t need to make a Survival check to get a dog to play \u201Cfetch,\u201D for example)."],"name":"Survival","source":{"book":"crb","page":65},"characteristic":"cunning","id":"survival","use-when":["Your character is trapped in the wilderness and needs to find food and potable water.","Your character needs to notice approaching severe weather and know how to prepare for it.","Your character needs to follow a crude map or directions through a rural area to find a specific location.","Your character tries to tame or calm a wild animal, or handle a domesticated animal.","Your character hunts something (or someone!) through a wilderness setting."],"text":"There are a thousand tricks your character needs to master in order to survive in the wilderness, and the more ranks in Survival they have, the more likely they are to know them. The Survival skill covers your character\u2019s ability to find food and water, cope with dangerous conditions, hunt and skin animals, and, well, survive in any location that doesn\u2019t have a supermarket on the corner."},{"category":"General","avoid-when":["You are determining Initiative order when your character is not surprised (such as when they are the ambushers, instead of the ambushed). In this case, your character uses Cool instead.","Your character actively looks for something. This calls for a Perception check."],"name":"Vigilance","source":{"book":"crb","page":65},"characteristic":"willpower","id":"vigilance","use-when":["Your character just got ambushed, and you are rolling to determine Initiative order. A high Vigilance means your character has a better chance of reacting quickly to the threat.","Your character is being lied to; the opponent\u2019s Deception check is opposed by your character\u2019s Vigilance skill.","Your character has a chance to notice important details in their surroundings while not looking for them directly."],"text":"Vigilance represents the ability to be constantly aware of your surroundings, often without consciously making the effort. Characters with ranks in Vigilance are more likely to spot threats in their environment, notice important clues out of the corner of their eye, and catch lies as they\u2019re being told."}],"crits":[{"id":"agonizing-wound","name":"Agonizing Wound","roll":[56,60],"severity":2,"text":"The target increases the difficulty of all Brawn and Agility checks by one until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"at-the-brink","name":"At the Brink","roll":[91,95],"severity":3,"text":"The target suffers 2 strain each time they perform an action until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"bleeding-out","name":"Bleeding Out","roll":[131,140],"severity":4,"text":"Until this Critical Injury is healed, every round, the target suffers 1 wound and 1 strain at the beginning of their turn. For every 5 wounds they suffer beyond their wound threshold, they suffer one additional Critical Injury. Roll on the chart, suffering the injury (if they suffer this result a second time due to this, roll again).","source":{"book":"crb","page":115}},{"id":"blinded","name":"Blinded","roll":[116,120],"severity":3,"text":"The target can no longer see. Upgrade the difficulty of all checks twice, and upgrade the difficulty of Perception and Vigilance checks three times, until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"bowled-over","name":"Bowled Over","roll":[41,45],"severity":2,"text":"The target is knocked prone and suffers 1 strain.","source":{"book":"crb","page":115}},{"id":"compromised","name":"Compromised","roll":[86,90],"severity":2,"text":"Increase difficulty of all skill checks by one until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"crippled","name":"Crippled","roll":[96,100],"severity":3,"text":"One of the target\u2019s limbs (selected by the GM) is impaired until this Critical Injury is healed. Increase difficulty of all checks that require use of that limb by one.","source":{"book":"crb","page":115}},{"id":"dead","name":"Dead","roll":[151,null],"severity":0,"text":"Complete, obliterated death.","source":{"book":"crb","page":115}},{"id":"discouraging-wound","name":"Discouraging Wound","roll":[26,30],"severity":1,"text":"Move one player pool Story Point to the Game Master pool (reverse if NPC).","source":{"book":"crb","page":115}},{"id":"distracted","name":"Distracted","roll":[16,20],"severity":1,"text":"The target cannot perform a free maneuver during their next turn.","source":{"book":"crb","page":115}},{"id":"fearsome-wound","name":"Fearsome Wound","roll":[51,55],"severity":2,"text":"The target increases the difficulty of all Presence and Willpower checks by one until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"gruesome-injury","name":"Gruesome Injury","roll":[126,130],"severity":4,"text":"Roll 1d10 to determine which of the target\u2019s characteristics is affected: 1\u20133 for Brawn, 4\u20136 for Agility, 7 for Intellect, 8 for Cunning, 9 for Presence, 10 for Willpower. That characteristic is permanently reduced by one, to a minimum of 1.","source":{"book":"crb","page":115}},{"id":"hamstrung","name":"Hamstrung","roll":[71,75],"severity":2,"text":"The target loses their free maneuver until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"head-ringer","name":"Head Ringer","roll":[46,50],"severity":2,"text":"The target increases the difficulty of all Intellect and Cunning checks by one until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"horrific-injury","name":"Horrific Injury","roll":[106,110],"severity":3,"text":"Roll 1d10 to determine which of the target\u2019s characteristics is affected: 1\u20133 for Brawn, 4\u20136 for Agility, 7 for Intellect, 8 for Cunning, 9 for Presence, 10 for Willpower. Until this Critical Injury is healed, treat that characteristic as one point lower.","source":{"book":"crb","page":115}},{"id":"knocked-senseless","name":"Knocked Senseless","roll":[121,125],"severity":3,"text":"The target is staggered until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"maimed","name":"Maimed","roll":[101,105],"severity":3,"text":"One of the target\u2019s limbs (selected by the GM) is permanently lost. Unless the target has a cybernetic or prosthetic replacement, the target cannot perform actions that would require the use of that limb. All other actions gain [setback] until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"minor-nick","name":"Minor Nick","roll":[1,5],"severity":1,"text":"The target suffers 1 strain.","source":{"book":"crb","page":115}},{"id":"off-balance","name":"Off-Balance","roll":[21,25],"severity":1,"text":"Add [setback] to the target\u2019s next skill check.","source":{"book":"crb","page":115}},{"id":"overpowered","name":"Overpowered","roll":[76,80],"severity":2,"text":"The target leaves themself open, and the attacker may immediately attempt another attack against them as an incidental, using the exact same pool as the original attack.","source":{"book":"crb","page":115}},{"id":"scattered-senses","name":"Scattered Senses","roll":[66,70],"severity":2,"text":"The target removes all [boost] from skill checks until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"slightly-dazed","name":"Slightly Dazed","roll":[61,65],"severity":2,"text":"The target is disoriented until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"slowed-down","name":"Slowed Down","roll":[6,10],"severity":1,"text":"The target can only act during the last allied Initiative slot on their next turn.","source":{"book":"crb","page":115}},{"id":"stinger","name":"Stinger","roll":[36,40],"severity":1,"text":"Increase the difficulty of the target\u2019s next check by one.","source":{"book":"crb","page":115}},{"id":"stunned","name":"Stunned","roll":[31,35],"severity":1,"text":"The target is staggered until the end of their next turn.","source":{"book":"crb","page":115}},{"id":"sudden-jolt","name":"Sudden Jolt","roll":[11,15],"severity":1,"text":"The target drops whatever is in hand.","source":{"book":"crb","page":115}},{"id":"temporarily-disabled","name":"Temporarily Disabled","roll":[111,115],"severity":3,"text":"The target is immobilized until this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"the-end-is-nigh","name":"The End Is Nigh","roll":[141,150],"severity":4,"text":"The target dies after the last Initiative slot during the next round unless this Critical Injury is healed.","source":{"book":"crb","page":115}},{"id":"winded","name":"Winded","roll":[81,85],"severity":2,"text":"The target cannot voluntarily suffer strain to activate any abilities or gain additional maneuvers until this Critical Injury is healed.","source":{"book":"crb","page":115}}],"armor":[{"group":"Clothing","encumbrance":1,"name":"Concealed Buckyweave","hard-points":2,"source":{"book":"sotb","page":95},"setting":"android","defense":1,"id":"concealed-buckyweave-android","kind":"armor","rarity":5,"soak":1,"price":320,"text":"Everyday clothes with protective fibre woven in. Looks like nothing, stops a little."},{"group":"Clothing","encumbrance":1,"name":"Durable Clothing","hard-points":1,"source":{"book":"sotb","page":95},"setting":"android","defense":0,"id":"durable-clothing-android","kind":"armor","rarity":1,"soak":1,"price":50,"text":"Tough workwear that turns scrapes and minor hits."},{   // ---------- Library (injected by bb proto-build from content/, Android setting) ----------
  const KEY_OF = { brawn: "Br", agility: "Ag", intellect: "Int", cunning: "Cun", willpower: "Will", presence: "Pr" };

  const STAT_OF = Object.fromEntries(SKILLS.flatMap(([, l]) => l));
  const CHAR_NAMES = { Br: "Brawn", Ag: "Agility", Int: "Intellect", Cun: "Cunning", Will: "Willpower", Pr: "Presence" };
  const find = (type, id) => CONTENT[type].find((e) => e.id === id);

  const SYM_TOKENS = { success: "s", advantage: "a", threat: "t", failure: "f", triumph: "r", despair: "d" };
  // Book text marks dice and symbols as [ability], [advantage] ...; draw them as the roller's icons.

    .replace(/\[(\w+)\]/g, (m, k) => SYM_TOKENS[k] ? `<span class="glyph" title="${k}">${sym(SYM_TOKENS[k])}</span>`
      : DICE[k] ? `<span class="glyph">${dieSVG(k, null, DICE[k].name)}</span>` : m);
  // Talents whose effect the sheet applies to derived stats.
  const TALENT_MODS = { toughened: { wounds: 2 }, grit: { strain: 1 } };

  // ---------- Sample character: Prance Galavent, built with the builder's rules from the Android library ----------
  // XP: Natural 120 + Obligation magnitude 10 + 15 earned = 145. Spent 130: Agility and Cunning to 3 (60),

  const ARCH = find("archetypes", "natural"), CAREER = find("careers", "courier");

    crits: [{ ...find("crits", "minor-nick"), roll: 4, session: "Session 3" }],

    ],

  const isCareer = (skill) => C.career.skills.includes(skill);
  const CRIT_TABLE = CONTENT.crits.slice().sort((a, b) => a.roll[0] - b.roll[0]);
  const SEV = ["\u2013", "Easy", "Average", "Hard", "Daunting"];

  ];
  // Table I.6-2 (CRB p.104): what Advantage and Triumph buy. "Recover 1 strain" applies itself to the sheet.
  const ADV_OPTS = CONTENT["spend-results"].filter((o) => o.side === "positive")

    .map((o) => ({ cost: o.crit ? "crit" : o.cost.advantage || (o.cost.triumph === 2 ? "rr" : "r"), orTriumph: !!o.cost["or-triumph"],
      label: o.name, attackOnly: o.crit, effect: /^Recover 1 strain/.test(o.name) ? { strain: -1 } : null, source: o.source }));

  // ---------- Derived stats (each one says where its number comes from) ----------
  const talentMod = (k) => C.talents.reduce((n, t) => n + ((TALENT_MODS[t.id] || {})[k] || 0) * t.rank, 0);
  const worn = () => C.armor.filter((a) => a.worn);

  const armorOn = () => worn()[0];
  const itemEnc = (g) => (g.worn ? Math.max(0, (g.encumbrance || 0) - 3) : (g.encumbrance || 0)) * (g.qty || 1);
  const encOver = () => Math.max(0, [...C.weapons, ...C.armor, ...C.gear].reduce((n, g) => n + itemEnc(g), 0) - (5 + C.chars.Br));
  const derived = () => {
    const tw = talentMod("wounds"), ts = talentMod("strain"), a = armorOn(), as = a ? a.soak : 0, ad = Math.min(4, a ? a.defense : 0);
    const enc = [...C.weapons, ...C.armor, ...C.gear].reduce((n, g) => n + itemEnc(g), 0), over = encOver();
    return {

  function pips(cur, max, kind) {
    const n = Math.max(max, cur);
    return `<div class="pips ${kind}" style="--n:${n}" aria-hidden="true">${Array.from({ length: n }, (_, i) =>
      `<i class="${i < cur ? (i >= max ? "over" : "on") : ""}"></i>`).join("")}</div>`;
  }
  function trackCard(kind, cur, max, why) {
    const over = cur > max;
    const title = kind === "wound" ? "Wounds" : "Strain";
    const ctl = kind === "wound"
      ? `<button type="button" class="btn step" data-adj="wounds" data-by="-1" aria-label="Heal 1 wound">&minus;</button>
         <button type="button" class="btn step" data-adj="wounds" data-by="1" aria-label="Take 1 wound">+</button>
         <span class="hit"><label class="sr" for="hit">Incoming damage</label><input id="hit" type="number" inputmode="numeric" min="0" placeholder="Dmg" value="${esc(S.hit)}">
         <button type="button" class="btn" data-act="hit">Take hit</button></span>`
      : `<button type="button" class="btn step" data-adj="strain" data-by="-1" aria-label="Recover 1 strain">&minus;</button>
         <button type="button" class="btn step" data-adj="strain" data-by="1" aria-label="Suffer 1 strain">+</button>`;
    const alert = over ? `<div class="alert">Incapacitated: ${title.toLowerCase()} exceed threshold${kind === "wound" ? ' <button type="button" class="btn danger" data-act="crit">Roll critical injury</button>' : ""}</div>` : "";
    return `<div class="card track${over ? " over" : ""}"><div class="hd"><span class="label">${title}</span><span class="val"><b>${cur}</b> / ${max}</span></div>
      ${pips(cur, max, kind)}<div class="ctl">${ctl}</div>${alert}<div class="note">Threshold ${why}</div></div>`;
  }
  function renderVitals() {
    const d = derived();
    $("vitals").innerHTML = trackCard("wound", C.wounds, d.wounds, d.woundsWhy) + trackCard("strain", C.strain, d.strain, d.strainWhy) +
      `<div class="card small"><span class="label">Soak</span><b>${d.soak}</b><span class="why">${d.soakWhy}</span></div>
       <div class="card small"><span class="label">Defense</span><div class="pair"><div><b>${d.melee}</b><small>Melee</small></div><div><b>${d.ranged}</b><small>Ranged</small></div></div><span class="why">${esc(d.defWhy)}</span></div>
       <div class="card small"><span class="label">Encumbrance</span><b>${d.enc}<span style="font-size:18px;color:var(--muted)"> / ${d.encMax}</span></b>
         <div class="enc-bar"><i style="width:${Math.min(100, (d.enc / d.encMax) * 100)}%${d.over ? ";background:var(--bad)" : ""}"></i></div><span class="why">${d.encWhy}</span></div>`;
  }

  // ---------- Skills ----------
  const miniPool = (sp) => ["proficiency", "ability"].map((t) => Array.from({ length: sp[t] }, () => dieSVG(t, null, DICE[t].name)).join("")).join("");
  function skillsHTML() {
    const q = S.q.trim().toLowerCase();
    let html = "";
    for (const [group, list] of SKILLS) {
      const rows = list.filter(([n]) => !q || n.toLowerCase().includes(q));
      if (!rows.length) continue;
      html += `<div class="group"><span class="label">${group}</span>` + rows.map(([n, stat]) => {
        const rk = C.ranks[n] || 0, career = isCareer(n);
        return `<button type="button" class="srow" data-skill="${n}" aria-label="Roll ${n}, ${CHAR_NAMES[stat]} ${C.chars[stat]}, rank ${rk}${career ? ", career skill" : ""}">
          <span class="nm"><span class="dot${career ? "" : " off"}" title="${career ? "Career skill" : "Non-career skill"}"></span>${n}<i>${stat}</i></span>
          <span class="ranks" aria-hidden="true">${Array.from({ length: 5 }, (_, i) => `<i class="${i < rk ? "on" : ""}"></i>`).join("")}</span>
          <span class="mini">${miniPool(skillPool(n, stat))}</span></button>`;
      }).join("") + `</div>`;
    }
    return html || `<p class="note" style="padding:0 14px 12px">No skill matches \u201C${esc(S.q)}\u201D.</p>`;
  }
  function renderSkillsDesk() { $("skills-desk").innerHTML = skillsHTML(); }

  // ---------- Tabs ----------
  const TABS = [
    ["skills", "Skills", true], ["combat", "Combat"], ["talents", "Talents"], ["gear", "Gear"],
    ["crits", "Crits"], ["story", "Obligation & story"], ["notes", "Notes"], ["history", "History"],
  ];
  function renderTabs() {
    if (isDesk() && S.tab === "skills") S.tab = "combat";
    const count = { talents: C.talents.length, crits: C.crits.length, gear: C.weapons.length + C.armor.length + C.gear.length };
    $("tabs").innerHTML = TABS.filter(([, , phone]) => !(phone && isDesk())).map(([id, label]) =>
      `<button type="button" role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${label}${count[id] ? `<span class="count">${count[id]}</span>` : ""}</button>`).join("");
    renderTab();
  }
  function renderTab() {
    const fn = { skills: tabSkills, combat: tabCombat, talents: tabTalents, gear: tabGear, crits: tabCrits, story: tabStory, notes: tabNotes, history: tabHistory }[S.tab];
    $("tabbody").innerHTML = fn();
    $("tabbody").style.padding = S.tab === "skills" ? "8px 0" : "";
  }
  const tabSkills = () => `<label class="sr" for="q2">Filter skills</label><input class="search" id="q2" type="search" placeholder="Filter skills\u2026" value="${esc(S.q)}" autocomplete="off"><div id="skills-phone">${skillsHTML()}</div>`;

  function weaponCard(w) {
    return `<div class="item weap"><div><div class="row1"><h3>${esc(w.name)}</h3><span class="meta">${w.skill}</span>${cite(w.source)}</div>
      <div class="stats-row"><span>Dmg <b>${weaponBase(w)}</b>${w["adds-brawn"] ? " (Br+" + w["damage-bonus"] + ")" : ""}</span><span>Crit <b>${w.crit}</b></span><span>Range <b>${w.range}</b></span>${qualityText(w).map((q) => `<span class="tag">${q}</span>`).join("")}</div></div>
      <span><button type="button" class="btn primary" data-weapon="${esc(w.id)}">Attack</button> <span class="mini" style="display:inline-flex">${miniPool(skillPool(w.skill, STAT_OF[w.skill]))}</span></span></div>`;
  }
  function tabCombat() {
    const d = derived();
    return `<div class="sect"><h3>Attacks</h3><div class="list">${C.weapons.map(weaponCard).join("")}</div></div>
      <div class="sect"><h3>Initiative</h3><div class="list"><div class="item"><p>Roll Cool if you saw it coming, Vigilance if you didn't.</p>
        <div class="acts"><button type="button" class="btn" data-skill="Cool">Cool ${miniPool(skillPool("Cool", "Pr"))}</button>
        <button type="button" class="btn" data-skill="Vigilance">Vigilance ${miniPool(skillPool("Vigilance", "Will"))}</button></div>
        <p class="note">Rapid Reaction: you may suffer up to ${(C.talents.find((t) => t.id === "rapid-reaction") || { rank: 0 }).rank} strain to add that many successes.</p></div></div></div>
      <div class="sect"><h3>Defenses</h3><dl class="kv"><dt>Soak</dt><dd>${d.soak} (${d.soakWhy})</dd><dt>Defense</dt><dd>Melee ${d.melee}, ranged ${d.ranged}</dd>
        <dt>Active crits</dt><dd>${C.crits.length} (+${C.crits.length * 10} to the next critical roll)</dd></dl></div>`;
  }
  // A ranked talent's later ranks count one tier higher each (CRB p.72).
  const slotTiers = (t) => Array.from({ length: t.ranked ? t.rank : 1 }, (_, i) => Math.min(5, t.tier + i));
  function pyramidHTML() {
    const counts = [1, 2, 3, 4, 5].map((t) => C.talents.flatMap(slotTiers).filter((x) => x === t).length);
    const ok = counts.every((c, i) => i === 0 || c === 0 || c < counts[i - 1]);
    const rows = [5, 4, 3, 2, 1].map((t) => {
      const have = counts[t - 1], slots = Math.max(have, 6 - t);
      return `<div class="tier"><span>Tier ${t}</span>${Array.from({ length: slots }, (_, i) => `<i class="slot${i < have ? " on" : ""}"></i>`).join("")}</div>`;
    }).join("");
    return `<div class="pyramid" aria-label="Talent pyramid: ${counts.map((c, i) => `tier ${i + 1}: ${c}`).join(", ")}">${rows}</div>
      <p class="pyr-ok" style="${ok ? "" : "color:var(--bad)"}">${ok ? "Pyramid is valid. Each tier has more talents than the tier above it." : "Pyramid broken: a tier needs more talents than the tier above it."}</p>`;
  }
  function tabTalents() {
    const items = [...C.talents].sort((a, b) => a.tier - b.tier || a.name.localeCompare(b.name)).map((t) =>
      `<div class="item"><div class="row1"><h3>${t.name}${t.ranked ? ` <span class="mono" style="font-weight:400">${t.rank}</span>` : ""}</h3>
        <span class="tag">Tier ${t.tier}</span><span class="tag">${esc(t.activation)}</span>${t.ranked ? '<span class="tag">Ranked</span>' : ""}${TALENT_MODS[t.id] ? '<span class="tag">Applied to sheet</span>' : ""}${cite(t.source)}</div><p>${rich(t.text)}</p></div>`).join("");
    return pyramidHTML() + `<div class="list">${items}</div>`;
  }
  function tabGear() {
    const d = derived();
    const armor = C.armor.map((a) => `<div class="item"><div class="row1"><h3>${a.name}</h3>${a.worn ? '<span class="tag">Worn</span>' : ""}</div>
      <div class="meta">Soak +${a.soak} \u00B7 Defense ${a.defense} \u00B7 Encumbrance ${a.encumbrance} \u00B7 HP ${a["hard-points"] ?? 0} ${cite(a.source)}</div></div>`).join("");
    const gear = C.gear.map((g, i) => `<div class="item"><div class="row1"><h3>${esc(g.name)}</h3><span class="meta">\u00D7${g.qty} \u00B7 Enc ${g.encumbrance || 0}</span>${cite(g.source)}</div>
      ${isPainkiller(g) ? `<p>A painkiller: heals 5 wounds, one fewer for each one already used today (CRB p.116). ${C.painkillers ? `${C.painkillers} used today.` : ""}</p>
      <div class="acts"><button type="button" class="btn" data-use="${i}" ${g.qty && C.painkillers < 5 ? "" : "disabled"}>Use (${g.qty} left, heals ${painkillerHeal()})</button></div>` : ""}</div>`).join("");
    const weapons = C.weapons.map((w) => `<div class="item"><div class="row1"><h3>${esc(w.name)}</h3><span class="meta">Enc ${w.encumbrance} \u00B7 HP ${w["hard-points"] ?? 0}</span>${cite(w.source)}</div>
      <div class="meta">${w.skill} \u00B7 Dmg ${w["adds-brawn"] ? "+" + w["damage-bonus"] : w.damage} \u00B7 Crit ${w.crit} \u00B7 ${w.range}${qualityText(w).length ? " \u00B7 " + qualityText(w).join(", ") : ""}</div></div>`).join("");
    return `<div class="sect"><dl class="kv"><dt>Credits</dt><dd class="mono">${C.credits}</dd><dt>Encumbrance</dt><dd>${d.enc} of ${d.encMax}</dd></dl></div>
      <div class="sect"><h3>Weapons</h3><div class="list">${weapons}</div></div>
      <div class="sect"><h3>Armor</h3><div class="list">${armor}</div></div>
      <div class="sect"><h3>Gear</h3><div class="list">${gear}</div></div>`;
  }
  function tabCrits() {
    const bonus = C.crits.length * 10;
    const last = S.lastCrit ? `<span>Rolled <b>${S.lastCrit.raw}</b> + ${S.lastCrit.bonus} = <b>${S.lastCrit.total}</b>: <strong>${esc(S.lastCrit.name)}</strong></span>` : "";
    const list = C.crits.length ? C.crits.map((c, i) => `<div class="item"><div class="row1"><h3>${esc(c.name)}</h3><span class="tag">${c.severity ? SEV[c.severity] + " to heal" : "Can't be healed"}</span><span class="meta">rolled ${c.roll} \u00B7 ${c.session}</span>${cite(c.source)}</div>
      <p>${rich(c.text)}</p><div class="acts"><button type="button" class="btn" data-heal="${i}">Mark healed</button></div></div>`).join("") : `<p class="note">No active critical injuries.</p>`;
    return `<div class="critroll"><button type="button" class="btn danger" data-act="crit">Roll critical injury</button><span class="meta">d100 + ${bonus} for ${C.crits.length} active</span>${last}</div>
      <div class="list">${list}</div><p class="note">Results come from Table I.6\u201310: Critical Injury Result ${cite({ book: "crb", page: 115 })}.</p>`;
  }
  function tabStory() {
    const ob = C.obligation, kind = ob.type.kind === "secret" ? "Secret" : "Obligation";
    return `<div class="sect"><h3>${kind}</h3><div class="item"><div class="debt-big"><b>${ob.magnitude}</b><span>${esc(ob.type.name)}, tied to <span class="corp">${esc(ob.attachment)}</span></span><span class="tag">Magnitude</span>${cite({ book: "house" })}</div>
        <p>${esc(ob.why)}</p>${ob.log.map((l) => `<p class="meta">${l.when}: ${esc(l.text)}</p>`).join("")}
        <p class="note">Each session the GM rolls d100 against the party's total magnitude. When yours comes due: \u22122 strain threshold for you, \u22121 for everyone else, doubled on doubles.</p></div></div>
      <div class="sect"><h3>Motivations</h3><div class="list">${C.motivations.map(([k, v, t]) => `<div class="item"><div class="row1"><span class="label">${k}</span><h3>${v}</h3></div><p>${t}</p></div>`).join("")}</div></div>
      <div class="sect"><h3>Session 0</h3><div class="item"><p class="meta">${C.session0.q}</p><p>${C.session0.a}</p>
        <p class="note"><span class="tag gm">GM</span> Your GM has tied this answer to a later act.</p></div></div>`;
  }
  const tabNotes = () => `<label class="label" for="notes">Notes only you and the GM can see</label><textarea id="notes">${esc(C.notes)}</textarea><p class="note">Saves as you type.</p>`;
  const tabHistory = () => `<ul class="hist">${C.history.map((h) => `<li><time>${h.when}</time><span>${esc(h.text)}</span></li>`).join("")}</ul>`;

  // ---------- Roll drawer ----------
  function openRoll(check, pool) {
    S.d = { open: true, check, pool, base: { ...pool }, ladder: check.ladder ?? 2, result: null };
    applyLadder(S.d.ladder);
    renderDrawer();
    $("scrim").hidden = false; $("drawer").hidden = false;
    $("drawer").querySelector(".rollbtn").focus();
  }
  function closeRoll() { S.d.open = false; $("scrim").hidden = true; $("drawer").hidden = true; }
  function applyLadder(i) { S.d.ladder = i; S.d.pool.difficulty = LADDER[i].n; S.d.pool.challenge = 0; }
  const dTotal = () => ORDER.reduce((n, t) => n + S.d.pool[t], 0);

  function drawerPoolHTML() {
    const p = S.d.pool, chk = S.d.check;
    const pos = ORDER.filter((t) => DICE[t].pos).flatMap((t) => Array(p[t]).fill(t));
    const neg = ORDER.filter((t) => !DICE[t].pos).flatMap((t) => Array(p[t]).fill(t));
    const btn = (t) => `<button type="button" class="die" data-remove="${t}" title="Remove a ${DICE[t].name} die">${dieSVG(t, null, "Remove " + DICE[t].name + " die")}</button>`;
    const attack = chk.weapon && chk.weapon.range !== "Engaged";
    return `<div class="tray" aria-label="Pool. Tap a die to remove it.">${dTotal() ? pos.map(btn).join("") + (pos.length && neg.length ? '<span class="vs">VS</span>' : "") + neg.map(btn).join("") : '<span class="meta">Empty pool</span>'}</div>
      <div><span class="label">${attack ? "Difficulty \u00B7 range to target" : "Difficulty"}</span><div class="chips">${LADDER.map((l, i) =>
        `<button type="button" class="chip" data-ladder="${i}" aria-pressed="${S.d.ladder === i && p.difficulty + p.challenge === l.n}">${l.name}<span class="dp">${"<i></i>".repeat(l.n)}</span>${attack && l.range ? `<small>${l.range}</small>` : ""}</button>`).join("")}</div></div>
      <div class="chips">
        <button type="button" class="chip" data-add="boost">${dieSVG("boost", null, "Boost")} + Boost</button>
        <button type="button" class="chip" data-add="setback">${dieSVG("setback", null, "Setback")} + Setback</button>
        <button type="button" class="chip sp" data-act="sp-upgrade" ${playerPoints() ? "" : "disabled"}><span class="tok-mini" aria-hidden="true"></span>Story point: upgrade (${playerPoints()} left)</button>
        <button type="button" class="chip" data-up="ability">Upgrade ability</button>
        <button type="button" class="chip" data-up="difficulty">Upgrade difficulty</button></div>
      <button type="button" class="rollbtn" data-act="roll" ${dTotal() && !Dice3D.busy ? "" : "disabled"}>Roll</button>`;
  }
  function renderDrawer() {
    const chk = S.d.check;
    $("drawer").innerHTML = `<div class="grab" aria-hidden="true"></div><header><div><h2 id="d-title">${chk.label}</h2><div class="meta">${chk.meta}</div></div>
      <button type="button" class="x" data-act="close" aria-label="Close roll">\u00D7</button></header>
      <div class="body">${S.d.result ? resultHTML() : drawerPoolHTML()}</div>`;
  }

  function verdictText(r) {
    const a = r.netA > 0 ? (r.success ? ", with Advantage" : ", but with Advantage") : r.netA < 0 ? (r.success ? ", but with Threat" : ", with Threat") : "";
    return (r.success ? "Success" : "Failure") + a;
  }
  function flavor(r) {
    if (r.success && r.netA > 0) return "You do it, and something extra goes your way.";
    if (r.success && r.netA < 0) return "You do it, but it costs you.";
    if (!r.success && r.netA > 0) return "It doesn't work, but you get something out of it.";
    if (!r.success && r.netA < 0) return "It doesn't work, and things get worse.";
    return r.success ? "You do it, cleanly." : "It doesn't work.";
  }
  const remaining = (r) => r.spent.reduce((acc, s) => ({ adv: acc.adv - s.paidA, tri: acc.tri - s.paidR }), { adv: Math.max(0, r.netA), tri: r.triumph });
  // Costs from Table I.6-2: N Advantage (or one Triumph where the book allows it), one Triumph, or two Triumphs.
  function payment(opt, haveA, haveR, crit) {
    if (opt.cost === "r") return haveR >= 1 ? { paidA: 0, paidR: 1 } : null;
    if (opt.cost === "rr") return haveR >= 2 ? { paidA: 0, paidR: 2 } : null;
    const need = opt.cost === "crit" ? crit : opt.cost;
    if (haveA >= need) return { paidA: need, paidR: 0 };
    return opt.orTriumph && haveR >= 1 ? { paidA: 0, paidR: 1 } : null;
  }
  const costIcons = (o, crit) => (o.cost === "r" ? sym("r") : o.cost === "rr" ? sym("r", 2) : sym("a", o.cost === "crit" ? crit : o.cost));
  function spendHTML(r) {
    const w = S.d.check.weapon, crit = w ? w.crit : 0, rem = remaining(r);
    let html = "";
    if (r.netA > 0 || r.triumph > 0) {
      html += `<div><h4>Spend Advantage &amp; Triumph <span class="left">${rem.adv} ${sym("a")} ${rem.tri} ${sym("r")} left</span></h4>` +
        ADV_OPTS.map((o, i) => ({ o, i })).filter(({ o }) => !o.attackOnly || w).map(({ o, i }) =>
          `<button type="button" class="opt" data-spend="${i}" ${payment(o, rem.adv, rem.tri, crit) ? "" : "disabled"}><span class="cost">${costIcons(o, crit)}</span><span>${rich(o.label)}${o.cost === "crit" ? ` (Crit ${crit})` : ""}</span></button>`).join("") +
        `<p class="note">Options from Table I.6\u20132 ${cite({ book: "crb", page: 104 })}.</p>` +
        (r.spent.length ? `<div class="spent">${r.spent.map((s) => `<span>${s.label}</span>`).join("")}<button type="button" class="linkbtn" data-act="undo">Undo last</button></div>` : "") + `</div>`;
    }
    if (r.netA < 0 || r.despair > 0) html += `<div class="readonly">The GM spends ${Math.max(0, -r.netA)} Threat${r.despair ? ` and ${r.despair} Despair` : ""} on their screen. What they pick shows up here and in your history.</div>`;
    return html;
  }
  function resultHTML() {
    const r = S.d.result, w = S.d.check.weapon;
    const n = (s, count, name) => count ? `<span class="n">${sym(s)}<b>${count}</b> ${name}${count > 1 && name !== "Despair" ? (name.endsWith("s") ? "es" : "s") : ""}</span>` : "";
    let html = `<div class="verdict"><h3 class="${r.success ? "ok" : "no"}">${verdictText(r)}</h3><p>${flavor(r)}</p></div>
      <div class="net">${r.netS > 0 ? n("s", r.netS, "Success") : n("f", -r.netS, "Failure")}${r.netA > 0 ? n("a", r.netA, "Advantage") : n("t", -r.netA, "Threat")}${n("r", r.triumph, "Triumph")}${n("d", r.despair, "Despair")}
        ${r.netS === 0 && r.netA === 0 && !r.triumph && !r.despair ? '<span class="n">Everything cancelled</span>' : ""}</div>
      <div class="rolled${r.tumble ? " tumble" : ""}" aria-label="Dice rolled">${r.dice.map((d) => dieSVG(d.type, d.face)).join("")}</div>`;
    if (w && r.success) {
      const base = weaponBase(w), rem = remaining(r);
      html += `<div class="dmg"><span class="label">Damage</span><b>${base + r.netS}</b><span>${base} base + ${r.netS} net success</span>${rem.adv >= w.crit || rem.tri > 0 ? `<span class="crit">Critical available (Crit ${w.crit})</span>` : ""}</div>`;
    }
    if (S.d.check.kind === "recover" && r.netS > 0) html += `<button type="button" class="btn primary" data-act="recover">Recover ${r.netS} strain</button>`;
    return html + spendHTML(r) + `<button type="button" class="btn" data-act="again">Roll again</button>`;
  }

  function doRoll() {
    if (!dTotal() || Dice3D.busy) return;
    const types = poolList(S.d.pool);
    const done = (dice, tumble) => {
      S.d.result = { ...scoreDice(dice), spent: [], tumble };
      log(`Rolled ${S.d.check.label}: ${verdictText(S.d.result)}`);
      $("live").textContent = verdictText(S.d.result);
      if (S.d.open) renderDrawer();
    };
    if (Dice3D.ok && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      $("drawer").querySelector(".rollbtn").disabled = true;
      Dice3D.roll(types, (dice) => done(dice, false));
    } else done(instantRoll(types), true);
  }
  function spend(i) {
    const r = S.d.result, o = ADV_OPTS[i], w = S.d.check.weapon, rem = remaining(r);
    const pay = payment(o, rem.adv, rem.tri, w ? w.crit : 0);
    if (!pay) return;
    r.spent.push({ label: o.label, ...pay, effect: o.effect });
    if (o.effect && o.effect.strain) C.strain = Math.max(0, C.strain + o.effect.strain);
    log(`Spent: ${o.label}`);
    renderDrawer(); renderVitals();
  }
  function undoSpend() {
    const s = S.d.result.spent.pop();
    if (s && s.effect && s.effect.strain) C.strain -= s.effect.strain;
    log(`Undid: ${s.label}`);
    renderDrawer(); renderVitals();
  }

  // ---------- Sheet actions ----------
  function adjust(key, by) {
    C[key] = Math.max(0, C[key] + by);
    log(`${by > 0 ? (key === "wounds" ? "Took" : "Suffered") : (key === "wounds" ? "Healed" : "Recovered")} ${Math.abs(by)} ${key === "wounds" ? "wound" : "strain"}${Math.abs(by) > 1 ? "s" : ""}`);
    renderVitals();
  }
  function takeHit() {
    const raw = parseInt(S.hit, 10);
    if (!(raw >= 0)) { toast("Enter the damage first"); return; }
    const d = derived(), dealt = Math.max(0, raw - d.soak);
    C.wounds += dealt; S.hit = "";
    log(`Hit for ${raw}, soaked ${raw - dealt}, took ${dealt} wound${dealt === 1 ? "" : "s"}`);
    toast(dealt ? `${raw} damage \u2212 ${d.soak} soak = ${dealt} wound${dealt === 1 ? "" : "s"}` : `Soak absorbed all ${raw} damage`);
    renderVitals();
  }
  function rollCrit() {
    const raw = rand(100) + 1, bonus = C.crits.length * 10, total = raw + bonus;
    const row = CRIT_TABLE.find(({ roll: [lo, hi] }) => total >= lo && (hi === null || total <= hi));
    S.lastCrit = { raw, bonus, total, name: row.name };
    C.crits.push({ ...row, roll: total, session: "Now" });
    log(`Critical injury: ${row.name} (rolled ${total})`);
    if (row.id === "discouraging-wound") { flipPoint("player", "Discouraging Wound: a player story point moved to the GM"); renderStory(); }
    S.tab = "crits"; renderTabs(); renderVitals();
  }
  function useGear(i) {
    const g = C.gear[i];
    if (!g.qty || !isPainkiller(g) || C.painkillers >= 5) return;
    const healed = Math.min(C.wounds, painkillerHeal());
    g.qty--; C.painkillers++; C.wounds -= healed;
    log(`Used ${g.name}: healed ${healed} wound${healed === 1 ? "" : "s"}`);
    toast(`${g.name}: healed ${healed}`);
    renderVitals(); renderTab();
  }
  function bestRecoveryCheck() {
    const opts = [["Cool", "Pr"], ["Discipline", "Will"]].map(([s, st]) => ({ s, st, p: skillPool(s, st) }));
    const score = (o) => o.p.proficiency * 2 + o.p.ability;
    return opts.sort((a, b) => score(b) - score(a))[0];
  }

  function renderAll() { renderStory(); renderHeader(); renderVitals(); renderSkillsDesk(); renderTabs(); }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) {
      if (S.spMenu && !e.target.closest("#sp-menu")) { S.spMenu = false; renderStory(); }
      if (e.target.id === "scrim") closeRoll();
      return;
    }
    const d = t.dataset;
    if (d.tok !== undefined) { if (STORY[Number(d.tok)] === "player") { S.spMenu = !S.spMenu; renderStory(); } return; }
    if (d.act === "sp-upgrade") { spendUpgrade(); return; }
    if (d.act === "sp-detail") { spendDetail(); return; }
    if (d.act === "sp-cancel") { S.spMenu = false; renderStory(); return; }
    if (S.spMenu && !t.closest("#sp-menu")) { S.spMenu = false; renderStory(); }
    if (d.tab) { S.tab = d.tab; renderTabs(); return; }
    if (d.skill) { const st = STAT_OF[d.skill], rk = C.ranks[d.skill] || 0; openRoll({ label: d.skill, meta: `${CHAR_NAMES[st]} ${C.chars[st]} \u00B7 Rank ${rk}${encNote(st)}` }, skillPool(d.skill, st)); return; }
    if (d.char) { openRoll({ label: `${CHAR_NAMES[d.char]} check`, meta: `${CHAR_NAMES[d.char]} ${C.chars[d.char]}, no skill` }, { ...emptyPool(), ability: C.chars[d.char] }); return; }
    if (d.weapon) {
      const w = C.weapons.find((x) => x.id === d.weapon), st = STAT_OF[w.skill];
      openRoll({ label: `${w.name} attack`, meta: `${w.skill} \u00B7 ${CHAR_NAMES[st]} ${C.chars[st]} \u00B7 Rank ${C.ranks[w.skill] || 0}${encNote(st)}`, weapon: w }, skillPool(w.skill, st)); return;
    }
    if (d.adj) { adjust(d.adj, Number(d.by)); return; }
    if (d.use !== undefined) { useGear(Number(d.use)); return; }
    if (d.heal !== undefined) { const c = C.crits.splice(Number(d.heal), 1)[0]; log(`Healed critical injury: ${c.name}`); renderTabs(); return; }
    if (d.remove) { S.d.pool[d.remove]--; renderDrawer(); return; }
    if (d.add) { S.d.pool[d.add]++; renderDrawer(); return; }
    if (d.ladder !== undefined) { applyLadder(Number(d.ladder)); renderDrawer(); return; }
    if (d.up) {
      const [lo, hi] = d.up === "ability" ? ["ability", "proficiency"] : ["difficulty", "challenge"];
      if (S.d.pool[lo] > 0) { S.d.pool[lo]--; S.d.pool[hi]++; } else S.d.pool[lo]++;
      renderDrawer(); return;
    }
    if (d.spend !== undefined) { spend(Number(d.spend)); return; }
    const act = d.act;
    if (act === "roll") doRoll();
    else if (act === "close") closeRoll();
    else if (act === "undo") undoSpend();
    else if (act === "again") { S.d.result = null; S.d.pool = { ...S.d.pool, boost: S.d.base.boost, setback: S.d.base.setback }; applyLadder(S.d.check.ladder ?? 2); renderDrawer(); }
    else if (act === "hit") takeHit();
    else if (act === "crit") rollCrit();
    else if (act === "recover") { const n = S.d.result.netS; C.strain = Math.max(0, C.strain - n); log(`End of encounter: recovered ${n} strain`); closeRoll(); renderVitals(); toast(`Recovered ${n} strain`); }
    else if (act === "spendxp") toast("Spending XP opens the character builder, the next prototype.");
    else if (t.id === "shortrest") { const b = bestRecoveryCheck(); openRoll({ label: `Recover strain: ${b.s}`, meta: `End of encounter \u00B7 Simple check, 1 strain back per success`, kind: "recover", ladder: 0 }, b.p); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "q" || e.target.id === "q2") {
      S.q = e.target.value;
      renderSkillsDesk();
      if (e.target.id === "q2") $("skills-phone").innerHTML = skillsHTML();
    }
    if (e.target.id === "hit") S.hit = e.target.value;
    if (e.target.id === "notes") { C.notes = e.target.value; try { localStorage.setItem("ttg-sheet-notes", C.notes); } catch (err) {} }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.spMenu) { S.spMenu = false; renderStory(); return; }
    if (e.key === "Escape" && S.d.open) closeRoll();
    if (e.key === "Enter" && e.target.id === "hit") takeHit();
    if (e.key.toLowerCase() === "r" && S.d.open && !S.d.result && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); doRoll(); }
  });
  let wasDesk = isDesk();
  window.addEventListener("resize", () => { if (isDesk() !== wasDesk) { wasDesk = isDesk(); renderTabs(); } });

  Dice3D.init();
  renderAll();
})();

</script>
